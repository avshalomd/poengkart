<noscript>
  <div style="padding:26px 22px;max-width:640px;font-size:15px;line-height:1.5">
    <h1 style="font-size:20px;margin-bottom:8px">Poengkart</h1>
    <p>Kartet krever JavaScript. Datasettet (poenggrenser for 228 videregående
       skoler i ni fylker, 2012–2026) kan lastes ned direkte som
       <a href="/data/schools.json">schools.json</a>.</p>
    <p style="margin-top:8px">This map needs JavaScript. The underlying dataset is
       available as <a href="/data/schools.json">schools.json</a>.</p>
  </div>
</noscript>
<div id="app" role="main">
<!-- The controls come first in the document, before the map's markers and the
     list's 228 rows: the List view draws this card above the table, and Tab
     used to reach it only after every row. Where it floats over the map, its
     z-index and #map's isolation keep it on top. -->
<div id="panel" class="glass" tabindex="-1">
  <div class="brand">
    <svg class="mark" viewBox="0 0 26 26" aria-hidden="true">
      <rect x="1" y="1" width="24" height="24" rx="7" fill="var(--accent)"/>
      <circle cx="13" cy="11" r="3.4" fill="#fff"/>
      <path d="M13 21c3.6-3.4 6-6.2 6-9.6A6 6 0 0 0 7 11.4C7 14.8 9.4 17.6 13 21z" fill="none" stroke="#fff" stroke-width="1.7"/>
    </svg>
    <h1>Poengkart</h1>
    <!-- Help and settings used to float over the map's top-right corner in a
         glass pill that had four homes: over the map, stepped left when the
         school sheet opened, inside this header at tablet widths and on
         phones, and docked in the list card's header. They live here now, in
         one place, at every width, and nothing about opening a school moves
         them. -->
    <div class="util">
      <!-- a report about the app as a whole: the view, the layout, the filters
           and the browser travel with it, so a fault can be reproduced -->
      <button class="ico" id="bug-btn" onclick="openBug(null, this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m8 2 1.88 1.88M14.12 3.88 16 2M9 7.13v-1a3 3 0 1 1 6 0v1"/>
          <path d="M12 20c-3.3 0-6-2.7-6-6v-3a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v3c0 3.3-2.7 6-6 6M12 20v-9M6.53 9C4.6 8.8 3 7.1 3 5M6 13H2M3 21c0-2.1 1.7-3.9 3.8-4M20.97 5c0 2.1-1.6 3.8-3.5 4M22 13h-4M17.2 17c2.1.1 3.8 1.9 3.8 4"/>
        </svg>
      </button>
      <!-- the language was one setting among theme and levels, three taps deep;
           a reader who needs English needs it before anything else -->
      <button class="ico lang" id="lang-btn" onclick="toggleLang()"></button>
      <button class="ico" id="help-btn" onclick="openIntro()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9"/><path d="M9.2 9.3a2.9 2.9 0 1 1 3.6 2.8v1.4"/>
          <path d="M12.4 17.2h.01"/>
        </svg>
      </button>
      <button class="ico" id="settings-btn" onclick="openSettings()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3.2"/>
          <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.56-1.11 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.01A1.7 1.7 0 0 0 10 3.09V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.01c.26.62.86 1.03 1.53 1.03H21a2 2 0 1 1 0 4h-.09c-.67 0-1.27.4-1.51 1.02z"/>
        </svg>
      </button>
    </div>
  </div>
  <p id="tagline"></p>
  <!-- search is its own control, not a third segment: it opens a sheet rather
       than switching the view. Same row and same height as the toggle, its own
       border. -->
  <div class="viewrow">
    <div class="seg" id="view-toggle" role="group">
      <button id="view-map" type="button" onclick="setView('map')" aria-pressed="true"></button>
      <button id="view-list" type="button" onclick="setView('list')" aria-pressed="false"></button>
      <!-- the pressed half is this accent copy of the labels, clipped to it:
           the clip slides, so the colour changes exactly where the pill is -->
      <span class="over" aria-hidden="true"><span></span><span></span></span>
    </div>
    <button class="ico" id="searchov-btn" onclick="openSearchOv()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/>
      </svg>
    </button>
  </div>
  <!-- on a phone the two selects fold into this line once the reader starts
       using the map (foldPanel); pressing it brings them back -->
  <button id="panel-sum" type="button" aria-expanded="false" onclick="unfoldPanel(event)">
    <span id="panel-sum-t"></span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
  </button>
  <div class="field" id="fylke-field" hidden>
    <label id="fylke-label" for="map-fylke"></label>
    <select id="map-fylke" onchange="onMapFylke(this.value)"></select>
  </div>
  <div class="field">
    <label id="cat-label" for="map-cat"></label>
    <select id="map-cat" onchange="onMapCat(this.value)"></select>
  </div>
  <div id="cat-note"></div>
  <!-- chance of a place: needs data/model.json; stays hidden without it -->
  <div class="field" id="pts-field" hidden>
    <label id="pts-label" for="my-points"></label>
    <div class="ptsrow">
      <input id="my-points" type="text" inputmode="decimal" autocomplete="off" spellcheck="false"
             maxlength="5" oninput="onPointsInput(this.value)" onchange="flushPoints()">
      <button id="pts-clear" type="button" onclick="onPoints(''); refocus('#my-points')" hidden><svg class="xi" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      <button id="calc-open" type="button" onclick="openCalc()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="4" y="2.5" width="16" height="19" rx="2.5"/>
          <path d="M8 7h8M8 11.5h.01M12 11.5h.01M16 11.5h.01M8 15.5h.01M12 15.5h.01M16 15.5h.01"/>
        </svg>
      </button>
    </div>
    <div id="pts-note"></div>
  </div>
  <!-- the reader's own list of choices, across schools -->
  <div id="choices" hidden></div>
</div>
  <div id="map"></div>
  <div id="listview" hidden></div>
  <aside id="side">
    <div class="scroll">
      <div class="photo" id="s-photo"></div>
      <div class="meta" id="s-meta"></div>
      <div class="notes" id="s-notes" hidden></div>
      <div class="hero" id="s-hero"></div>
      <div class="chance" id="s-chance" hidden></div>
      <div class="mixwarn" id="s-mix" hidden></div>
      <div class="chart-card">
        <div class="chart-head">
          <div class="tabs" id="tabs">
            <button data-mode="all"></button>
            <button data-mode="cat"></button>
            <button data-mode="prog"></button>
          </div>
          <select id="chart-cat" hidden></select>
        </div>
        <div id="chart-sub"></div>
        <div id="chart-wrap">
          <div id="chart-tip"></div>
          <!-- the figures behind the line reached a mouse or a finger only:
               the arrow keys step through the years, and the table says them -->
          <div id="chart-svg" role="img" aria-labelledby="chart-sub" aria-describedby="chart-keys" tabindex="0"></div>
          <span id="chart-keys" hidden></span>
          <table id="chart-data" class="vh"></table>
        </div>
      </div>
      <div id="s-list"></div>
      <div id="src-note"></div>
    </div>
  </aside>
</div>


<div id="tip" role="tooltip" hidden></div>

<div id="contact" class="modal" hidden onclick="if (event.target === this) closeContact()">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="contact-h">
    <button class="x" id="contact-x" onclick="closeContact()"><svg class="xi" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    <div class="head">
      <svg viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2"
           stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m3.6 6.4 8.4 6 8.4-6"/>
      </svg>
      <h2 id="contact-h"></h2>
    </div>
    <div id="contact-body"></div>
  </div>
</div>


<div id="legend" class="glass">
  <div class="t" id="legend-title"></div>
  <div class="sizenote" id="legend-zoom" hidden></div>
  <div class="bins" id="legend-bins"></div>
  <div class="sizenote warn" id="legend-mixed" hidden></div>
  <details class="more" id="legend-more">
    <summary><span class="mt" id="legend-more-t"></span><span class="lt" id="legend-less-t"></span></summary>
    <div class="sizenote" id="legend-size"></div>
    <div class="none"><span class="dot open-dot"></span><span id="legend-open"></span></div>
    <div class="none"><span class="dot held-dot"></span><span id="legend-held"></span></div>
    <div class="none"><span class="dot zero-dot"></span><span id="legend-zero"></span></div>
    <div class="none"><span class="dot"></span><span id="legend-none"></span></div>
  </details>
</div>

<div id="intro" class="modal" hidden onclick="if (event.target === this) closeIntro()">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="intro-h">
    <button class="x" id="intro-x" onclick="closeIntro()"><svg class="xi" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    <div class="head">
      <svg viewBox="0 0 26 26" aria-hidden="true">
        <rect x="1" y="1" width="24" height="24" rx="7" fill="var(--accent)"/>
        <circle cx="13" cy="11" r="3.4" fill="#fff"/>
        <path d="M13 21c3.6-3.4 6-6.2 6-9.6A6 6 0 0 0 7 11.4C7 14.8 9.4 17.6 13 21z" fill="none" stroke="#fff" stroke-width="1.7"/>
      </svg>
      <h2 id="intro-h" tabindex="-1"></h2>
    </div>
    <div id="intro-body"></div>
  </div>
</div>

<div id="settings" class="modal" hidden onclick="if (event.target === this) closeSettings()">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="settings-h">
    <button class="x" id="settings-x" onclick="closeSettings()"><svg class="xi" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    <div class="head">
      <svg viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3.2"/>
        <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.56-1.11 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.01A1.7 1.7 0 0 0 10 3.09V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.01c.26.62.86 1.03 1.53 1.03H21a2 2 0 1 1 0 4h-.09c-.67 0-1.27.4-1.51 1.02z"/>
      </svg>
      <h2 id="settings-h"></h2>
    </div>
    <div id="settings-body"></div>
  </div>
</div>

<div id="calc" class="modal" hidden onclick="if (event.target === this) closeCalc()">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="calc-h">
    <button class="x" id="calc-x" onclick="closeCalc()"><svg class="xi" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    <div class="head">
      <svg viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="4" y="2.5" width="16" height="19" rx="2.5"/><path d="M8 7h8M8 11.5h.01M12 11.5h.01M16 11.5h.01M8 15.5h.01M12 15.5h.01M16 15.5h.01"/>

      <h2 id="calc-h"></h2>

</div>

<div id="searchov" class="modal" hidden onclick="if (event.target === this) closeSearchOv()">
  <div class="ovbox" id="ov-box" role="dialog" aria-modal="true">
    <input id="ov-q" type="text" role="combobox" aria-expanded="false" aria-controls="ov-list"
           aria-autocomplete="list" autocomplete="off" spellcheck="false" autocapitalize="off">
    <button class="x" id="ov-x" onclick="closeSearchOv()"><svg class="xi" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    <div id="ov-list" role="listbox"></div>
  </div>
</div>

<div id="toast" hidden role="status"></div>
<!-- what a filter did, for a reader who cannot see the map redraw (say()) -->
<div id="sr-status" class="vh" role="status"></div>
