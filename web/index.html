<style>
  :root {
    color-scheme: light;
    --page: #f4f6f9;
    --surface: rgba(255,255,255,.85);
    --surface-solid: #ffffff;
    --ink: #0f1720; --ink-2: #46525e; --ink-3: #8b959f;
    --line: rgba(15,23,32,.09);
    --accent: #2a78d6; --accent-soft: rgba(42,120,214,.10);
    --context: #c3cdd6;
    --seq-250:#86b6ef; --seq-350:#5598e7; --seq-450:#2a78d6; --seq-550:#1c5cab; --seq-700:#0d366b;
    --shadow: 0 10px 32px rgba(15,23,32,.12), 0 1px 3px rgba(15,23,32,.08);
    --good: #0ca30c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --page: #0e1116;
      --surface: rgba(23,27,33,.85);
      --surface-solid: #171b21;
      --ink: #f2f5f8; --ink-2: #a9b4c0; --ink-3: #6d7681;
      --line: rgba(255,255,255,.09);
      --accent: #3987e5; --accent-soft: rgba(57,135,229,.14);
      --context: #3a4553;
      --seq-250:#9ec5f4; --seq-350:#6da7ec; --seq-450:#3987e5; --seq-550:#256abf; --seq-700:#184f95;
      --shadow: 0 10px 32px rgba(0,0,0,.45), 0 1px 3px rgba(0,0,0,.4);
    }
  }

  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page); color: var(--ink);
    font-size: 14px; -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }
  #app { display: flex; height: 100%; }
  #map { flex: 1; min-width: 0; background: var(--page); }
  .leaflet-container { font: inherit; }

  .glass {
    background: var(--surface);
    -webkit-backdrop-filter: blur(16px) saturate(1.5);
    backdrop-filter: blur(16px) saturate(1.5);
    border: 1px solid var(--line); border-radius: 16px;
    box-shadow: var(--shadow);
  }

  /* ---------- top-left control panel ---------- */
  #panel { position: absolute; top: 14px; left: 14px; z-index: 1000; width: 316px; padding: 16px 16px 14px; }
  .brand { display: flex; align-items: center; gap: 9px; }
  .brand .mark { width: 26px; height: 26px; flex: none; }
  .brand h1 { font-size: 19px; font-weight: 700; letter-spacing: -.02em; }
  #tagline { font-size: 12px; color: var(--ink-2); line-height: 1.45; margin: 8px 0 12px; }
  .field label { display: block; font-size: 10.5px; font-weight: 600; letter-spacing: .06em;
                 text-transform: uppercase; color: var(--ink-3); margin-bottom: 5px; }
  .field + .field { margin-top: 10px; }
  .field select {
    width: 100%; padding: 8px 10px; font: inherit; font-size: 13px; color: var(--ink);
    background: var(--surface-solid); border: 1px solid var(--line); border-radius: 10px;
    cursor: pointer; outline-offset: 2px;
  }
  #cat-note { font-size: 11px; color: var(--ink-3); margin-top: 6px; min-height: 14px; }

  /* ---------- intro / help ---------- */
  .modal {
    position: fixed; inset: 0; z-index: 2000; display: grid; place-items: center;
    padding: 18px; background: rgba(8,11,15,.58); backdrop-filter: blur(3px);
    animation: fade .18s ease-out;
  }
  .modal[hidden] { display: none; }
  @keyframes fade { from { opacity: 0 } }
  .modal .sheet {
    position: relative; width: min(560px, 100%); max-height: calc(100dvh - 36px);
    overflow: auto; background: var(--surface-solid); border: 1px solid var(--line);
    border-radius: 18px; box-shadow: var(--shadow); padding: 26px 26px 22px;
    animation: rise .22s cubic-bezier(.2,.8,.3,1);
  }
  @keyframes rise { from { transform: translateY(10px); opacity: 0 } }
  .modal .x {
    position: absolute; top: 14px; right: 14px; width: 30px; height: 30px;
    border: none; border-radius: 9px; background: var(--accent-soft);
    color: var(--ink-2); font-size: 15px; cursor: pointer; line-height: 1;
  }
  .modal .x:hover { color: var(--ink); }
  .modal .head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; padding-right: 34px; }
  .modal .head svg { width: 28px; height: 28px; flex: none; }
  .modal h2 { font-size: 20px; font-weight: 700; letter-spacing: -.02em; }
  #intro .lede { font-size: 14px; line-height: 1.5; color: var(--ink-2); margin-bottom: 18px; }
  #intro .step { display: flex; gap: 12px; margin-bottom: 15px; }
  #intro .n {
    flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--accent);
    color: #fff; font-size: 12px; font-weight: 700; display: grid; place-items: center;
    margin-top: 1px;
  }
  #intro .step h3 { font-size: 13.5px; font-weight: 650; margin-bottom: 3px; }
  #intro .step p { font-size: 13px; line-height: 1.5; color: var(--ink-2); }
  #intro .calc {
    display: flex; align-items: baseline; gap: 8px; margin: 9px 0 2px; padding: 9px 12px;
    background: var(--accent-soft); border-radius: 10px; font-size: 14px; color: var(--ink);
  }
  #intro .calc b { font-size: 17px; font-variant-numeric: tabular-nums; }
  #intro .keyrow { display: flex; gap: 16px; margin: 10px 0 2px; flex-wrap: wrap; }
  #intro .key { display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--ink-3); }
  #intro .key .swatch { flex: none; }
  #intro .caveat {
    font-size: 11.5px; line-height: 1.5; color: var(--ink-3);
    border-top: 1px solid var(--line); padding-top: 12px; margin-top: 16px;
  }
  .modal .cta {
    display: block; width: 100%; margin-top: 14px; padding: 11px; border: none;
    border-radius: 11px; background: var(--accent); color: #fff; font: inherit;
    font-size: 14px; font-weight: 650; cursor: pointer;
  }
  .modal .cta:hover { filter: brightness(1.06); }
  .modal .cta.ghost {
    margin-top: 8px; background: none; color: var(--ink-2);
    border: 1px solid var(--line); font-weight: 600;
  }
  .modal .cta.ghost:hover { filter: none; color: var(--ink); border-color: var(--ink-3); }

  /* ---------- utility window (top right) ---------- */
  #controls {
    position: absolute; top: 14px; right: 14px; z-index: 1000;
    display: flex; align-items: center; gap: 6px; padding: 6px;
  }
  #controls .lang { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  #controls .lang button {
    border: none; background: none; padding: 4px 9px; font-size: 11.5px; font-weight: 600;
    color: var(--ink-3); cursor: pointer; letter-spacing: .02em;
  }
  #controls .lang button.on { background: var(--accent); color: #fff; }
  #controls .ico {
    width: 28px; height: 28px; display: grid; place-items: center; padding: 0;
    border: 1px solid var(--line); border-radius: 8px; background: none;
    color: var(--ink-2); cursor: pointer;
  }
  #controls .ico:hover { color: var(--accent); border-color: var(--accent); }
  #controls .ico svg { width: 15px; height: 15px; }
  /* the sidebar slides in over this corner, so step out of its way */
  body.side-open #controls { right: calc(min(480px, max(320px, 100vw - 350px)) + 14px); }

  /* ---------- feedback form ---------- */
  #contact .sheet { max-width: 520px; }
  #contact label { display: block; font-size: 10.5px; font-weight: 600; letter-spacing: .06em;
                   text-transform: uppercase; color: var(--ink-3); margin: 12px 0 5px; }
  #contact select, #contact input, #contact textarea {
    width: 100%; padding: 9px 10px; font: inherit; font-size: 13.5px; color: var(--ink);
    background: var(--page); border: 1px solid var(--line); border-radius: 10px;
    outline-offset: 2px;
  }
  #contact textarea { min-height: 108px; resize: vertical; line-height: 1.45; }
  #contact .hint { font-size: 11.5px; color: var(--ink-3); margin: 0 0 6px; line-height: 1.45; }
  #contact .privacy {
    font-size: 11px; line-height: 1.5; color: var(--ink-3);
    border-top: 1px solid var(--line); padding-top: 11px; margin-top: 18px;
  }
  #contact .err {
    margin-top: 12px; padding: 9px 11px; border-radius: 9px; font-size: 12.5px;
    background: rgba(200,40,40,.12); color: #d0464a;
  }
  #contact .cta[disabled] { opacity: .55; cursor: progress; }
  /* honeypot: off-screen rather than display:none, which some bots skip */
  #contact .hp { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }
  #contact .done { text-align: center; padding: 14px 4px 4px; }
  #contact .done svg { width: 46px; height: 46px; margin-bottom: 12px; }
  #contact .done .big { font-size: 16px; font-weight: 650; color: var(--ink); margin-bottom: 4px; }
  #contact .done p { font-size: 13px; color: var(--ink-2); }
  #contact .done .cta { max-width: 220px; margin: 18px auto 0; text-align: center;
                        text-decoration: none; box-sizing: border-box; }

  /* ---------- tooltip ---------- */
  #tip {
    position: fixed; z-index: 2200; max-width: 260px; padding: 8px 10px;
    background: var(--surface-solid); color: var(--ink-2); border: 1px solid var(--line);
    border-radius: 10px; box-shadow: var(--shadow); font-size: 11.5px; line-height: 1.45;
    pointer-events: none; opacity: 0; transition: opacity .12s;
  }
  #tip.on { opacity: 1; }
  #tip b { color: var(--ink); }
  .tipped { cursor: help; text-decoration: underline dotted var(--ink-3); text-underline-offset: 2px; }

  /* ---------- legend ---------- */
  #legend { position: absolute; bottom: 22px; left: 14px; z-index: 1000; padding: 11px 14px 10px; font-size: 11px; color: var(--ink-2); }
  #legend .t { font-weight: 600; color: var(--ink); font-size: 11.5px; margin-bottom: 7px; letter-spacing: .01em; }
  #legend .bins { display: flex; align-items: center; gap: 0; }
  #legend .bin { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  #legend .sw { width: 34px; height: 8px; }
  #legend .bin:first-child .sw { border-radius: 4px 0 0 4px; }
  #legend .bin:last-child .sw { border-radius: 0 4px 4px 0; }
  #legend .bl { font-size: 9.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  #legend .none { display: flex; align-items: center; gap: 6px; margin-top: 7px; color: var(--ink-3); }
  #legend .none .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--context); flex: none; }
  #legend .none .dot.open-dot { background: var(--accent-soft); border: 1.5px dashed var(--accent); }
  #legend .none + .none { margin-top: 3px; }
  #legend .sizenote { margin-top: 7px; color: var(--ink-3); max-width: 210px; line-height: 1.35; }
  #legend .sizenote.warn { color: var(--ink-2); border-top: 1px solid var(--line); padding-top: 6px; }
  .round.unknown { background: transparent; color: var(--ink-2); border: 1px dashed var(--line); }
  .round {
    display: inline-block; font-size: 9.5px; font-weight: 650; letter-spacing: .02em;
    padding: 1px 6px; border-radius: 999px; background: var(--accent-soft);
    color: var(--accent); vertical-align: 1px; white-space: nowrap; cursor: help;
  }

  /* ---------- map marker & tooltip ---------- */
  .leaflet-interactive:focus { outline: 3px solid var(--accent); outline-offset: 2px; }
  .leaflet-tooltip.tip {
    background: var(--surface-solid); color: var(--ink); border: 1px solid var(--line);
    border-radius: 12px; box-shadow: var(--shadow); padding: 9px 12px;
  }
  .leaflet-tooltip-top.tip::before { border-top-color: var(--surface-solid); }
  .tip .n { font-weight: 650; font-size: 13px; letter-spacing: -.01em; }
  .tip .v { font-size: 12px; color: var(--ink-2); margin-top: 2px; font-variant-numeric: tabular-nums; }
  .tip .h { font-size: 10.5px; color: var(--ink-3); margin-top: 4px; }

  /* ---------- marker clusters ---------- */
  .pk-cluster {
    display: flex; align-items: center; justify-content: center;
    border-radius: 999px; font-weight: 700; font-size: 12px; color: #fff;
    background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft),
                0 2px 8px rgba(0,0,0,.35);
    border: 2px solid var(--surface-solid);
  }
  .pk-cluster.big { font-size: 13.5px; }
  .leaflet-cluster-anim .leaflet-marker-icon { transition: transform .2s ease; }

  /* ---------- sidebar ---------- */
  #side {
    width: 0; overflow: hidden; transition: width .22s cubic-bezier(.4,0,.2,1);
    background: var(--surface-solid); border-left: 1px solid var(--line);
    display: flex; flex-direction: column; z-index: 1100;
  }
  /* keep the control panel clear of the sidebar at tablet widths */
  #side.open { width: min(480px, max(320px, 100vw - 350px)); }
  #side > .scroll { overflow-y: auto; flex: 1; min-width: min(480px, max(320px, 100vw - 350px)); }

  /* fallback ground is fixed dark blues so the white name reads in both themes */
  .photo { position: relative; height: 168px; background: linear-gradient(135deg, #2a6cbf, #0d366b); }
  .photo #s-minimap { position: absolute; inset: 0; z-index: 0; }
  .photo #s-minimap .leaflet-container { background: var(--page); }
  .photo img { width: 100%; height: 100%; object-fit: cover;
               object-position: var(--photo-pos, center); display: block; }
  .photo .veil { position: absolute; inset: 0; background: linear-gradient(180deg, transparent 40%, rgba(10,14,18,.62)); }
  .photo .close {
    position: absolute; top: 12px; right: 12px; width: 30px; height: 30px; border-radius: 50%;
    border: none; cursor: pointer; font-size: 15px; line-height: 1;
    background: rgba(15,23,32,.45); color: #fff; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  .photo .name { position: absolute; left: 18px; right: 18px; bottom: 12px; color: #fff; }
  .photo .name h2 { font-size: 19px; font-weight: 700; letter-spacing: -.015em; text-wrap: balance; text-shadow: 0 1px 8px rgba(0,0,0,.5); }
  .photo .name .credit { font-size: 9.5px; opacity: .75; margin-top: 2px; }
  .photo .name .credit a { color: inherit; }

  .meta { padding: 12px 18px 0; display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--ink-2); }
  .meta a { color: var(--accent); text-decoration: none; font-weight: 550; }
  .meta a:hover { text-decoration: underline; }

  .hero { display: flex; gap: 26px; padding: 14px 18px 12px; border-bottom: 1px solid var(--line); }
  .hero .cell .v { font-size: 26px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .hero .cell .v.up { color: var(--good); } .hero .cell .v.dn { color: var(--ink-2); }
  .hero .cell .l { font-size: 10.5px; color: var(--ink-3); margin-top: 1px; }

  /* chart card */
  .chart-card { margin: 14px 18px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface-solid); }
  .chart-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px 0; flex-wrap: wrap; }
  .tabs { display: flex; background: var(--accent-soft); border-radius: 9px; padding: 2px; }
  .tabs button { border: none; background: none; padding: 4px 11px; font-size: 12px; font-weight: 600;
                 color: var(--ink-2); border-radius: 7px; cursor: pointer; }
  .tabs button.on { background: var(--surface-solid); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.15); }
  .chart-head select { flex: 1; min-width: 120px; padding: 4px 8px; font: inherit; font-size: 12px;
                       border: 1px solid var(--line); border-radius: 8px; background: var(--surface-solid); color: var(--ink); }
  #chart-sub { font-size: 11px; color: var(--ink-3); padding: 6px 14px 0; }
  #chart-wrap { position: relative; padding: 4px 6px 8px; }
  #chart-tip {
    position: absolute; pointer-events: none; display: none; z-index: 5;
    background: var(--surface-solid); border: 1px solid var(--line); border-radius: 9px;
    box-shadow: var(--shadow); padding: 6px 9px; font-size: 11.5px; white-space: nowrap;
  }
  #chart-tip .y { font-weight: 700; }
  #chart-tip .r { color: var(--ink-2); font-variant-numeric: tabular-nums; }

  /* program list */
  .tools { padding: 2px 18px 10px; }
  .tools input {
    width: 100%; padding: 8px 12px; font: inherit; font-size: 13px; border: 1px solid var(--line);
    border-radius: 10px; background: var(--page); color: var(--ink); outline-offset: 2px;
  }
  .cat-head {
    display: flex; align-items: baseline; gap: 8px; width: 100%; text-align: left;
    border: none; background: none; cursor: pointer;
    padding: 12px 18px 5px; font-size: 11px; font-weight: 700; letter-spacing: .07em;
    text-transform: uppercase; color: var(--ink-3);
  }
  .cat-head:hover { color: var(--accent); }
  .scope-chip {
    display: flex; align-items: center; gap: 8px; margin: 10px 18px 2px; padding: 6px 10px;
    background: var(--accent-soft); border-radius: 9px; font-size: 11.5px; color: var(--ink-2);
  }
  .scope-chip span { font-weight: 650; color: var(--ink); }
  .scope-chip button {
    margin-left: auto; border: none; background: none; cursor: pointer;
    color: var(--accent); font-size: 11.5px; font-weight: 600; padding: 0;
  }
  .cat-head .cnt { font-weight: 500; letter-spacing: 0; text-transform: none; }
  .prow {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    padding: 7px 18px; border: none; background: none; cursor: pointer;
  }
  .prow:hover, .prow.sel { background: var(--accent-soft); }
  .prow .nm { flex: 1; font-size: 13px; line-height: 1.3; }
  .prow .lv { font-size: 9.5px; font-weight: 600; color: var(--ink-3); border: 1px solid var(--line);
              border-radius: 5px; padding: 1px 5px; flex: none; }
  .fbadge { font-size: 9.5px; color: var(--ink-3); border: 1px dashed var(--line); border-radius: 5px;
            padding: 1px 5px; margin-left: 7px; cursor: help; white-space: nowrap; }
  .prow.muted .nm, .prow.muted .val { color: var(--ink-3); }
  .prow .val { font-size: 13.5px; font-weight: 650; font-variant-numeric: tabular-nums; flex: none; width: 68px; text-align: right; }
  .prow .val small { display: block; font-weight: 400; font-size: 9px; color: var(--ink-3); }
  .prow .val .soft { color: var(--ink-2); font-weight: 500; font-size: 11.5px; }
  #src-note { padding: 14px 18px 20px; font-size: 10.5px; color: var(--ink-3); line-height: 1.5; }

  .leaflet-control-attribution { background: var(--surface) !important; color: var(--ink-3) !important; font-size: 9.5px !important; }
  .leaflet-control-attribution a { color: var(--ink-2) !important; }
  .leaflet-control-zoom a { background: var(--surface-solid) !important; color: var(--ink) !important; border-color: var(--line) !important; }
  @media (prefers-reduced-motion: reduce) { #side { transition: none; } }
  /* ---------- phones ----------
     A 300px floating card on a 375px screen buries the map and collides with
     the utility window. On a phone the panel becomes a full-width header bar:
     brand and utilities on one row, the two selects side by side underneath. */
  @media (max-width: 560px) {
    #panel {
      left: 10px; right: 10px; width: auto; padding: 10px 12px 11px;
      display: grid; grid-template-columns: 116px minmax(0, 1fr);
      gap: 8px; align-items: end;
    }
    #panel .brand { grid-column: 1 / -1; padding-right: 140px; }
    #panel .brand h1 { font-size: 17px; }
    #cat-note { grid-column: 1 / -1; margin-top: 0; min-height: 0; }
    /* one-county datasets hide the county select; let the other one spread */
    #fylke-field[hidden] + .field { grid-column: 1 / -1; }
    .field select { text-overflow: ellipsis; }
    #cat-note:empty { display: none; }
    #tagline { display: none; }            /* the panel hid 23 markers */
    .field label { font-size: 9.5px; letter-spacing: .04em; margin-bottom: 3px; }
    .field + .field { margin-top: 0; }
    .field select { padding: 7px 8px; font-size: 12.5px; }

    /* sits inside the panel's header row rather than fighting it for the corner */
    #controls {
      top: 20px; right: 22px; z-index: 1002; padding: 0; gap: 5px;
      background: none; border: none; box-shadow: none;
      -webkit-backdrop-filter: none; backdrop-filter: none;
    }
    #controls .ico { width: 26px; height: 26px; }

    /* The legend runs the width of the screen, but its scale is only 170px of
       that, so a wrapping row left the right half of the box empty and pushed
       the two keys onto a line of their own. Two columns instead: the scale on
       the left, the keys beside it, and the comparability warning — which a
       phone reader never saw — across the bottom of the freed space. */
    #legend {
      /* clears the Leaflet attribution strip, which the taller box overlapped */
      left: 10px; right: 10px; bottom: 16px; padding: 8px 11px 7px;
      display: grid; row-gap: 4px; column-gap: 12px; align-items: center;
      grid-template-columns: minmax(140px, 1fr) minmax(0, max-content);
    }
    #legend .t { grid-column: 1 / -1; margin-bottom: 0; }
    /* every cell is placed by hand: auto-flow reads the warning before the two
       keys and would drop it between them */
    #legend .bins { grid-area: 2 / 1 / 4 / 2; }
    /* the keys take the width their text needs and the scale spreads across
       whatever is left, so no phone width leaves a gutter between the two */
    #legend .bin { flex: 1 1 0; min-width: 0; }
    #legend .sw { width: 100%; }
    /* half a point smaller keeps a gap between "30–34" and "34–38" once
       the scale is squeezed on a 360px screen */
    #legend .bl { font-size: 9px; }
    #legend .none { grid-column: 2; grid-row: 2; margin-top: 0; }
    #legend .none + .none { grid-row: 3; margin-top: 0; }
    #legend .sizenote { display: none; }
    #legend .sizenote.warn:not([hidden]) {
      display: block; grid-area: 4 / 1 / 5 / -1; max-width: none;
      margin-top: 2px; padding-top: 5px;
    }
    /* a 16px chip is a poor tap target; the tooltip is worth reaching */
    .prow .lv { padding: 4px 7px; }
    /* fingers, not cursors: everything worth pressing gets a real target */
    .photo .close { width: 40px; height: 40px; font-size: 17px; }
    .meta a { display: inline-block; padding: 8px 0; }
    .tabs button { padding: 8px 13px; font-size: 12.5px; }
    .tools input { padding: 11px 12px; font-size: 13.5px; }
    .prow { padding-top: 11px; padding-bottom: 11px; }
  }
  /* ---------- short viewports (a phone held sideways) ----------
     375px of height cannot stack a tall panel above a tall legend: the legend
     rode up over the two selects and hid them completely. Drop the prose and
     lay the filters out side by side. */
  @media (max-height: 480px) {
    #tagline { display: none; }
    #panel { padding: 10px 12px 11px; }
    #legend { padding: 7px 10px 6px; }
    #legend .t { font-size: 10.5px; margin-bottom: 5px; }
    /* matches the phone rule's specificity so it still wins when both apply */
    #legend .sizenote, #legend .sizenote.warn:not([hidden]) { display: none; }
  }
  @media (max-height: 480px) and (min-width: 561px) {
    #panel {
      width: 430px; display: grid; grid-template-columns: 150px minmax(0, 1fr);
      gap: 8px; align-items: end;
    }
    #panel .brand, #panel #cat-note { grid-column: 1 / -1; }
    #cat-note { margin-top: 0; min-height: 0; }
    .field + .field { margin-top: 0; }
  }

  @media (max-width: 760px) {
    #side.open { width: 100vw; }
    #side > .scroll { min-width: 100vw; }
    body.side-open #panel, body.side-open #legend, body.side-open #controls { display: none; }
  }
</style>

  avg:        { no: 'snitt', en: 'avg' },
  series:     { no: 'serier', en: 'series' },
  filterPh:   { no: 'Filtrer programområde …', en: 'Filter programs…' },
  website:    { no: 'Nettside', en: 'Website' },
  wiki:       { no: 'Wikipedia', en: 'Wikipedia' },
  photoCredit:{ no: 'Foto', en: 'Photo' },
  srcNote: {
    no: 'Kilder: fylkeskommunene i Akershus, Buskerud, Innlandet, Rogaland, Trøndelag og Vestland, Oslo kommune og vilbli.no (poenggrenser), NSR/Udir (skoler), Kartverket (geokoding), Wikimedia Commons og skolenes egne nettsider (bilder). Inntaksrunden varierer mellom fylkene og er merket på hver skole. Uoffisiell prototype – tall kan inneholde parsefeil.',
    en: 'Sources: the county authorities of Akershus, Buskerud, Innlandet, Rogaland, Trøndelag and Vestland, the City of Oslo and vilbli.no (thresholds), NSR/Udir (schools), Kartverket (geocoding), Wikimedia Commons and school websites (photos). The intake round differs by county and is labelled on every school. Unofficial prototype — figures may contain parsing errors.',
  },
  noMatch:    { no: 'Ingen treff', en: 'No matches' },
  prioBadge:  { no: 'fortrinnskvote', en: 'priority quota' },
};
let lang = 'no';
const t = (k, ...a) => { const v = T[k][lang]; return typeof v === 'function' ? v(...a) : v; };

/* ================= state & helpers ================= */
const BINS = [
  { max: 30, css: '--seq-250' }, { max: 34, css: '--seq-350' }, { max: 38, css: '--seq-450' },
  { max: 42, css: '--seq-550' }, { max: 99, css: '--seq-700' },
];
const BIN_EDGES = ['<30', '30–34', '34–38', '38–42', '42+'];
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmtNum = v => typeof v === 'number' ? v.toFixed(1).replace('.', ',') : v;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let DATA = null, map = null, markerLayer = null;
let HOME = null;          // bounds of the whole dataset, the map's home view
let mapCat = 'all';
let mapFylke = 'all';
let current = null;                       // selected school
let chart = { mode: 'all', cat: null, prog: null };

function numericLatest(values) {
  const ys = Object.keys(values).sort();
  for (let i = ys.length - 1; i >= 0; i--)
    if (typeof values[ys[i]] === 'number') return [ys[i], values[ys[i]]];
  return null;
}
const fmt = v => lang === 'no' ? fmtNum(v) : String(fmtNum(v)).replace(',', '.');

function yearSpan(s) {
  const ys = [...new Set(s.programs.flatMap(p => Object.keys(p.values)))].sort();
  return !ys.length ? '' : ys.length === 1 ? ys[0] : `${ys[0]}–${ys[ys.length - 1]}`;
}
const stProgram = s => s.programs.find(p => p.program.toLowerCase() === 'studiespesialisering');
const isPrioOnly = p => { const vs = Object.values(p.values); return vs.length > 0 && vs.every(v => v === 'F'); };
function partitionPrograms(progs) {
  const regular = progs.filter(p => !isPrioOnly(p));
  const regNames = new Set(regular.map(p => p.program.toLowerCase()));
  const prioNames = new Set(progs.filter(isPrioOnly).map(p => p.program.toLowerCase()));
  const orphans = progs.filter(p => isPrioOnly(p) && !regNames.has(p.program.toLowerCase()));
  return { regular, orphans, prioNames };
}
const visibleCount = s => { const pp = partitionPrograms(s.programs); return pp.regular.length + pp.orphans.length; };
function schoolPressure(s, cat) {
  // Demand, judged in the newest dataset year only. Two honest signals:
  //   median threshold of the programmes that filled up  -> how hard, typically
  //   share of programmes that filled up at all          -> how much is in demand
  // (The earlier "highest threshold" let one niche programme speak for a whole
  // school. Note this measures demand vs capacity, not school quality.)
  // counties publish different years (Oslo and Vestland already have 2026,
  // most stop at 2025), so judge each school on the newest year IT has
  const scope = cat === 'all' ? s.programs : s.programs.filter(p => p.category === cat);
  const years = [...new Set(scope.flatMap(p => Object.keys(p.values)))].sort();
  const yr = years[years.length - 1];
  if (!yr) return { kind: 'none' };
  const pool = scope.filter(p => yr in p.values && p.values[yr] !== 'F' && p.values[yr] !== 'U');
  const nums = pool.map(p => p.values[yr]).filter(v => typeof v === 'number').sort((a, b) => a - b);
  const openN = pool.filter(p => p.values[yr] === 'open').length;
  const total = nums.length + openN;
  if (!nums.length) return total ? { kind: 'open', year: yr, total } : { kind: 'none' };
  const mid = nums.length >> 1;
  const median = nums.length % 2 ? nums[mid] : (nums[mid - 1] + nums[mid]) / 2;
  let top = -1, topProg = null;
  for (const p of pool) {
    const v = p.values[yr];
    if (typeof v === 'number' && v > top) { top = v; topProg = p; }
  }
  return { kind: 'points', v: median, top, topProg, year: yr,
           filled: nums.length, total, share: nums.length / total };
}
const colorFor = v => v == null ? cssVar('--context') : cssVar(BINS.find(b => v < b.max).css);

/* ================= map ================= */
const isDark = () => matchMedia('(prefers-color-scheme: dark)').matches;
let tileLayer = null, miniMap = null;
const tileUrl = () =>
  `https://{s}.basemaps.cartocdn.com/${isDark() ? 'dark_all' : 'light_all'}/{z}/{x}/{y}{r}.png`;
function setTiles() {
  if (tileLayer) map.removeLayer(tileLayer);
  tileLayer = L.tileLayer(tileUrl(), {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
    subdomains: 'abcd', maxZoom: 19,
  }).addTo(map);
}

function drawMarkers() {
  if (markerLayer) map.removeLayer(markerLayer);
  // 190 schools overlap badly at national zoom — nearly half had no reachable
  // pixel before clustering
  markerLayer = L.markerClusterGroup({
    maxClusterRadius: 44,
    disableClusteringAtZoom: 11,
    spiderfyOnMaxZoom: true,
    showCoverageOnHover: false,
    chunkedLoading: true,
    iconCreateFunction: cluster => {
      const n = cluster.getChildCount();
      const size = n < 10 ? 32 : n < 30 ? 38 : 44;
      return L.divIcon({
        html: `<div class="pk-cluster${n >= 30 ? ' big' : ''}" `
            + `style="width:${size}px;height:${size}px">${n}</div>`,
        className: '', iconSize: [size, size],
      });
    },
  }).addTo(map);
  for (const s of visibleSchools()) {
    if (!s.lat) continue;
    const st8 = schoolPressure(s, mapCat);
    const v = st8.kind === 'points' ? st8.v : null;
    const style = st8.kind === 'points'
      ? { radius: 7 + 5 * (st8.share ?? 0.5), weight: 2.5,
          color: cssVar('--surface-solid'), fillColor: colorFor(v), fillOpacity: 0.96 }
      : st8.kind === 'open'
      ? { radius: 8, weight: 2, color: cssVar('--accent'), dashArray: '3 3', fillColor: cssVar('--accent'), fillOpacity: 0.14 }
      : { radius: 7.5, weight: 2, color: cssVar('--surface-solid'), fillColor: cssVar('--context'), fillOpacity: 0.9 };
    const m = L.circleMarker([s.lat, s.lon], style).addTo(markerLayer);
    let line;
    if (mapCat === 'all') {
      if (st8.kind === 'points') {
        line = t('tipMedian', fmt(st8.v), st8.filled, st8.total) +
               `<br>${t('tipTop')} ${fmt(st8.top)} · ${esc(st8.topProg.program)}`;
      } else if (st8.kind === 'open') {
        line = t('tipAllOpen', st8.year);
      } else {
        const sy = yearSpan(s);
        line = t('tipNoData', sy ? sy.split('–').pop() : DATA.years[DATA.years.length - 1]);
      }
    } else {
      line = st8.kind === 'points' ? `${CATS[mapCat][lang]}: ` + t('tipMedian', fmt(st8.v), st8.filled, st8.total)
           : st8.kind === 'open' ? `${CATS[mapCat][lang]}: ${t('allIn').toLowerCase()} (${st8.year})`
           : `${CATS[mapCat][lang]}: –`;
    }
    const html = `<div class="n">${esc(s.name)}</div><div class="v">${line}</div>` +
      `<div class="v">${t('tipPrograms', visibleCount(s), yearSpan(s))}` +
      ` · <span class="round${s.round ? '' : ' unknown'}">` +
      `${s.round ? t('roundChip', s.round) : t('roundUnknown')}</span></div>` +
      `<div class="h">${t('tipHint')}</div>`;
    const tipOpts = dir => ({ className: 'tip', direction: dir, opacity: 1,
                              offset: dir === 'top' ? [0, -10] : [0, 10] });
    m.bindTooltip(html, tipOpts('top'));
    // flip below the marker near the top edge, where a 'top' tooltip is clipped
    m.on('mouseover', () => {
      const want = map.latLngToContainerPoint(m.getLatLng()).y < 140 ? 'bottom' : 'top';
      if (m.getTooltip().options.direction !== want) {
        m.unbindTooltip().bindTooltip(html, tipOpts(want)).openTooltip();
      }
    });
    m.on('click', () => openSide(s));
    m.on('dblclick', e => L.DomEvent.stop(e));   // don't zoom the map underneath
    const el = m.getElement();
    if (el) {                                     // keyboard access (WCAG 2.1.1)
      el.setAttribute('tabindex', '0');
      el.setAttribute('role', 'button');
      el.setAttribute('aria-label', t('markerAria', s.name, line.replace(/<[^>]*>/g, '')));
      el.addEventListener('keydown', ev => {
        if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); openSide(s); }
      });
      el.addEventListener('focus', () => m.openTooltip());
      el.addEventListener('blur', () => m.closeTooltip());
    }
  }
}

function onMapFylke(v) {
  mapFylke = v;
  // a county may not offer the selected category at all; widen rather than
  // leave a blank control over an empty map
  if (mapCat !== 'all' && !DATA.schools.some(s =>
      (v === 'all' || s.fylke === v) && s.programs.some(p => p.category === mapCat))) {
    mapCat = 'all';
  }
  drawMarkers(); renderPanel(); renderLegend(); renderCatNote();
  const pts = visibleSchools().filter(s => s.lat).map(s => [s.lat, s.lon]);
  if (pts.length) map.flyToBounds(L.latLngBounds(pts).pad(0.08), { ...framePad(), duration: .6 });
}

function visibleSchools() {
  return DATA.schools.filter(s =>
    (mapFylke === 'all' || s.fylke === mapFylke) &&
    (mapCat === 'all' || s.programs.some(p => p.category === mapCat)));
}

function onMapCat(v) {
  mapCat = v;
  drawMarkers(); renderLegend(); renderCatNote();
  if (current && v !== 'all') {
    chart.mode = 'cat'; chart.cat = v; chart.prog = null;
    renderChartCard();
    renderList();          // clear the now-stale selected-programme highlight
  }
}

/* ================= static chrome rendering ================= */
function renderPanel() {
  renderControls();
  document.getElementById('tagline').textContent = t('tagline',
    DATA.schools.length, DATA.counties.length,
    DATA.years[0], DATA.years[DATA.years.length - 1]);
  document.getElementById('cat-label').textContent = t('catLabel');
  document.getElementById('lang-no').classList.toggle('on', lang === 'no');
  document.getElementById('lang-en').classList.toggle('on', lang === 'en');
  const counties = (DATA.counties || []).filter(c => c.schools);
  const ff = document.getElementById('fylke-field');
  ff.hidden = counties.length < 2;               // pointless with a single county
  document.getElementById('fylke-label').textContent = t('fylkeLabel');
  const fsel = document.getElementById('map-fylke');
  fsel.innerHTML = `<option value="all">${t('allFylker')}</option>` +
    counties.map(c => {
      const n = DATA.schools.filter(s => s.fylke === c.fylke && s.lat).length;
      return `<option value="${esc(c.fylke)}">${esc(c.fylke)} (${n})</option>`;
    }).join('');
  fsel.value = mapFylke;
  const present = new Set();
  DATA.schools.filter(s => mapFylke === 'all' || s.fylke === mapFylke)
    .forEach(s => s.programs.forEach(p => present.add(p.category)));
  const sel = document.getElementById('map-cat');
  sel.innerHTML = `<option value="all">${t('allCats')}</option>` +
    Object.keys(CATS).filter(c => present.has(c))
      .map(c => `<option value="${c}">${CATS[c][lang]}</option>`).join('');
  sel.value = mapCat;
}
function renderCatNote() {
  const el = document.getElementById('cat-note');
  el.textContent = mapCat === 'all' ? '' :
    t('catNote', DATA.schools.filter(s =>
      (mapFylke === 'all' || s.fylke === mapFylke)
      && s.programs.some(p => p.category === mapCat)).length);
}
function renderLegend() {
  const rounds = [...new Set(visibleSchools().map(s => s.round).filter(Boolean))];
  const anyUnknown = visibleSchools().some(s => !s.round);
  document.getElementById('legend-title').innerHTML =
    (mapCat === 'all' ? t('legendAll') : t('legendCat', mapCat)) +
    (rounds.length === 1 && !anyUnknown
      ? ` <span class="round" title="${esc(t('roundTitle'))}">${t('roundChip', rounds[0])}</span>`
      : !rounds.length && anyUnknown
      ? ` <span class="round unknown" title="${esc(t('roundUnknownTitle'))}">${t('roundUnknown')}</span>` : '');
  const mix = document.getElementById('legend-mixed');
  mix.hidden = !(rounds.length > 1 || (rounds.length && anyUnknown));
  mix.textContent = t('mixedRounds');
  document.getElementById('legend-bins').innerHTML = BINS.map((b, i) =>
    `<div class="bin"><span class="sw" style="background:${cssVar(b.css)}"></span><span class="bl">${BIN_EDGES[i]}</span></div>`).join('');
  document.getElementById('legend-size').textContent = t('legendSize');
  document.getElementById('legend-open').textContent = t('legendOpen');
  document.getElementById('legend-none').textContent = t('legendNone');
}

/* ================= sidebar ================= */
function openSide(s) {
  current = s;
  chart = { mode: mapCat === 'all' ? 'all' : 'cat', cat: mapCat === 'all' ? null : mapCat, prog: null };
  renderSide();
  const side = document.getElementById('side');
  side.removeAttribute('inert');
  side.classList.add('open');
  document.body.classList.add('side-open');
  // On a phone the details fill the screen, and the system back gesture is how
  // people expect to leave a screen. Give it something to pop.
  if (!(history.state || {}).pkSide) {
    try { history.pushState({ pkSide: 1 }, ''); } catch (e) {}
  }
  setTimeout(() => document.querySelector('#s-photo .close')?.focus(), 60);
}
function clearScope() {
  chart.mode = 'all'; chart.cat = null; chart.prog = null;
  renderChartCard(); renderList();
}
function closeSide(fromHistory) {
  const side = document.getElementById('side');
  if (!fromHistory && (history.state || {}).pkSide) {
    history.back();                        // popstate closes it, once
    return;
  }
  side.classList.remove('open');
  document.body.classList.remove('side-open');
  side.setAttribute('inert', '');          // keep 17 hidden controls out of Tab
  document.getElementById('map-fylke')?.focus();
}

function renderSide() {
  if (!current) return;
  const s = current;
  // photo header
  const ph = document.getElementById('s-photo');
  ph.classList.toggle('nophoto', false);   // location map fills the same frame
  const creditText = s.photo_credit
    || (s.photo_source === 'commons' ? 'Wikimedia Commons' : 'Wikipedia');
  const creditHref = s.photo_page || s.wiki_url || '';
  const credit = s.photo
    ? `<div class="credit">` + (creditHref
        ? `<a href="${esc(creditHref)}" target="_blank" rel="noopener">${esc(creditText)}</a>`
        : esc(creditText)) + '</div>'
    : '';
  const pos = s.photo_position ? ` style="--photo-pos:${esc(s.photo_position)}"` : '';
  ph.innerHTML = (s.photo ? `<img src="${esc(s.photo)}" alt="" loading="lazy"${pos}>`
                          : `<div id="s-minimap"></div>`) +
    `<div class="veil"></div>` +
    `<button class="close" onclick="closeSide()" aria-label="${esc(t('closeAria'))}">✕</button>` +
    `<div class="name"><h2>${esc(s.name)}</h2>${credit}</div>`;
  // no freely licensed photo exists for this school: show where it actually is
  if (miniMap) { miniMap.remove(); miniMap = null; }
  if (!s.photo && s.lat) {
    miniMap = L.map('s-minimap', {
      zoomControl: false, attributionControl: false, dragging: false,
      scrollWheelZoom: false, doubleClickZoom: false, boxZoom: false,
      keyboard: false, touchZoom: false, tap: false,
    }).setView([s.lat, s.lon], 16);
    L.tileLayer(tileUrl(), { detectRetina: true }).addTo(miniMap);
    L.circleMarker([s.lat, s.lon], {
      radius: 9, weight: 3, color: '#fff', fillColor: cssVar('--accent'), fillOpacity: 1,
    }).addTo(miniMap);
    setTimeout(() => miniMap && miniMap.invalidateSize(), 30);
  }
  // meta links
  const meta = [];
  if (s.url) meta.push(`<a href="${esc(s.url.startsWith('http') ? s.url : 'https://' + s.url)}" target="_blank" rel="noopener">${t('website')} ↗</a>`);
  if (s.wiki_url) meta.push(`<a href="${esc(s.wiki_url)}" target="_blank" rel="noopener">${t('wiki')} ↗</a>`);
  if (s.address) meta.push(`<span>${esc(s.address)}</span>`);
  if (s.fylke) meta.push(`<span>${esc(s.fylke)}</span>`);
  meta.push(s.round
    ? `<span class="round" title="${esc(t('roundTitle'))}">${t('roundChip', s.round)}</span>`
    : `<span class="round unknown" title="${esc(t('roundUnknownTitle'))}">${t('roundUnknown')}</span>`);
  document.getElementById('s-meta').innerHTML = meta.join('');
  // hero mirrors what the map encodes — the median threshold — so the two
  // never tell different stories; a category lens narrows both together
  const lensCat = mapCat !== 'all' ? mapCat : null;
  const cells = [];
  const medianAt = year => {
    const pool = (lensCat ? s.programs.filter(p => p.category === lensCat) : s.programs)
      .map(p => p.values[year]).filter(v => typeof v === 'number').sort((a, b) => a - b);
    if (!pool.length) return null;
    const mid = pool.length >> 1;
    return pool.length % 2 ? pool[mid] : (pool[mid - 1] + pool[mid]) / 2;
  };
  const scopePrograms = lensCat ? s.programs.filter(p => p.category === lensCat) : s.programs;
  const yrs = [...new Set(scopePrograms.flatMap(p => Object.keys(p.values)))].sort();
  const latest = yrs[yrs.length - 1], prev = yrs[yrs.length - 2];
  const med = medianAt(latest), medPrev = medianAt(prev);
  const scopeLabel = lensCat ? CATS[lensCat][lang] : t('heroTypicalAll');
  if (med !== null) {
    cells.push({ v: fmt(med), l: `${t('heroTypical')} · ${scopeLabel} ${latest}` });
    if (medPrev !== null) {
      const d = med - medPrev;
      cells.push({ v: (d >= 0 ? '+' : '') + fmt(d), l: t('heroDelta', prev), cls: d >= 0 ? 'up' : 'dn' });
    }
  } else {
    const last = scopePrograms.map(p => p.values[latest]).filter(v => v !== undefined);
    const label = last.includes('open') ? t('allIn')
                : last.includes('D') ? t('docAdm')
                : last.includes('F') ? t('priority')
                : last.length && last.every(v => v === 'U') ? t('gone')
                : t('allIn');
    cells.push({ v: label, l: `${scopeLabel} ${latest || ''}`.trim() });
  }
  cells.push({ v: lensCat ? scopePrograms.length : visibleCount(s), l: t('heroProgs') });
  document.getElementById('s-hero').innerHTML =
    cells.map(c => `<div class="cell"><div class="v ${c.cls || ''}">${c.v}</div><div class="l">${c.l}</div></div>`).join('');
  document.getElementById('s-filter').placeholder = t('filterPh');
  document.getElementById('src-note').textContent = t('srcNote');
  renderChartCard();
  renderList();
}

/* ================= chart (3 resolution levels) ================= */
function seriesFor(mode, cat, prog) {
  const progs = mode === 'prog' ? [prog]
    : mode === 'cat' ? current.programs.filter(p => p.category === cat)
    : current.programs;
  return progs.filter(p => Object.values(p.values).some(v => typeof v === 'number'));
}
function renderChartCard() {
  // tabs
  const tabs = document.querySelectorAll('#tabs button');
  tabs[0].textContent = t('tabAll'); tabs[1].textContent = t('tabCat'); tabs[2].textContent = t('tabProg');
  tabs.forEach(b => {
    b.classList.toggle('on', b.dataset.mode === chart.mode);
    b.onclick = () => {
      chart.mode = b.dataset.mode;
      if (chart.mode === 'cat' && !chart.cat) chart.cat = current.programs[0].category;
      if (chart.mode === 'prog' && !chart.prog) chart.prog = current.programs.find(p => numericLatest(p.values)) || current.programs[0];
      renderChartCard(); renderList();
    };
  });
  // category select inside chart
  const cs = document.getElementById('chart-cat');
  if (chart.mode === 'cat') {
    const present = [...new Set(current.programs.map(p => p.category))];
    cs.hidden = false;
    cs.innerHTML = present.map(c => `<option value="${c}">${CATS[c][lang]}</option>`).join('');
    cs.value = chart.cat = chart.cat && present.includes(chart.cat) ? chart.cat : present[0];
    cs.onchange = () => { chart.cat = cs.value; renderChartCard(); renderList(); };
  } else cs.hidden = true;
  drawChart();
}

function drawChart() {
  // a chart must span the school's own years: Akershus and Trøndelag publish
  // one year, and nine mostly-empty columns read as a broken chart
  const own = [...new Set(current.programs.flatMap(p => Object.keys(p.values)))].sort();
  const allYears = DATA.years.map(String);
  const years = own.length > 1
    ? allYears.filter(y => y >= own[0] && y <= own[own.length - 1])
    : own;
  const W = 444, H = 190, ML = 30, MR = 12, MT = 16, MB = 22;
  const iw = W - ML - MR, ih = H - MT - MB;
  const series = seriesFor(chart.mode, chart.cat, chart.prog);
  document.getElementById('chart-tip').style.display = 'none';  // stale on redraw
  const svgHost = document.getElementById('chart-svg');
  if (years.length < 2) {
    document.getElementById('chart-sub').textContent =
      t('oneYearOnly', years[0] || '');
    svgHost.innerHTML = '';
    return;
  }

  // the y-domain follows the data: a fixed 10-50 window flattened every school
  // whose thresholds run above 50 (Sauda ambulansefag sits at 51-54)
  const nums = series.flatMap(p => Object.values(p.values).filter(v => typeof v === 'number'));
  let LO = 10, HI = 50;
  if (nums.length) {
    LO = Math.max(0, Math.floor((Math.min(...nums) - 3) / 5) * 5);
    HI = Math.ceil((Math.max(...nums) + 3) / 5) * 5;
    if (HI - LO < 20) { LO = Math.max(0, HI - 20); HI = LO + 20; }
  }
  const step = (HI - LO) > 45 ? 20 : 10;
  const ticks = [];
  for (let g = Math.ceil(LO / step) * step; g <= HI; g += step) ticks.push(g);
  const x = i => ML + i * iw / (years.length - 1);
  const y = v => MT + ih - (Math.min(Math.max(v, LO), HI) - LO) * ih / (HI - LO);
  const sub = document.getElementById('chart-sub');
  sub.textContent = chart.mode === 'prog'
    ? `${chart.prog ? chart.prog.program + ' · ' : ''}${t('chartSubProg')}`
    : chart.mode === 'cat' ? t('chartSubCat', series.length) : t('chartSubAll', series.length);

  // averages per year over numeric values
  const avg = {}, cnt = {};
  years.forEach(yr => {
    const vals = series.map(p => p.values[yr]).filter(v => typeof v === 'number');
    if (vals.length) { avg[yr] = vals.reduce((a, b) => a + b, 0) / vals.length; cnt[yr] = vals.length; }
  });

  let svg = '';
  // grid + y labels
  for (const gy of ticks) {
    svg += `<line x1="${ML}" y1="${y(gy)}" x2="${W - MR}" y2="${y(gy)}" stroke="var(--line)" stroke-width="1"/>` +
           `<text x="${ML - 6}" y="${y(gy) + 3}" font-size="10.5" fill="var(--ink-3)" text-anchor="end">${gy}</text>`;
  }
  years.forEach((yr, i) => {
    svg += `<text x="${x(i)}" y="${H - 6}" font-size="10.5" fill="var(--ink-3)" text-anchor="middle">${yr.slice(2)}</text>`;
  });

  const lineOf = (p, stroke, width, op) => {
    let segs = [], run = [];
    years.forEach((yr, i) => {
      const v = p.values[yr];
      if (typeof v === 'number') run.push(`${x(i)},${y(v)}`);
      else if (run.length) { segs.push(run); run = []; }
    });
    if (run.length) segs.push(run);
    return segs.filter(r => r.length > 1).map(r =>
      `<polyline points="${r.join(' ')}" fill="none" stroke="${stroke}" stroke-width="${width}" stroke-opacity="${op}" stroke-linejoin="round" stroke-linecap="round"/>`).join('');
  };

  if (chart.mode === 'prog' && chart.prog) {
    const p = chart.prog;
    svg += lineOf(p, 'var(--accent)', 2.5, 1);
    years.forEach((yr, i) => {
      const v = p.values[yr];
      if (typeof v === 'number')
        svg += `<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="var(--accent)" stroke="var(--surface-solid)" stroke-width="1.5"/>`;
      else if (v === 'open')
        svg += `<circle cx="${x(i)}" cy="${y(LO)}" r="4" fill="var(--surface-solid)" stroke="var(--ink-3)" stroke-width="1.6"/>`;
    });
    const l = numericLatest(p.values);
    if (l) svg += `<text x="${x(years.indexOf(l[0])) - 8}" y="${Math.max(y(l[1]) - 9, MT - 3)}" font-size="11" font-weight="700" fill="var(--ink)" text-anchor="middle">${fmt(l[1])}</text>`;
  } else {
    for (const p of series) svg += lineOf(p, 'var(--context)', 1.4, .55);
    const avgSeries = { values: Object.fromEntries(Object.entries(avg)) };
    svg += lineOf(avgSeries, 'var(--accent)', 2.6, 1);
    years.forEach((yr, i) => {
      if (avg[yr] != null)
        svg += `<circle cx="${x(i)}" cy="${y(avg[yr])}" r="3.6" fill="var(--accent)" stroke="var(--surface-solid)" stroke-width="1.4"/>`;
    });
  }
  svg += `<line id="xh" x1="0" x2="0" y1="${MT}" y2="${MT + ih}" stroke="var(--ink-3)" stroke-width="1" stroke-dasharray="3 3" visibility="hidden"/>`;
  document.getElementById('chart-svg').innerHTML =
    `<svg id="the-chart" viewBox="0 0 ${W} ${H}" width="100%" style="display:block">${svg}</svg>`;

  // crosshair + tooltip
  const svgEl = document.getElementById('the-chart');
  const tip = document.getElementById('chart-tip');
  const xh = svgEl.querySelector('#xh');
  svgEl.addEventListener('mousemove', ev => {
    const r = svgEl.getBoundingClientRect();
    const sx = (ev.clientX - r.left) * W / r.width;
    let bi = 0, bd = 1e9;
    years.forEach((yr, i) => { const d = Math.abs(x(i) - sx); if (d < bd) { bd = d; bi = i; } });
    const yr = years[bi];
    xh.setAttribute('x1', x(bi)); xh.setAttribute('x2', x(bi)); xh.setAttribute('visibility', 'visible');
    let body;
    if (chart.mode === 'prog' && chart.prog) {
      const v = chart.prog.values[yr];
      body = v === undefined ? '–'
        : typeof v === 'number' ? `${fmt(v)} ${t('pts')}`
        : v === 'open' ? t('allIn') : v === 'F' ? t('priority')
        : v === 'D' ? t('docAdm') : t('gone');
    } else {
      body = avg[yr] != null ? `${t('avg')} ${fmt(avg[yr])} · ${cnt[yr]} ${t('series')}` : '–';
    }
    tip.innerHTML = `<span class="y">${yr}</span> <span class="r">${body}</span>`;
    tip.style.display = 'block';
    const wrap = document.getElementById('chart-wrap').getBoundingClientRect();
    let px = ev.clientX - wrap.left + 14;
    if (px > wrap.width - 130) px = ev.clientX - wrap.left - 130;
    tip.style.left = px + 'px';
    tip.style.top = (ev.clientY - wrap.top - 34) + 'px';
  });
  svgEl.addEventListener('mouseleave', () => { tip.style.display = 'none'; xh.setAttribute('visibility', 'hidden'); });
}

/* ================= program list ================= */
function renderList() {
  const q = (document.getElementById('s-filter').value || '').toLowerCase();
  // One scope for the whole sidebar: the chart tabs (and the map's category
  // lens, which seeds them) decide what the list shows too. Two independent
  // category filters was the confusing part.
  const scope = chart.mode === 'cat' ? chart.cat
              : chart.mode === 'prog' && chart.prog ? chart.prog.category : null;
  const inScope = current.programs.filter(p => !scope || p.category === scope);
  const { regular, orphans, prioNames } = partitionPrograms(
    inScope.filter(p => p.program.toLowerCase().includes(q)));
  const byCat = {};
  [...regular, ...orphans].forEach(p => (byCat[p.category] = byCat[p.category] || []).push(p));
  let html = '';
  if (scope) {
    const hidden = current.programs.length - inScope.length;
    html += `<div class="scope-chip"><span>${CATS[scope][lang]}</span>` +
            `<button onclick="clearScope()">${t('scopeAll')}${hidden ? ` (+${hidden})` : ''}</button></div>`;
  }
  const badged = new Set();  // badge only the first row per program name
  for (const c of Object.keys(CATS).filter(c => byCat[c])) {
    const list = byCat[c];
    list.sort((a, b) => (numericLatest(b.values)?.[1] ?? -1) - (numericLatest(a.values)?.[1] ?? -1));
    html += `<button class="cat-head" data-cat="${c}"><span>${CATS[c][lang]}</span><span class="cnt">${list.length}</span></button>`;
    for (const p of list) {
      // headline value: newest non-priority cell (F is a quota fact, not a value)
      let latestYear = null, lv;
      const ys = Object.keys(p.values).sort();
      for (let i = ys.length - 1; i >= 0; i--) {
        if (p.values[ys[i]] !== 'F') { latestYear = ys[i]; lv = p.values[ys[i]]; break; }
      }
      const orphan = latestYear === null;
      const hasF = ys.some(y => p.values[y] === 'F');
      const val = orphan ? `<span class="soft" title="${esc(t('fortrinnTitle'))}">${t('priority')} ⓘ</span>`
        : typeof lv === 'number' ? `${fmt(lv)}<small>${latestYear}</small>`
        : lv === 'open' ? `<span class="soft">${t('allIn')}</span>`
        : lv === 'D' ? `<span class="soft" title="${esc(t('docTitle'))}">${t('docAdm')}</span>`
        : `<span class="soft">${t('gone')}</span>`;
      const key = p.program.toLowerCase();
      let badge = '';
      if (!orphan && (prioNames.has(key) || hasF) && !badged.has(key)) {
        badged.add(key);
        badge = `<span class="fbadge" title="${esc(t('fortrinnTitle'))}">${t('prioBadge')}</span>`;
      }
      const sel = chart.mode === 'prog' && chart.prog === p ? ' sel' : '';
      html += `<button class="prow${sel}${orphan ? ' muted' : ''}" data-cat="${c}" data-idx="${current.programs.indexOf(p)}">` +
              `<span class="nm">${esc(p.program)}${badge}</span><span class="lv">${p.level}</span><span class="val">${val}</span></button>`;
    }
  }
  const el = document.getElementById('s-list');
  el.innerHTML = html || `<div class="cat-head">${t('noMatch')}</div>`;
  el.querySelectorAll('.cat-head[data-cat]').forEach(b =>
    b.onclick = () => { chart.mode = 'cat'; chart.cat = b.dataset.cat; renderChartCard(); renderList(); });
  el.querySelectorAll('.prow').forEach(b =>
    b.onclick = () => { chart.mode = 'prog'; chart.prog = current.programs[+b.dataset.idx]; renderChartCard(); renderList(); });
  bindTips(el);
}

/* ================= feedback =================
   The form asks only what the chosen kind of report actually needs: a school
   name is meaningless on a feature suggestion, and a photo link is meaningless
   on a wrong figure. Everything is posted to /api/feedback, which relays it to
   e-mail — the destination address is held server side so it never appears in
   this page. */
const FIELDS = {
  tall:     ['school', 'program', 'year'],
  bilde:    ['school', 'photo'],
  skole:    ['school', 'fylke'],
  funksjon: [],
  annet:    [],
};

function contactField(name) {
  const key = { school: 'contactSchool', program: 'contactProgram', year: 'contactYear',
                photo: 'contactPhoto', fylke: 'contactFylke' }[name];
  const open = document.getElementById('side').classList.contains('open');
  const value = name === 'school' && open && current ? current.name
    : name === 'fylke' && mapFylke !== 'all' ? mapFylke : '';
  const type = name === 'photo' ? 'url' : name === 'year' ? 'number' : 'text';
  const extra = name === 'year'
    ? ` min="${DATA.years[0]}" max="${DATA.years[DATA.years.length - 1]}"` : '';
  return `<label for="c-${name}">${esc(t(key))}</label>
    <input id="c-${name}" data-f="${name}" type="${type}"${extra}
           autocomplete="off" value="${esc(value)}">`;
}

function renderContactFields() {
  const kind = document.getElementById('c-kind').value;
  document.getElementById('c-extra').innerHTML =
    FIELDS[kind].map(contactField).join('');
  const hint = t('contactHints')[kind];
  const el = document.getElementById('c-hint');
  el.textContent = hint || '';
  el.hidden = !hint;
}

function renderContact() {
  document.getElementById('contact-h').textContent = t('contactTitle');
  const kinds = t('contactKinds');
  document.getElementById('contact-body').innerHTML = `
    <p class="lede">${esc(t('contactLede'))}</p>
    <form id="c-form" novalidate>
      <label for="c-kind">${esc(t('contactKind'))}</label>
      <select id="c-kind">${Object.entries(kinds)
        .map(([k, v]) => `<option value="${k}">${esc(v)}</option>`).join('')}</select>
      <div id="c-extra"></div>
      <label for="c-msg">${esc(t('contactMsg'))}</label>
      <p class="hint" id="c-hint" hidden></p>
      <textarea id="c-msg" maxlength="4000"
                placeholder="${esc(t('contactPlaceholder'))}"></textarea>
      <label for="c-email">${esc(t('contactEmail'))}</label>
      <input id="c-email" type="email" autocomplete="email" inputmode="email">
      <!-- honeypot: hidden from people, irresistible to bots -->
      <input id="c-website" name="website" type="text" tabindex="-1"
             autocomplete="off" aria-hidden="true" class="hp">
      <p class="privacy">${esc(t('contactPrivacy'))}</p>
      <p class="err" id="c-err" hidden></p>
      <button class="cta" id="c-send" type="submit">${esc(t('contactSend'))}</button>
    </form>`;
  document.getElementById('c-kind').onchange = renderContactFields;
  renderContactFields();
  document.getElementById('c-form').addEventListener('submit', sendContact);
}

async function sendContact(ev) {
  ev.preventDefault();
  const err = document.getElementById('c-err');
  const btn = document.getElementById('c-send');
  const msg = document.getElementById('c-msg');
  err.hidden = true;
  // three characters is what the relay accepts; anything shorter came back as a
  // bare "could not send", which reads like a fault in the site
  if (msg.value.trim().replace(/\s+/g, ' ').length < 3) {
    err.textContent = t('contactNeedMsg');
    err.hidden = false;
    msg.focus();
    return;
  }
  const mail = document.getElementById('c-email');
  if (mail.value.trim() && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail.value.trim())) {
    err.textContent = t('contactBadMail');
    err.hidden = false;
    mail.focus();
    return;
  }
  const payload = {
    type: document.getElementById('c-kind').value,
    message: msg.value,
    email: document.getElementById('c-email').value,
    website: document.getElementById('c-website').value,
    lang, page: location.pathname + location.search,
  };
  document.querySelectorAll('#c-extra input').forEach(i => { payload[i.dataset.f] = i.value; });
  btn.disabled = true;
  btn.textContent = t('contactSending');
  try {
    const r = await fetch('/api/feedback', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    if (!r.ok) throw new Error(String(r.status));
    const data = await r.json().catch(() => ({ ok: true }));
    // No provider key configured yet: the server hands back a prefilled
    // mailto: so the message the visitor wrote is not thrown away.
    if (data.mailto) {
      location.href = data.mailto;
      document.getElementById('contact-body').innerHTML =
        `<div class="done">
           <svg viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2"
                stroke-linejoin="round" aria-hidden="true">
             <rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m3.6 6.4 8.4 6 8.4-6"/>
           </svg>
           <p class="big">${esc(t('contactHandoff'))}</p>
           <p>${esc(t('contactHandoffSub'))}</p>
           <a class="cta" href="${esc(data.mailto)}">${esc(t('contactOpenMail'))}</a>
         </div>`;
      return;
    }
    document.getElementById('contact-body').innerHTML =
      `<div class="done">
         <svg viewBox="0 0 24 24" fill="none" stroke="var(--good)" stroke-width="2.4"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
           <path d="m4.5 12.5 5 5 10-11"/>
         </svg>
         <p class="big">${esc(t('contactSent'))}</p>
         <p>${esc(t('contactSentSub'))}</p>
         <button class="cta" onclick="closeContact()">${esc(t('close'))}</button>
       </div>`;
  } catch (e) {
    err.textContent = t('contactFail');
    err.hidden = false;
    btn.disabled = false;
    btn.textContent = t('contactSend');
  }
}

function openContact() {
  renderContact();
  document.getElementById('contact').hidden = false;
  setTimeout(() => document.getElementById('c-kind')?.focus(), 40);
}

function closeContact() {
  document.getElementById('contact').hidden = true;
  document.getElementById('contact-btn')?.focus();
}

/* ================= tooltips =================
   "Vg1" is second nature inside the school system and opaque outside it, which
   covers most of the people this map is for. Hover explains it on a pointer;
   tap explains it on a touch screen without also selecting the programme row
   the chip sits inside. */
function showTip(el, html) {
  const tip = document.getElementById('tip');
  tip.hidden = false;
  tip.innerHTML = html;
  const r = el.getBoundingClientRect();
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = Math.max(8, Math.min(r.left + r.width / 2 - w / 2, innerWidth - w - 8));
  let y = r.top - h - 8;
  if (y < 8) y = r.bottom + 8;                 // flip below rather than clip
  tip.style.left = x + 'px';
  tip.style.top = y + 'px';
  tip.classList.add('on');
}

function hideTip() {
  const tip = document.getElementById('tip');
  tip.classList.remove('on');
  tip.hidden = true;
}

function bindTips(root) {
  root.querySelectorAll('.lv').forEach(el => {
    const key = el.textContent.trim();
    const entry = t('levels')[key];
    if (!entry) return;
    el.classList.add('tipped');
    el.setAttribute('aria-label', `${key}: ${entry[1]}`);
    const html = `<b>${esc(entry[0])}</b><br>${esc(entry[1])}`;
    el.onmouseenter = () => showTip(el, html);
    el.onmouseleave = hideTip;
    el.addEventListener('touchstart', ev => {
      ev.preventDefault(); ev.stopPropagation();   // do not select the row
      showTip(el, html);
      clearTimeout(showTip.timer);
      showTip.timer = setTimeout(hideTip, 4500);
    }, { passive: false });
  });
}

/* ================= intro / help =================
   Poenggrenser are a genuinely confusing unit: the number is a grade average
   times ten, and it describes the *last* person admitted rather than a
   requirement. A 15-year-old landing here cold should not have to infer that,
   so it gets said once, up front, and stays reachable behind the ? button. */
const INTRO_SEEN = 'pk-intro-v1';

function renderControls() {
  for (const [id, key] of [['help-btn', 'helpLabel'], ['contact-btn', 'contactLabel']]) {
    const el = document.getElementById(id);
    el.title = t(key);
    el.setAttribute('aria-label', t(key));
  }
}

function renderIntro() {
  document.getElementById('intro-h').textContent = t('introTitle');
  const [avg, pts] = t('introCalc');
  const keys = t('introKeys');
  const dot = (r, fill, extra = '') =>
    `<svg class="swatch" width="${r * 2 + 4}" height="${r * 2 + 4}" viewBox="0 0 ${r * 2 + 4} ${r * 2 + 4}">` +
    `<circle cx="${r + 2}" cy="${r + 2}" r="${r}" fill="${fill}" ${extra}/></svg>`;
  const steps = t('introSteps').map(([h, b], i) => `
    <div class="step">
      <div class="n">${i + 1}</div>
      <div>
        <h3>${esc(h)}</h3>
        <p>${esc(b)}</p>
        ${i === 0 ? `<div class="calc"><b>${esc(avg)}</b><span>=</span><b>${esc(pts)}</b></div>` : ''}
        ${i === 1 ? `<div class="keyrow">
          <span class="key">${dot(6, cssVar('--seq-250'))}${esc(keys[0])}</span>
          <span class="key">${dot(6, cssVar('--seq-700'))}${esc(keys[1])}</span>
          <span class="key">${dot(6, 'none', `stroke="${cssVar('--accent')}" stroke-width="1.6" stroke-dasharray="3 2"`)}${esc(keys[2])}</span>
          <span class="key">${dot(6, cssVar('--context'))}${esc(keys[3])}</span>
        </div>` : ''}
      </div>
    </div>`).join('');
  document.getElementById('intro-body').innerHTML =
    `<p class="lede">${esc(t('introLede'))}</p>${steps}` +
    `<p class="caveat">${esc(t('introCaveat'))}</p>` +
    `<button class="cta" onclick="closeIntro()">${esc(t('introCta'))}</button>`;
  document.getElementById('intro-x').setAttribute('aria-label', t('close'));
}

function openIntro() {
  renderIntro();
  document.getElementById('intro').hidden = false;
  setTimeout(() => document.querySelector('#intro .cta')?.focus(), 40);
}

function closeIntro() {
  document.getElementById('intro').hidden = true;
  try { localStorage.setItem(INTRO_SEEN, '1'); } catch (e) {}
  document.getElementById('help-btn')?.focus();
}

/* ================= language ================= */
function setLang(l) {
  lang = l;
  try { localStorage.setItem('pk-lang', l); } catch (e) {}
  document.documentElement.lang = l === 'no' ? 'no' : 'en';
  document.title = t('pageTitle');
  renderPanel(); renderLegend(); renderCatNote(); drawMarkers();
  if (current) renderSide();
  if (!document.getElementById('intro').hidden) renderIntro();
  if (!document.getElementById('contact').hidden) renderContact();
}

/* ================= boot ================= */
function framePad() {
  // The panel and legend float over the map, so fit the country into what is
  // actually visible. Each pad is capped: on a phone held sideways the panel
  // is over half the width, and paying that in full squeezed Norway into the
  // right-hand third and dropped the zoom a whole step.
  const box = id => document.getElementById(id).getBoundingClientRect();
  const p = box('panel'), l = box('legend');
  const cap = (v, max) => Math.max(12, Math.min(Math.round(v), Math.round(max)));
  // On a short screen every pixel of height counts, and the legend sits
  // bottom-left while the country sits centre-right — let the map run under it
  // rather than shrink the whole of Norway to avoid a corner.
  const bottom = innerHeight <= 480 ? 12
    : cap(innerHeight - l.top + 12, innerHeight * 0.3);
  if (innerWidth <= 560) {
    return { paddingTopLeft: [12, cap(p.height + 22, innerHeight * 0.34)],
             paddingBottomRight: [12, bottom] };
  }
  return { paddingTopLeft: [cap(p.right + 12, innerWidth * 0.32), 12],
           paddingBottomRight: [12, bottom] };
}

async function main() {
  try { lang = localStorage.getItem('pk-lang') || lang; } catch (e) {}
  DATA = await (await fetch('data/schools.json')).json();
  // Open on the whole dataset. This used to open on a hard-coded Rogaland view
  // and correct itself inside a requestAnimationFrame — but rAF does not fire
  // while the tab is not being painted, so a national map could sit there
  // showing one county. Fit first, synchronously, and treat the deferred pass
  // purely as a correction for a pane that was still laying out.
  const pts = DATA.schools.filter(s => s.lat).map(s => [s.lat, s.lon]);
  HOME = L.latLngBounds(pts).pad(0.06);
  map = L.map('map', { zoomControl: false, zoomSnap: 0.25 }).fitBounds(HOME, framePad());
  L.control.zoom({ position: 'bottomright' }).addTo(map);
  setTiles();
  let touched = false;
  ['mousedown', 'wheel', 'touchstart'].forEach(ev => map.getContainer()
    .addEventListener(ev, () => { touched = true; }, { once: true, passive: true }));
  setTimeout(() => {
    map.invalidateSize();
    if (!touched) map.fitBounds(HOME, { ...framePad(), animate: false });
  }, 150);
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    setTiles(); drawMarkers(); renderLegend();
    if (current) renderSide();
  });
  document.getElementById('side').setAttribute('inert', '');
  document.getElementById('s-filter').addEventListener('input', renderList);
  let reframe;
  addEventListener('resize', () => {
    clearTimeout(reframe);
    reframe = setTimeout(() => { map.invalidateSize(); }, 200);
  });
  addEventListener('popstate', () => {
    if (document.getElementById('side').classList.contains('open')) closeSide(true);
  });
  document.addEventListener('keydown', ev => {
    if (ev.key !== 'Escape') return;
    if (!document.getElementById('contact').hidden) { closeContact(); return; }
    if (!document.getElementById('intro').hidden) { closeIntro(); return; }
    if (document.getElementById('side').classList.contains('open')) closeSide();
  });
  renderPanel(); renderLegend(); renderCatNote(); drawMarkers();
  let seen = true;
  try { seen = !!localStorage.getItem(INTRO_SEEN); } catch (e) {}
  if (!seen) setTimeout(openIntro, 420);
}
main();
</script>
