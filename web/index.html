<style>
  :root {
    color-scheme: light;
    --page: #f4f6f9;
    --surface: rgba(255,255,255,.85);
    --surface-solid: #ffffff;
    /* --ink-3 carries every smallest string in the app — 9px legend labels,
       10.5px field labels, the source note — so it has to clear 4.5:1 */
    --ink: #0f1720; --ink-2: #46525e; --ink-3: #6b7480;
    --line: rgba(15,23,32,.09);
    --accent: #2a78d6; --accent-soft: rgba(42,120,214,.10);
    --context: #c3cdd6;
    --seq-250:#86b6ef; --seq-350:#5598e7; --seq-450:#2a78d6; --seq-550:#1c5cab; --seq-700:#0d366b;
    --shadow: 0 10px 32px rgba(15,23,32,.12), 0 1px 3px rgba(15,23,32,.08);
    --good: #0b7f0b;
    --danger: #c0392f;
    /* the chance chips print ~10px text on a 14% tint of these, which the
       band colours themselves do not clear 4.5:1 against — so the text has
       its own, darker value while the dots and bars keep the band colour */
    --chip-good: #0a6b0a; --chip-warn: #8a5308; --chip-danger: #a82f26;
    --warn: #a1620a; --warn-soft: rgba(180,120,20,.11);
  }
  /* The dark palette exists twice: under the OS preference (yielding to an
     explicit light choice) and under the explicit dark choice. Keep the two
     token blocks identical — they are the same theme reached two ways. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0e1116;
      --surface: rgba(23,27,33,.85);
      --surface-solid: #171b21;
      --ink: #f2f5f8; --ink-2: #a9b4c0; --ink-3: #8b95a1;
      --line: rgba(255,255,255,.09);
      --accent: #3987e5; --accent-soft: rgba(57,135,229,.14);
      --context: #3a4553;
      --seq-250:#9ec5f4; --seq-350:#6da7ec; --seq-450:#3987e5; --seq-550:#256abf; --seq-700:#184f95;
      --shadow: 0 10px 32px rgba(0,0,0,.45), 0 1px 3px rgba(0,0,0,.4);
      --good: #3fbf4a;              /* the one token that had no dark value */
      --danger: #e26b6e;
      --chip-good: #3fbf4a; --chip-warn: #e0a052; --chip-danger: #ea8e90;
      --warn: #e0a052; --warn-soft: rgba(224,160,82,.13);
    }
  }
  :root[data-theme="dark"] {
      color-scheme: dark;
      --page: #0e1116;
      --surface: rgba(23,27,33,.85);
      --surface-solid: #171b21;
      --ink: #f2f5f8; --ink-2: #a9b4c0; --ink-3: #8b95a1;
      --line: rgba(255,255,255,.09);
      --accent: #3987e5; --accent-soft: rgba(57,135,229,.14);
      --context: #3a4553;
      --seq-250:#9ec5f4; --seq-350:#6da7ec; --seq-450:#3987e5; --seq-550:#256abf; --seq-700:#184f95;
      --shadow: 0 10px 32px rgba(0,0,0,.45), 0 1px 3px rgba(0,0,0,.4);
      --good: #3fbf4a;              /* the one token that had no dark value */
      --danger: #e26b6e;
      --chip-good: #3fbf4a; --chip-warn: #e0a052; --chip-danger: #ea8e90;
      --warn: #e0a052; --warn-soft: rgba(224,160,82,.13);
  }

  /* colour-blind-friendly: the chance scale's green swaps to a blue nothing
     else on that scale uses; red–green is the axis most CVD readers lose */
  :root[data-cvd="1"] { --good: #0072b2; --chip-good: #005a8f; }
  @media (prefers-color-scheme: dark) {
    :root[data-cvd="1"]:not([data-theme="light"]) { --good: #58a9e8; --chip-good: #6cb4ef; }
  }
  :root[data-theme="dark"][data-cvd="1"] { --good: #58a9e8; --chip-good: #6cb4ef; }

  /* text-size steps scale the floating chrome, never the map itself */
  :root[data-font="lg"] #panel, :root[data-font="lg"] #side .scroll,
  :root[data-font="lg"] #legend, :root[data-font="lg"] .modal .sheet,
  :root[data-font="lg"] #searchov .ovbox, :root[data-font="lg"] #toast,
  :root[data-font="lg"] #controls { zoom: 1.15; }
  :root[data-font="xl"] #panel, :root[data-font="xl"] #side .scroll,
  :root[data-font="xl"] #legend, :root[data-font="xl"] .modal .sheet,
  :root[data-font="xl"] #searchov .ovbox, :root[data-font="xl"] #toast,
  :root[data-font="xl"] #controls { zoom: 1.3; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      transition-duration: .01ms !important; animation-duration: .01ms !important;
      scroll-behavior: auto !important;
    }
  }


  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page); color: var(--ink);
    font-size: 14px; -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }
  #app { display: flex; height: 100%; }
  #map { flex: 1; min-width: 0; background: var(--page); }
  .leaflet-container { font: inherit; }

  .glass {
    background: var(--surface);
    -webkit-backdrop-filter: blur(16px) saturate(1.5);
    backdrop-filter: blur(16px) saturate(1.5);
    border: 1px solid var(--line); border-radius: 16px;
    box-shadow: var(--shadow);
  }

  /* ---------- top-left control panel ---------- */
  #panel { position: absolute; top: 14px; left: 14px; z-index: 1000; width: 316px; padding: 16px 16px 14px;
           /* a long choices list on a short phone ran under the legend; the
              panel scrolls inside instead of growing past it */
           max-height: calc(100vh - 150px); max-height: calc(100dvh - 150px);
           overflow-y: auto; overscroll-behavior: contain; }
  #panel:focus { outline: none; }
  .skip {
    position: absolute; left: 14px; top: 14px; z-index: 3000; padding: 9px 14px;
    background: var(--surface-solid); color: var(--ink); border: 1px solid var(--line);
    border-radius: 10px; box-shadow: var(--shadow); font-weight: 600; font-size: 13px;
    text-decoration: none; transform: translateY(-220%);
  }
  .skip:focus { transform: none; outline: 3px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: no-preference) { .skip { transition: transform .12s ease-out; } }
  .brand { display: flex; align-items: center; gap: 9px; }
  .brand .mark { width: 26px; height: 26px; flex: none; }
  .brand h1 { font-size: 19px; font-weight: 700; letter-spacing: -.02em; }
  #tagline { font-size: 12px; color: var(--ink-2); line-height: 1.45; margin: 8px 0 12px; }
  .field label { display: block; font-size: 10.5px; font-weight: 600; letter-spacing: .06em;
                 text-transform: uppercase; color: var(--ink-3); margin-bottom: 5px; }
  .field + .field { margin-top: 10px; }
  .field select {
    width: 100%; padding: 8px 10px; font: inherit; font-size: 13px; color: var(--ink);
    background: var(--surface-solid); border: 1px solid var(--line); border-radius: 10px;
    cursor: pointer; outline-offset: 2px;
  }
  #cat-note { font-size: 11px; color: var(--ink-3); margin-top: 6px; min-height: 14px; }
  #cat-note:empty { display: none; }
  #pts-field { margin-top: 10px; }
  .ptsrow { display: flex; gap: 6px; align-items: center; }
  .ptsrow input {
    flex: 1; min-width: 0; padding: 8px 10px; font: inherit; font-size: 13px; color: var(--ink);
    background: var(--surface-solid); border: 1px solid var(--line); border-radius: 10px;
    font-variant-numeric: tabular-nums; outline-offset: 2px;
  }
  .ptsrow input.on { border-color: var(--accent); }
  .ptsrow input.bad { border-color: var(--danger); }
  #pts-note.bad { color: var(--danger); }
  .ptsrow button {
    width: 34px; height: 34px; flex: none; border: 1px solid var(--line); border-radius: 10px;
    background: var(--surface-solid); color: var(--ink-2); cursor: pointer; font: inherit; font-size: 13px;
  }
  .ptsrow button:hover { background: var(--accent-soft); color: var(--accent); }
  /* ---------- settings ---------- */
  #settings .sheet { max-width: 420px; }
  #settings .row { margin-top: 14px; }
  .seg button svg { width: 15px; height: 15px; display: block; }
  #settings .row .t { font-size: 10.5px; font-weight: 600; letter-spacing: .06em;
                      text-transform: uppercase; color: var(--ink-3); margin-bottom: 6px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
  .seg button {
    border: none; background: none; padding: 7px 13px; font-size: 12.5px; font-weight: 600;
    color: var(--ink-2); cursor: pointer;
  }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--accent); color: #fff; }
  #settings .note { font-size: 11.5px; color: var(--ink-3); line-height: 1.5; margin-top: 16px;
                    border-top: 1px solid var(--line); padding-top: 11px; }
  /* ---------- grade calculator ---------- */
  #calc-open svg { width: 16px; height: 16px; }
  #calc .sheet { max-width: 480px; }
  #calc .lede { font-size: 12.5px; color: var(--ink-2); line-height: 1.5; margin: 2px 0 12px; }
  #calc .subj { display: flex; align-items: center; justify-content: space-between; gap: 8px;
                padding: 4.5px 0; border-bottom: 1px solid var(--line); }
  #calc .subj .n { font-size: 12.5px; color: var(--ink); min-width: 0; }
  #calc .subj.exam .n { font-style: italic; }
  #calc .grades { display: flex; gap: 3px; flex: none; }
  #calc .grades button {
    width: 26px; height: 26px; border: 1px solid var(--line); border-radius: 6px;
    background: none; color: var(--ink-2); font-size: 12px; font-weight: 600; cursor: pointer;
    display: grid; place-items: center; padding: 0;
  }
  #calc .grades button:hover { border-color: var(--accent); color: var(--accent); }
  #calc .grades button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  #calc .grades button.rm { border: none; color: var(--ink-3); font-weight: 400; }
  /* invisible, not absent: the slot is reserved so picking a grade never
     shoves the whole row leftwards when the ✕ appears */
  #calc .grades button.rm.off { visibility: hidden; }
  #calc .grades button[hidden], .modal .cta[hidden] { display: none; }
  #calc .sum { display: flex; align-items: baseline; gap: 14px; margin: 14px 0 4px; }
  #calc .sum .v { font-size: 22px; font-weight: 700; letter-spacing: -.02em;
                  font-variant-numeric: tabular-nums; }
  #calc .sum .l { font-size: 11px; color: var(--ink-3); }
  #calc .note { font-size: 11px; color: var(--ink-3); line-height: 1.5; margin-top: 12px;
                border-top: 1px solid var(--line); padding-top: 10px; }
  @media (max-width: 560px) {
    #calc .subj .n { font-size: 12px; }
    #calc .grades button { width: 30px; height: 30px; }
  }
  /* ---------- search overlay (design C trial) ---------- */
  #searchov { align-items: flex-start; }
  #searchov .ovbox {
    margin-top: min(18vh, 150px); width: min(560px, 92vw);
    background: var(--surface-solid); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: var(--shadow); padding: 10px;
  }
  #ov-q {
    width: 100%; padding: 12px 14px; font: inherit; font-size: 16px; color: var(--ink);
    background: var(--page); border: 1px solid var(--line); border-radius: 10px;
    outline: none;
  }
  #ov-q:focus { border-color: var(--accent); }
  #ov-list { margin-top: 6px; max-height: 320px; overflow-y: auto; }
  #ov-list .opt {
    display: flex; justify-content: space-between; gap: 10px; align-items: baseline;
    padding: 10px 12px; border-radius: 8px; cursor: pointer; font-size: 14px;
  }
  #ov-list .opt .fy { font-size: 12px; color: var(--ink-3); flex: none; }
  #ov-list .opt.act, #ov-list .opt:hover { background: var(--accent-soft); }
  #ov-list .none { padding: 10px 12px; font-size: 13px; color: var(--ink-3); }
  /* ---------- list view (same filters, table instead of map) ---------- */
  #view-toggle { display: flex; width: 100%; margin: 0 0 12px; }
  #view-toggle button { flex: 1; text-align: center; }
  #listview {
    flex: 1; min-width: 0; overflow-y: auto; background: var(--page);
    padding: 14px 16px 24px 346px;
  }
  body.view-list #map, body.view-list #legend { display: none; }
  body.view-list .leaflet-bottom { display: none; }
  #listview .card {
    background: var(--surface-solid); border: 1px solid var(--line); border-radius: 16px;
    padding: 16px 20px 12px; max-width: 1060px;
    overflow-x: auto;               /* a phone scrolls the table inside the card */
  }
  #listview .lhead { display: flex; justify-content: space-between; align-items: baseline;
                     gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
  #listview .lhead .t { font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
  #listview .lhead .n { font-size: 11.5px; color: var(--ink-3); }
  #listview table { width: 100%; border-collapse: collapse; font-size: 13px; }
  #listview th {
    text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line);
    font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    color: var(--ink-3); cursor: pointer; white-space: nowrap; user-select: none;
  }
  #listview th.num, #listview td.num { text-align: right; font-variant-numeric: tabular-nums; }
  #listview th.on { color: var(--accent); }
  #listview td { padding: 8px 10px; border-bottom: 1px solid var(--line); }
  #listview tbody tr { cursor: pointer; }
  #listview tbody tr:hover, #listview tbody tr:focus-visible { background: var(--accent-soft); }
  #listview tbody tr:focus-visible { outline: none; }
  #listview .sc { font-weight: 600; }
  #listview .fy { color: var(--ink-2); }
  #listview .chip {
    display: inline-block; min-width: 44px; text-align: center; padding: 2px 9px;
    border-radius: 7px; font-weight: 600; color: #fff; font-variant-numeric: tabular-nums;
  }
  #listview .chip.lo { color: var(--ink); }        /* light bands need dark text */
  #listview .chip.open { border: 1px dashed var(--accent); color: var(--ink-2);
                         font-weight: 400; font-size: 12px; background: none; }
  #listview .up { color: var(--good); }
  #listview .dn { color: var(--ink-2); }
  #listview .none-v { color: var(--ink-3); }
  #listview .k { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
                 margin-right: 6px; vertical-align: 0; }
  #listview .foot { padding: 10px 2px 0; font-size: 11.5px; color: var(--ink-3); line-height: 1.5; }
  @media (max-width: 760px) {
    body.view-list #app { overflow-y: auto; }
    body.view-list #panel { position: static; margin: 10px; width: auto; max-height: none; }
    body.view-list #app { flex-direction: column; }
    #listview { padding: 0 10px 24px; overflow: visible; }
    body.view-list #controls { display: none; }
  }
  @media (min-width: 761px) and (max-width: 1100px) {
    body.view-list #panel { width: 260px; }
    #listview { padding-left: 292px; }
  }
  /* on narrow screens the legend covers the bottom-right map controls;
     --ctrl-lift (set from the legend's measured height) moves them above it */
  .leaflet-bottom.leaflet-right { margin-bottom: var(--ctrl-lift, 0px); }
  /* ---------- locate control + toast ---------- */
  .leaflet-bar button.locate {
    width: 30px; height: 30px; display: grid; place-items: center;
    border: none; background: var(--surface-solid); color: var(--ink-2); cursor: pointer;
    border-radius: 4px;
  }
  .leaflet-bar button.locate:hover { color: var(--accent); }
  .leaflet-bar button.locate.on { color: var(--accent); }
  .leaflet-bar button.locate svg { width: 16px; height: 16px; }
  #toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 3000;
    background: var(--surface-solid); color: var(--ink); border: 1px solid var(--line);
    border-radius: 10px; box-shadow: var(--shadow); padding: 10px 14px; font-size: 13px;
    max-width: min(92vw, 420px); text-align: center;
  }
  #toast[hidden] { display: none; }
  #pts-note { font-size: 11px; color: var(--ink-3); margin-top: 6px; line-height: 1.4; }
  #pts-note .k { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin: 0 3px 0 1px; vertical-align: -1px; }
  /* Chance bands are semantic colours, deliberately not the blue threshold
     ramp: a dot's colour answers a different question once points are set. */
  .b-likely { --b: var(--good); --bt: var(--chip-good); }
  .b-realistic { --b: var(--warn); --bt: var(--chip-warn); }
  .b-long { --b: var(--danger); --bt: var(--chip-danger); }
  .chance {
    margin: 10px 18px 0; padding: 9px 12px 9px 11px; border-radius: 9px;
    background: var(--accent-soft); border-left: 2px solid var(--accent);
    font-size: 11.5px; line-height: 1.45; color: var(--ink-2);
  }
  .chance .h { font-size: 13px; color: var(--ink); font-weight: 600; margin-bottom: 3px; }
  .chance .bar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; margin: 6px 0; background: var(--line); }
  .chance .bar span { height: 100%; background: var(--b); }
  .chance .adj { margin-top: 6px; color: var(--ink-3); }
  .chance.prompt { background: transparent; border-left-color: var(--line); color: var(--ink-3); }
  /* my choices: a pick toggle on every programme row, a list in the panel */
  .prow .pick {
    flex: none; width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center;
    border: 1px solid var(--line); color: var(--ink-3); font-size: 14px; line-height: 1;
    background: var(--surface-solid); cursor: pointer;
  }
  .prow .pick:hover { border-color: var(--accent); color: var(--accent); }
  /* a 1px border change is not a focus indicator; match the rest of the app */
  .prow .pick:focus-visible { border-color: var(--accent); color: var(--accent);
    outline: 3px solid var(--accent); outline-offset: 2px; }
  .prow .pick.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  #choices { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 9px; }
  #choices .h { font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
                color: var(--ink-3); display: flex; justify-content: space-between; align-items: baseline; }
  #choices .h button { border: none; background: none; color: var(--ink-3); font: inherit; font-size: 10.5px;
                       cursor: pointer; text-decoration: underline dotted; padding: 0; }
  /* fifteen choices used to push the summary, the legend and the controls off
     the bottom of the screen with nothing to scroll */
  #choices .list { max-height: min(32dvh, 280px); overflow-y: auto; overscroll-behavior: contain; }
  #choices .row { display: flex; align-items: center; gap: 7px; padding: 5px 0; border-bottom: 1px solid var(--line); }
  #choices .row:last-of-type { border-bottom: none; }
  #choices .row .who { flex: 1; min-width: 0; text-align: left; border: none; background: none; font: inherit;
                       color: var(--ink); cursor: pointer; padding: 0; line-height: 1.3; }
  #choices .row .who:hover .sc, #choices .row .who:focus-visible .sc { color: var(--accent); }
  #choices .row .sc { font-size: 12px; font-weight: 600; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #choices .row .pr { font-size: 11px; color: var(--ink-2); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #choices .row .rm { flex: none; width: 22px; height: 22px; border: none; border-radius: 7px; background: none;
                      color: var(--ink-3); cursor: pointer; font-size: 13px; position: relative; }
  /* invisible hit-area extension: a fingertip needs ~40px, the glyphs stay small */
  #choices .row .rm::after, #choices .h button::after,
  #controls .ico::after, .modal .x::after { content: ''; position: absolute; inset: -9px; }
  #choices .h button, #controls .ico, .modal .x { position: relative; }
  #choices .row .rm:hover { background: var(--accent-soft); color: var(--accent); }
  #choices .sum { font-size: 11.5px; color: var(--ink-2); margin-top: 7px; line-height: 1.45; }
  #choices .sum b { color: var(--ink); }
  #choices .sum .nudge { display: block; margin-top: 3px; color: var(--warn); }
  /* the counts and the combined figure cover only the choices that have a
     forecast; say so rather than let them read as covering the whole list */
  #choices .sum .part { display: block; margin-top: 3px; color: var(--ink-3); }
  #choices .vnote { font-size: 11.5px; color: var(--warn); margin-top: 7px; line-height: 1.45; }
  /* the same refusal, shown where the tap happened: on a phone the choices
     box lives in the hidden control panel while the school sheet is open */
  #pick-note {
    position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    z-index: 2400; padding: 11px 14px; border-radius: 11px; font-size: 13.5px; line-height: 1.45;
    background: var(--surface-solid); color: var(--warn); border: 1px solid var(--line);
    box-shadow: var(--shadow); opacity: 0; transform: translateY(8px); pointer-events: none;
    transition: opacity .18s ease, transform .18s ease; max-width: 480px; margin: 0 auto;
  }
  #pick-note.show { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) { #pick-note { transition: none; transform: none; } }
  #s-list .oldnote { display: block; width: 100%; border: none; background: none; cursor: pointer;
                     text-align: left; padding: 9px 14px 11px; font: inherit; font-size: 11.5px;
                     color: var(--ink-3); text-decoration: underline; text-underline-offset: 2px; }
  #s-list .oldnote:hover { color: var(--ink-2); }
  #choices .bar { display: flex; height: 5px; border-radius: 3px; overflow: hidden; margin: 6px 0 2px; background: var(--line); }
  #choices .bar span { height: 100%; background: var(--b); }
  .ch {
    font-size: 10px; font-weight: 650; letter-spacing: .01em; padding: 2px 6px; border-radius: 999px;
    flex: none; cursor: help; white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--bt, var(--b));
    /* opaque, not a tint: in the choices panel the chip sits on frosted glass
       with the map showing through, so a translucent background made the text
       contrast depend on whatever the reader had scrolled to */
    background: color-mix(in srgb, var(--b) 14%, var(--surface-solid));
    border: 1px solid color-mix(in srgb, var(--b) 40%, transparent);
  }

  /* ---------- intro / help ---------- */
  .modal {
    position: fixed; inset: 0; z-index: 2000; display: grid; place-items: center;
    padding: 18px; background: rgba(8,11,15,.58); backdrop-filter: blur(3px);
    animation: fade .18s ease-out;
  }
  .modal[hidden] { display: none; }
  @keyframes fade { from { opacity: 0 } }
  .modal .sheet {
    overscroll-behavior: contain;
    /* stable gutter: content growing past the fold (the calculator's Tøm
       button) must not summon a scrollbar that shoves every row sideways */
    scrollbar-gutter: stable;
    position: relative; width: min(560px, 100%); max-height: calc(100dvh - 36px);
    overflow: auto; background: var(--surface-solid); border: 1px solid var(--line);
    border-radius: 18px; box-shadow: var(--shadow); padding: 26px 26px 22px;
    animation: rise .22s cubic-bezier(.2,.8,.3,1);
  }
  @keyframes rise { from { transform: translateY(10px); opacity: 0 } }
  .modal .x {
    position: absolute; top: 14px; right: 14px; width: 30px; height: 30px;
    border: none; border-radius: 9px; background: var(--accent-soft);
    color: var(--ink-2); font-size: 15px; cursor: pointer; line-height: 1;
  }
  .modal .x:hover { color: var(--ink); }
  .modal .head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; padding-right: 34px; }
  .modal .head svg { width: 28px; height: 28px; flex: none; }
  .modal h2 { font-size: 20px; font-weight: 700; letter-spacing: -.02em; }
  #intro .lede { font-size: 14px; line-height: 1.5; color: var(--ink-2); margin-bottom: 18px; }
  #intro .step { display: flex; gap: 12px; margin-bottom: 15px; }
  #intro .n {
    flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--accent);
    color: #fff; font-size: 12px; font-weight: 700; display: grid; place-items: center;
    margin-top: 1px;
  }
  #intro .step h3 { font-size: 13.5px; font-weight: 650; margin-bottom: 3px; }
  #intro .step p { font-size: 13px; line-height: 1.5; color: var(--ink-2); }
  #intro .calc {
    display: flex; align-items: baseline; gap: 8px; margin: 9px 0 2px; padding: 9px 12px;
    background: var(--accent-soft); border-radius: 10px; font-size: 14px; color: var(--ink);
  }
  #intro .calc b { font-size: 17px; font-variant-numeric: tabular-nums; }
  #intro .keyrow { display: flex; gap: 16px; margin: 10px 0 2px; flex-wrap: wrap; }
  #intro .key { display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--ink-3); }
  #intro .key .swatch { flex: none; }
  #intro .caveat a { color: var(--accent); }
  #intro .caveat {
    font-size: 11.5px; line-height: 1.5; color: var(--ink-3);
    border-top: 1px solid var(--line); padding-top: 12px; margin-top: 16px;
  }
  #intro .colophon { font-size: 11.5px; line-height: 1.5; color: var(--ink-3); margin-top: 9px; }
  #intro .colophon a { color: var(--accent); }
  #intro .colophon .who { display: block; margin-top: 2px; }
  .modal .cta {
    display: block; width: 100%; margin-top: 14px; padding: 11px; border: none;
    border-radius: 11px; background: var(--accent); color: #fff; font: inherit;
    font-size: 14px; font-weight: 650; cursor: pointer;
  }
  .modal .cta:hover { filter: brightness(1.06); }
  .modal .cta.ghost {
    margin-top: 8px; background: none; color: var(--ink-2);
    border: 1px solid var(--line); font-weight: 600;
  }
  .modal .cta.ghost:hover { filter: none; color: var(--ink); border-color: var(--ink-3); }

  /* ---------- utility window (top right) ---------- */
  #controls {
    position: absolute; top: 14px; right: 14px; z-index: 1000;
    display: flex; align-items: center; gap: 6px; padding: 6px;
  }
  #controls .ico {
    width: 28px; height: 28px; display: grid; place-items: center; padding: 0;
    border: 1px solid var(--line); border-radius: 8px; background: none;
    color: var(--ink-2); cursor: pointer;
  }
  #controls .ico:hover { color: var(--accent); border-color: var(--accent); }
  #controls .ico svg { width: 15px; height: 15px; }
  /* the sidebar slides in over this corner, so step out of its way */
  body.side-open #controls { right: calc(min(480px, max(320px, 100vw - 350px)) + 14px); }

  /* ---------- feedback form ---------- */
  #contact .sheet { max-width: 520px; }
  #contact label { display: block; font-size: 10.5px; font-weight: 600; letter-spacing: .06em;
                   text-transform: uppercase; color: var(--ink-3); margin: 12px 0 5px; }
  #contact select, #contact input, #contact textarea {
    width: 100%; padding: 9px 10px; font: inherit; font-size: 13.5px; color: var(--ink);
    background: var(--page); border: 1px solid var(--line); border-radius: 10px;
    outline-offset: 2px;
  }
  #contact textarea { min-height: 108px; resize: vertical; line-height: 1.45; }
  #contact .hint { font-size: 11.5px; color: var(--ink-3); margin: 0 0 6px; line-height: 1.45; }
  #contact .privacy {
    font-size: 11px; line-height: 1.5; color: var(--ink-3);
    border-top: 1px solid var(--line); padding-top: 11px; margin-top: 18px;
  }
  #contact .err {
    margin-top: 12px; padding: 9px 11px; border-radius: 9px; font-size: 12.5px;
    background: rgba(200,40,40,.12); color: var(--danger);
  }
  #contact .cta[disabled] { opacity: .55; cursor: progress; }
  /* honeypot: off-screen rather than display:none, which some bots skip */
  #contact .hp { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }
  #contact .done { text-align: center; padding: 14px 4px 4px; }
  #contact .done svg { width: 46px; height: 46px; margin-bottom: 12px; }
  #contact .done .big { font-size: 16px; font-weight: 650; color: var(--ink); margin-bottom: 4px; }
  #contact .done p { font-size: 13px; color: var(--ink-2); }
  #contact .done .cta { max-width: 220px; margin: 18px auto 0; text-align: center;
                        text-decoration: none; box-sizing: border-box; }

  /* ---------- tooltip ---------- */
  #tip {
    position: fixed; z-index: 2200; max-width: 260px; padding: 8px 10px;
    background: var(--surface-solid); color: var(--ink-2); border: 1px solid var(--line);
    border-radius: 10px; box-shadow: var(--shadow); font-size: 11.5px; line-height: 1.45;
    pointer-events: none; opacity: 0; transition: opacity .12s;
  }
  #tip.on { opacity: 1; }
  #tip b { color: var(--ink); }
  .tipped { cursor: help; text-decoration: underline dotted var(--ink-3); text-underline-offset: 2px; }

  /* ---------- the dataset did not load ---------- */
  .boot-fail {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px; padding: 24px;
    text-align: center; color: var(--ink-2); font-size: 13.5px;
  }
  .boot-fail .big { font-size: 17px; font-weight: 650; color: var(--ink); }
  .boot-fail .cta {
    margin-top: 6px; padding: 10px 18px; border: 0; border-radius: 10px;
    background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer;
  }

  /* ---------- legend ---------- */
  #legend { position: absolute; bottom: 22px; left: 14px; z-index: 1000; padding: 11px 14px 10px; font-size: 11px; color: var(--ink-2); }
  #legend .t { font-weight: 600; color: var(--ink); font-size: 11.5px; margin-bottom: 7px; letter-spacing: .01em; }
  #legend .bins { display: flex; align-items: center; gap: 0; }
  #legend .bin { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  #legend .sw { width: 34px; height: 8px; }
  #legend .bin:first-child .sw { border-radius: 4px 0 0 4px; }
  #legend .bin:last-child .sw { border-radius: 0 4px 4px 0; }
  #legend .bl { font-size: 9.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  #legend .none { display: flex; align-items: center; gap: 6px; margin-top: 7px; color: var(--ink-3); }
  #legend .none .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--context); flex: none; }
  #legend .none .dot.open-dot { background: var(--accent-soft); border: 1.5px dashed var(--accent); }
  #legend .none + .none { margin-top: 3px; }
  #legend .none[hidden] { display: none; }     /* the flex rule above would win otherwise */
  #legend .sizenote { margin-top: 7px; color: var(--ink-3); max-width: 210px; line-height: 1.35; }
  #legend .sizenote.warn { color: var(--ink-2); border-top: 1px solid var(--line); padding-top: 6px; }
  .round.unknown { background: transparent; color: var(--ink-2); border: 1px dashed var(--line); }
  .round {
    display: inline-block; font-size: 9.5px; font-weight: 650; letter-spacing: .02em;
    padding: 1px 6px; border-radius: 999px; background: var(--accent-soft);
    color: var(--accent); vertical-align: 1px; white-space: nowrap; cursor: help;
  }

  /* ---------- map marker & tooltip ---------- */
  .leaflet-interactive:focus { outline: 3px solid var(--accent); outline-offset: 2px; }
  .leaflet-tooltip.tip {
    background: var(--surface-solid); color: var(--ink); border: 1px solid var(--line);
    border-radius: 12px; box-shadow: var(--shadow); padding: 9px 12px;
  }
  .leaflet-tooltip-top.tip::before { border-top-color: var(--surface-solid); }
  .tip .n { font-weight: 650; font-size: 13px; letter-spacing: -.01em; }
  .tip .v { font-size: 12px; color: var(--ink-2); margin-top: 2px; font-variant-numeric: tabular-nums; }
  .tip .h { font-size: 10.5px; color: var(--ink-3); margin-top: 4px; }

  /* ---------- marker clusters ---------- */
  .pk-cluster {
    display: flex; align-items: center; justify-content: center;
    border-radius: 999px; font-weight: 700; font-size: 12px; color: #fff;
    background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft),
                0 2px 8px rgba(0,0,0,.35);
    border: 2px solid var(--surface-solid);
  }
  .pk-cluster.big { font-size: 13.5px; }
  .leaflet-cluster-anim .leaflet-marker-icon { transition: transform .2s ease; }

  /* ---------- sidebar ---------- */
  #side {
    width: 0; overflow: hidden; transition: width .22s cubic-bezier(.4,0,.2,1);
    background: var(--surface-solid); border-left: 1px solid var(--line);
    display: flex; flex-direction: column; z-index: 1100;
  }
  /* keep the control panel clear of the sidebar at tablet widths */
  #side.open { width: min(480px, max(320px, 100vw - 350px)); }
  #side > .scroll { overflow-y: auto; flex: 1; min-width: min(480px, max(320px, 100vw - 350px)); overscroll-behavior: contain; }

  /* fallback ground is fixed dark blues so the white name reads in both themes */
  .photo { position: relative; height: 168px; background: linear-gradient(135deg, #2a6cbf, #0d366b); }
  .photo #s-minimap { position: absolute; inset: 0; z-index: 0; }
  .photo #s-minimap .leaflet-container { background: var(--page); }
  .photo img { width: 100%; height: 100%; object-fit: cover;
               object-position: var(--photo-pos, center); display: block; }
  .photo .veil { position: absolute; inset: 0; background: linear-gradient(180deg, transparent 40%, rgba(10,14,18,.62)); }
  .photo .close {
    position: absolute; top: 12px; right: 12px; width: 30px; height: 30px; border-radius: 50%;
    border: none; cursor: pointer; font-size: 15px; line-height: 1;
    background: rgba(15,23,32,.45); color: #fff; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  .photo .name { position: absolute; left: 18px; right: 18px; bottom: 12px; color: #fff; }
  .photo .name h2 { font-size: 19px; font-weight: 700; letter-spacing: -.015em; text-wrap: balance; text-shadow: 0 1px 8px rgba(0,0,0,.5); }
  .photo .name .credit { font-size: 9.5px; opacity: .75; margin-top: 2px; }
  .photo .name .credit a { color: inherit; }

  .meta { padding: 12px 18px 0; display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--ink-2); }
  .meta a { color: var(--accent); text-decoration: none; font-weight: 550; }
  .meta a:hover { text-decoration: underline; }

  /* what the county did to this school: a merger, a disputed figure, a year
     published from a different intake round */
  .notes { padding: 10px 18px 0; display: grid; gap: 5px; }
  .notes p {
    font-size: 11.5px; line-height: 1.45; color: var(--ink-2);
    border-left: 2px solid var(--line); padding: 1px 0 1px 9px;
  }
  .round.stale { background: transparent; color: var(--ink-2); border: 1px dashed var(--ink-3); }
  .hero { display: flex; gap: 26px; padding: 14px 18px 12px; border-bottom: 1px solid var(--line); }
  .hero .cell .v { font-size: 26px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .hero .cell .v.up { color: var(--good); } .hero .cell .v.dn { color: var(--ink-2); }
  .hero .cell .l { font-size: 10.5px; color: var(--ink-3); margin-top: 1px; }
  /* A mean over the few programmes that filled up reads like a busy school
     even when most of it took everyone who applied. Wherever a mean is
     printed, this says so. */
  .mixwarn {
    display: flex; gap: 7px; align-items: baseline;
    margin: 10px 18px 0; padding: 7px 10px 7px 9px; border-radius: 9px;
    background: var(--warn-soft); border-left: 2px solid var(--warn);
    font-size: 11.5px; line-height: 1.45; color: var(--ink-2);
  }
  .mixwarn .sign { color: var(--warn); font-size: 12px; flex: none; }
  .mixwarn b { color: var(--ink); font-weight: 650; }
  .tip .warn { color: var(--warn); }

  /* chart card */
  .chart-card { margin: 14px 18px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface-solid); }
  .chart-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px 0; flex-wrap: wrap; }
  .tabs { display: flex; background: var(--accent-soft); border-radius: 9px; padding: 2px; }
  .tabs button { border: none; background: none; padding: 4px 11px; font-size: 12px; font-weight: 600;
                 color: var(--ink-2); border-radius: 7px; cursor: pointer; }
  .tabs button.on { background: var(--surface-solid); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.15); }
  .chart-head select { flex: 1; min-width: 120px; padding: 4px 8px; font: inherit; font-size: 12px;
                       border: 1px solid var(--line); border-radius: 8px; background: var(--surface-solid); color: var(--ink); }
  #chart-sub { font-size: 11px; color: var(--ink-3); padding: 6px 14px 0; }
  #chart-wrap { position: relative; padding: 4px 6px 8px; }
  #chart-tip {
    position: absolute; pointer-events: none; display: none; z-index: 5;
    background: var(--surface-solid); border: 1px solid var(--line); border-radius: 9px;
    box-shadow: var(--shadow); padding: 6px 9px; font-size: 11.5px; white-space: nowrap;
  }
  #chart-tip .y { font-weight: 700; }
  #chart-tip .r { color: var(--ink-2); font-variant-numeric: tabular-nums; }

  /* program list */
  .tools { padding: 2px 18px 10px; }
  .tools input {
    width: 100%; padding: 8px 12px; font: inherit; font-size: 13px; border: 1px solid var(--line);
    border-radius: 10px; background: var(--page); color: var(--ink); outline-offset: 2px;
  }
  .cat-head {
    display: flex; align-items: baseline; gap: 8px; width: 100%; text-align: left;
    border: none; background: none; cursor: pointer;
    padding: 12px 18px 5px; font-size: 11px; font-weight: 700; letter-spacing: .07em;
    text-transform: uppercase; color: var(--ink-3);
  }
  .cat-head:hover { color: var(--accent); }
  .scope-chip {
    display: flex; align-items: center; gap: 8px; margin: 10px 18px 2px; padding: 6px 10px;
    background: var(--accent-soft); border-radius: 9px; font-size: 11.5px; color: var(--ink-2);
  }
  .scope-chip span { font-weight: 650; color: var(--ink); }
  .scope-chip button {
    margin-left: auto; border: none; background: none; cursor: pointer;
    color: var(--accent); font-size: 11.5px; font-weight: 600; padding: 0;
  }
  .cat-head .cnt { font-weight: 500; letter-spacing: 0; text-transform: none; }
  .prow {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    padding: 7px 18px; border: none; background: none; cursor: pointer;
  }
  .prow:hover, .prow.sel { background: var(--accent-soft); }
  .prow .nm { flex: 1; font-size: 13px; line-height: 1.3; }
  .prow .lv { font-size: 9.5px; font-weight: 600; color: var(--ink-3); border: 1px solid var(--line);
              border-radius: 5px; padding: 1px 5px; flex: none; }
  .fbadge { font-size: 9.5px; color: var(--ink-3); border: 1px dashed var(--line); border-radius: 5px;
            padding: 1px 5px; margin-left: 7px; cursor: help; white-space: nowrap; }
  .prow.muted .nm, .prow.muted .val { color: var(--ink-3); }
  .prow .val { font-size: 13.5px; font-weight: 650; font-variant-numeric: tabular-nums; flex: none; width: 68px; text-align: right; }
  .prow .val small { display: block; font-weight: 400; font-size: 9px; color: var(--ink-3); }
  .prow .val .soft { color: var(--ink-2); font-weight: 500; font-size: 11.5px; }
  #src-note { padding: 14px 18px 20px; font-size: 10.5px; color: var(--ink-3); line-height: 1.5; }

  .leaflet-control-attribution { background: var(--surface) !important; color: var(--ink-3) !important; font-size: 9.5px !important; }
  .leaflet-control-attribution a { color: var(--ink-2) !important; }
  .leaflet-control-zoom a { background: var(--surface-solid) !important; color: var(--ink) !important; border-color: var(--line) !important; }
  @media (prefers-reduced-motion: reduce) {
    /* this used to name #side alone, while the sheets still rose and faded,
       the clusters still slid and the map still flew */
    #side, #tip { transition: none; }
    .modal, .sheet { animation: none; }
    .leaflet-cluster-anim .leaflet-marker-icon, .leaflet-cluster-anim .leaflet-marker-shadow {
      transition: none; }
  }
  /* ---------- phones ----------
     A 300px floating card on a 375px screen buries the map and collides with
     the utility window. On a phone the panel becomes a full-width header bar:
     brand and utilities on one row, the two selects side by side underneath. */
  @media (max-width: 560px) {
    #panel {
      left: 10px; right: 10px; width: auto; padding: 10px 12px 11px;
      display: grid; grid-template-columns: 116px minmax(0, 1fr);
      gap: 8px; align-items: end;
    }
    #panel .brand { grid-column: 1 / -1; padding-right: 140px; }
    #panel .brand h1 { font-size: 17px; }
    #cat-note { grid-column: 1 / -1; margin-top: 0; min-height: 0; }
    #pts-field { grid-column: 1 / -1; margin-top: 4px; }
    #pts-note { margin-top: 4px; }
    #choices { grid-column: 1 / -1; margin-top: 8px; padding-top: 7px; }
    /* one-county datasets hide the county select; let the other one spread */
    #fylke-field[hidden] + .field { grid-column: 1 / -1; }
    .field select { text-overflow: ellipsis; }
    #cat-note:empty { display: none; }
    #tagline { display: none; }            /* the panel hid 23 markers */
    .field label { font-size: 9.5px; letter-spacing: .04em; margin-bottom: 3px; }
    .field + .field { margin-top: 0; }
    .field select { padding: 7px 8px; font-size: 12.5px; }

    /* sits inside the panel's header row rather than fighting it for the corner */
    #controls {
      top: 20px; right: 22px; z-index: 1002; padding: 0; gap: 5px;
      background: none; border: none; box-shadow: none;
      -webkit-backdrop-filter: none; backdrop-filter: none;
    }
    #controls .ico { width: 26px; height: 26px; }

    /* The legend runs the width of the screen, but its scale is only 170px of
       that, so a wrapping row left the right half of the box empty and pushed
       the two keys onto a line of their own. Two columns instead: the scale on
       the left, the keys beside it, and the comparability warning — which a
       phone reader never saw — across the bottom of the freed space. */
    #legend {
      /* clears the Leaflet attribution strip, which the taller box overlapped */
      left: 10px; right: 10px; bottom: 16px; padding: 8px 11px 7px;
      display: grid; row-gap: 4px; column-gap: 12px; align-items: center;
      grid-template-columns: minmax(140px, 1fr) minmax(0, max-content);
    }
    #legend .t { grid-column: 1 / -1; margin-bottom: 0; }
    /* every cell is placed by hand: auto-flow reads the warning before the two
       keys and would drop it between them */
    #legend .bins { grid-area: 2 / 1 / 4 / 2; }
    /* the keys take the width their text needs and the scale spreads across
       whatever is left, so no phone width leaves a gutter between the two */
    #legend .bin { flex: 1 1 0; min-width: 0; }
    #legend .sw { width: 100%; }
    /* half a point smaller keeps a gap between "30–34" and "34–38" once
       the scale is squeezed on a 360px screen */
    #legend .bl { font-size: 9px; }
    #legend .none { grid-column: 2; grid-row: 2; margin-top: 0; }
    #legend .none + .none { grid-row: 3; margin-top: 0; }
    #legend .sizenote { display: none; }
    #legend .sizenote.warn:not([hidden]) {
      display: block; grid-area: 4 / 1 / 5 / -1; max-width: none;
      margin-top: 2px; padding-top: 5px;
    }
    /* a 16px chip is a poor tap target; the tooltip is worth reaching */
    .prow .lv { padding: 4px 7px; }
    /* fingers, not cursors: everything worth pressing gets a real target */
    .photo .close { width: 40px; height: 40px; font-size: 17px; }
    .meta a { display: inline-block; padding: 8px 0; }
    .tabs button { padding: 8px 13px; font-size: 12.5px; }
    .tools input { padding: 11px 12px; font-size: 13.5px; }
    .prow { padding-top: 11px; padding-bottom: 11px; }
  }
  /* ---------- short viewports (a phone held sideways) ----------
     375px of height cannot stack a tall panel above a tall legend: the legend
     rode up over the two selects and hid them completely. Drop the prose and
     lay the filters out side by side. */
  @media (max-height: 480px) {
    #tagline { display: none; }
    #panel { padding: 10px 12px 11px; }
    #legend { padding: 7px 10px 6px; }
    #legend .t { font-size: 10.5px; margin-bottom: 5px; }
    /* matches the phone rule's specificity so it still wins when both apply */
    #legend .sizenote, #legend .sizenote.warn:not([hidden]) { display: none; }
  }
  @media (max-height: 480px) and (min-width: 561px) {
    #panel {
      width: 430px; display: grid; grid-template-columns: 150px minmax(0, 1fr);
      gap: 8px; align-items: end;
    }
    #panel .brand, #panel #cat-note { grid-column: 1 / -1; }
    #cat-note { margin-top: 0; min-height: 0; }
    .field + .field { margin-top: 0; }
  }

  @media (max-width: 760px) {
    #side.open { width: 100vw; }
    #side > .scroll { min-width: 100vw; }
    body.side-open #panel, body.side-open #legend, body.side-open #controls { display: none; }
  }
  /* The UA's [hidden] { display: none } loses to any author display rule
     (.mixwarn's flex, .notes' grid, the calculator buttons before their
     guards). Restate it with !important so hidden always means hidden, and
     no future display: flex quietly resurrects an empty band. */
  [hidden] { display: none !important; }

function drawMarkers() {
  if (view === 'list') renderListView();
  if (markerLayer) map.removeLayer(markerLayer);
  const drawn = [];
  // 190 schools overlap badly at national zoom — nearly half had no reachable
  // pixel before clustering
  markerLayer = L.markerClusterGroup({
    maxClusterRadius: 44,
    disableClusteringAtZoom: 11,
    spiderfyOnMaxZoom: true,
    showCoverageOnHover: false,
    chunkedLoading: true,
    iconCreateFunction: cluster => {
      const n = cluster.getChildCount();
      const size = n < 10 ? 32 : n < 30 ? 38 : 44;
      return L.divIcon({
        html: `<div class="pk-cluster${n >= 30 ? ' big' : ''}" `
            + `style="width:${size}px;height:${size}px">${n}</div>`,
        className: '', iconSize: [size, size],
      });
    },
  }).addTo(map);
  for (const s of visibleSchools()) {
    if (!s.lat) continue;
    const st8 = schoolPressure(s, mapCat);
    const v = st8.kind === 'points' ? st8.v : null;
    // with points set the dot answers "can I get in here", not "how hard is it"
    const ch = chanceMode() ? schoolChance(s, mapCat, myPoints) : null;
    const style = chanceMode()
      ? (ch
        ? { radius: 7 + 5 * ((ch.likely + ch.realistic) / ch.n), weight: 2.5,
            color: cssVar('--surface-solid'), fillColor: bucketColor(bucketOf(ch.best)), fillOpacity: 0.96 }
        : { radius: 7.5, weight: 2, color: cssVar('--surface-solid'), fillColor: cssVar('--context'), fillOpacity: 0.9 })
      : st8.kind === 'points'
      ? { radius: 7 + 5 * (st8.share ?? 0.5), weight: 2.5,
          color: cssVar('--surface-solid'), fillColor: colorFor(v), fillOpacity: 0.96 }
      : st8.kind === 'open'
      ? { radius: 8, weight: 2, color: cssVar('--accent'), dashArray: '3 3', fillColor: cssVar('--accent'), fillOpacity: 0.14 }
      : { radius: 7.5, weight: 2, color: cssVar('--surface-solid'), fillColor: cssVar('--context'), fillOpacity: 0.9 };
    const m = L.circleMarker([s.lat, s.lon], style).addTo(markerLayer);
    let line;
    if (chanceMode()) {
      line = (mapCat === 'all' ? '' : `${CATS[mapCat][lang]}: `) + (ch
        ? t('tipChance', fmt(myPoints), ch.likely, ch.realistic, ch.long, ch.n, ch.year)
          + `<br>${t('tipBest', pct(ch.best), esc(progName(ch.bestProg)))}`
        : t('tipNoForecast'));
    } else if (mapCat === 'all') {
      if (st8.kind === 'points') {
        line = t('tipMedian', fmt(st8.v), st8.filled, st8.total) +
               (st8.mostlyOpen ? `<br><span class="warn">⚠ ${t('tipMostlyOpen')}</span>` : '') +
               `<br>${t('tipTop')} ${fmt(st8.top)} · ${esc(progName(st8.topProg))}`;
      } else if (st8.kind === 'open') {
        line = t('tipAllOpen', st8.year);
      } else if (st8.kind === 'stale') {
        line = t('tipStale', st8.year);
      } else {
        const sy = yearSpan(s);
        line = t('tipNoData', sy ? sy.split('–').pop() : DATA.years[DATA.years.length - 1]);
      }
    } else {
      line = st8.kind === 'points'
             ? `${CATS[mapCat][lang]}: ` + t('tipMedian', fmt(st8.v), st8.filled, st8.total)
               + (st8.mostlyOpen ? `<br><span class="warn">⚠ ${t('tipMostlyOpen')}</span>` : '')
           : st8.kind === 'open' ? `${CATS[mapCat][lang]}: ${t('allIn').toLowerCase()} (${st8.year})`
           : st8.kind === 'stale' ? `${CATS[mapCat][lang]}: ` + t('tipStale', st8.year)
           : `${CATS[mapCat][lang]}: –`;
    }
    const html = `<div class="n">${esc(s.name)}</div><div class="v">${line}</div>` +
      `<div class="v">${t('tipPrograms', visibleCount(s), yearSpan(s))}` +
      ` · <span class="round${s.round ? '' : ' unknown'}">` +
      `${s.round ? t('roundChip', s.round) : t('roundUnknown')}</span></div>` +
      `<div class="h">${t('tipHint')}</div>`;
    const tipOpts = dir => ({ className: 'tip', direction: dir, opacity: 1,
                              offset: dir === 'top' ? [0, -10] : [0, 10] });
    m.bindTooltip(html, tipOpts('top'));
    // flip below the marker near the top edge, where a 'top' tooltip is clipped
    m.on('mouseover', () => {
      const want = map.latLngToContainerPoint(m.getLatLng()).y < 140 ? 'bottom' : 'top';
      if (m.getTooltip().options.direction !== want) {
        m.unbindTooltip().bindTooltip(html, tipOpts(want)).openTooltip();
      }
    });
    m.on('click', () => openSide(s));
    m.on('dblclick', e => L.DomEvent.stop(e));   // don't zoom the map underneath
    drawn.push([m, s, line]);
  }
  // A clustered marker has no element yet — and at the opening view almost
  // every school is clustered, so labelling here and only here left the map
  // with nothing a keyboard could reach. Label whatever is on screen now, and
  // again each time clustering hands a marker a new element.
  labelMarkers = () => {
    for (const [m, s, line] of drawn) {
      const el = m.getElement();
      if (!el || el.dataset.pkKeyed) continue;
      el.dataset.pkKeyed = '1';                   // keyboard access (WCAG 2.1.1)
      el.setAttribute('tabindex', '0');
      el.setAttribute('role', 'button');
      el.setAttribute('aria-label', t('markerAria', s.name,
        line.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim()));
      el.addEventListener('keydown', ev => {
        if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); openSide(s); }
      });
      el.addEventListener('focus', () => m.openTooltip());
      el.addEventListener('blur', () => m.closeTooltip());
    }
  };
  // Leaflet.markercluster makes each cluster focusable with role="button" but
  // gives it no name and no key handling, so a screen reader met "2, button"
  // and Enter did nothing. Mirror what a click does.
  const labelClusters = () => {
    const fg = markerLayer._featureGroup;
    for (const l of (fg ? fg.getLayers() : [])) {
      const el = l._icon;
      if (!el || typeof l.getChildCount !== 'function' || el.dataset.pkKeyed) continue;
      el.dataset.pkKeyed = '1';
      el.setAttribute('aria-label', t('clusterAria', l.getChildCount()));
      el.addEventListener('keydown', ev => {
        if (ev.key !== 'Enter' && ev.key !== ' ') return;
        ev.preventDefault();
        if (l._bounds && map.getBoundsZoom(l._bounds) > map.getZoom()) l.zoomToBounds({ padding: [30, 30] });
        else l.spiderfy();
      });
    }
  };
  const labelPoints = labelMarkers;
  labelMarkers = () => { labelPoints(); labelClusters(); };
  markerLayer.on('animationend', labelMarkers);
  labelMarkers();
}

const schoolHash = s => '#s=' + encodeURIComponent(s.fylke) + '/' + encodeURIComponent(s.name);
function setUrlSchool(s) {
  try {
    history.replaceState(history.state, '',
      s ? schoolHash(s) : location.pathname + location.search);
  } catch (e) {}
}
function schoolFromUrl() {
  const m = /^#s=([^/]+)\/(.+)$/.exec(location.hash || '');
  if (!m) return null;
  try {
    const fy = decodeURIComponent(m[1]), name = decodeURIComponent(m[2]);
    return DATA.schools.find(x => x.fylke === fy && x.name === name) || null;
  } catch (e) { return null; }
