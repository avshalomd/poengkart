// Rogaland's image handler serves nothing but the original: a width in the
// path 404s and one in the query is ignored. Those few go through the host's
// image optimiser instead; every other photo already asks its own server for a
// display-sized rendition when the dataset is built.
const photoSrc = u => (/\/bv\.ashx\//.test(u) && location.protocol === 'https:'
                       && !/^(localhost|127\.)/.test(location.hostname))
  ? `/_vercel/image?url=${encodeURIComponent(u)}&w=960&q=75` : u;

function renderSide() {
  // current outlives closeSide, so a language or theme change would otherwise
  // rebuild the whole panel — minimap included — inside a zero-width box
  if (!current || !document.getElementById('side').classList.contains('open')) return;
  const s = current;
  // photo header
  const ph = document.getElementById('s-photo');
  ph.classList.toggle('nophoto', false);   // location map fills the same frame
  const creditText = s.photo_credit
    || (s.photo_source === 'commons' ? 'Wikimedia Commons' : 'Wikipedia');
  // esc() protects the attribute but not the scheme, and every one of these
  // comes from a scrape rather than from us
  const web = u => (/^https?:\/\//i.test(u || '') ? u : '');
  const creditHref = web(s.photo_page) || web(s.wiki_url) || '';
  const credit = s.photo
    ? `<div class="credit">` + (creditHref
        ? `<a href="${esc(creditHref)}" target="_blank" rel="noopener">${esc(creditText)}</a>`
        : esc(creditText)) + '</div>'
    : '';
  const pos = s.photo_position ? ` style="--photo-pos:${esc(s.photo_position)}"` : '';
  ph.innerHTML = (s.photo ? `<img src="${esc(photoSrc(s.photo))}" data-full="${esc(s.photo)}"`
                          + ` alt="" loading="lazy"${pos}>`
                          : `<div id="s-minimap"></div>`) +
    `<div class="veil"></div>` +
    `<button class="close" onclick="closeSide()" aria-label="${esc(t('closeAria'))}">✕</button>` +
    `<div class="name"><h2>${esc(s.name)}</h2>${credit}</div>`;
  // an optimiser that is not there, or a county URL that has expired since the
  // last build, should not leave a broken image in the header
  const pimg = ph.querySelector('img');
  if (pimg) {
    pimg.onerror = () => {
      pimg.onerror = null;
      if (pimg.dataset.full && pimg.src !== pimg.dataset.full) pimg.src = pimg.dataset.full;
      else { pimg.remove(); ph.querySelector('.credit')?.remove(); }
    };
  }
  // no freely licensed photo exists for this school: show where it actually is
  if (miniMap) { miniMap.remove(); miniMap = null; }
  if (!s.photo && s.lat) {
    miniMap = L.map('s-minimap', {
      zoomControl: false, attributionControl: false, dragging: false,
      scrollWheelZoom: false, doubleClickZoom: false, boxZoom: false,
      keyboard: false, touchZoom: false, tap: false,
    }).setView([s.lat, s.lon], 16);
    L.tileLayer(tileUrl(), { detectRetina: true }).addTo(miniMap);
    L.circleMarker([s.lat, s.lon], {
      radius: 9, weight: 3, color: '#fff', fillColor: cssVar('--accent'), fillOpacity: 1,
    }).addTo(miniMap);
    setTimeout(() => miniMap && miniMap.invalidateSize(), 30);
  }
  // meta links
  const meta = [];
  if (s.url) meta.push(`<a href="${esc(s.url.startsWith('http') ? s.url : 'https://' + s.url)}" target="_blank" rel="noopener">${t('website')} ↗</a>`);
  if (web(s.wiki_url)) meta.push(`<a href="${esc(s.wiki_url)}" target="_blank" rel="noopener">${t('wiki')} ↗</a>`);
  if (s.address) meta.push(`<span>${esc(s.address)}</span>`);
  if (s.fylke) meta.push(`<span>${esc(s.fylke)}</span>`);
  meta.push(s.round
    ? `<span class="round" title="${esc(t('roundTitle'))}">${t('roundChip', s.round)}</span>`
    : `<span class="round unknown" title="${esc(t('roundUnknownTitle'))}">${t('roundUnknown')}</span>`);
  // the map shows this school as "no data"; say why, where the history is
  const newest = [...new Set(s.programs.flatMap(p => Object.keys(p.values)))].sort().pop();
  if (newest && +newest < staleBefore()) {
    meta.push(`<span class="round stale" title="${esc(t('staleTitle'))}">`
            + `${t('staleChip', newest)}</span>`);
  }
  document.getElementById('s-meta').innerHTML = meta.join('');
  // the county's own history of this school, where it is not one school's own
  const notes = [];
  if (s.merged_from && s.merged_year) {
    notes.push(t('mergedNote', s.merged_from.join(t('listAnd')), s.merged_year));
  }
  if (s.uncertain_years && s.uncertain_years.length) {
    notes.push(t('uncertainNote', s.uncertain_years.join(', ')));
  }
  const cy = (DATA.counties || []).find(c => c.fylke === s.fylke) || {};
  const odd = Object.entries(cy.round_years || {})
    .filter(([y]) => s.programs.some(p => y in p.values));
  for (const [y, r] of odd) notes.push(t('roundYearNote', y, r));
  const noteBox = document.getElementById('s-notes');
  noteBox.innerHTML = notes.map(n => `<p>${esc(n)}</p>`).join('');
  noteBox.hidden = !notes.length;
  // One statistic everywhere: the dot on the map, this figure and the blue
  // line are all the mean of the same cells, and the change is the last step
  // of that line — so a reader can check the subtraction and it comes out.
  // What a mean cannot say on its own is how much of the school never had a
  // waitlist, so that is spelled out underneath instead of hidden in it.
  const lensCat = mapCat !== 'all' ? mapCat : null;
  const cells = [];
  const base = shownPrograms(s);
  const scopePrograms = lensCat ? base.filter(p => p.category === lensCat) : base;
  const meanAt = year => meanOf(scopePrograms.map(p => p.values[year]).filter(isPoints));
  const yrs = [...new Set(scopePrograms.flatMap(p => Object.keys(p.values)))].sort();
  const latest = yrs[yrs.length - 1];
  // the previous year the line actually plots, not merely the previous year
  // the school appears in — otherwise the change is a step off the chart
  const plotted = yrs.filter(y => meanAt(y) !== null);
  const prev = plotted[plotted.length - 2];
  const mean = meanAt(latest), meanPrev = prev === undefined ? null : meanAt(prev);
  const scopeLabel = lensCat ? CATS[lensCat][lang] : t('heroTypicalAll');
  if (mean !== null) {
    cells.push({ v: fmt(mean), l: `${t('heroTypical')} · ${scopeLabel} ${latest}` });
    if (meanPrev !== null) {
      const d = round1(mean - meanPrev);
      cells.push({ v: (d > 0 ? '+' : '') + fmt(d), l: t('heroDelta', prev),
                   cls: d > 0 ? 'up' : d < 0 ? 'dn' : '', ti: t('heroDeltaBasis') });
    }
  } else if (!scopePrograms.length) {
    // the lens names a programme this school does not offer: say that, rather
    // than let the no-cells fallback claim "everyone admitted"
    cells.push({ v: '\u2013', l: `${scopeLabel} \u00b7 ${t('notOffered')}` });
  } else {
    const last = scopePrograms.map(p => p.values[latest]).filter(v => v !== undefined);
    const label = last.includes('open') ? t('allIn')
                : last.includes('D') ? t('docAdm')
                : last.includes('F') ? t('priority')
                : last.length && last.every(v => v === 'U') ? t('gone')
                : t('allIn');
    cells.push({ v: label, l: `${scopeLabel} ${latest || ''}`.trim() });
  }
  cells.push({ v: visibleIn(scopePrograms), l: t('heroProgs') });
  const mix = openMix(scopePrograms, latest);
  const mixBox = document.getElementById('s-mix');
  mixBox.hidden = !(mix.mostly && mean !== null);
  if (!mixBox.hidden) {
    mixBox.innerHTML = `<span class="sign" aria-hidden="true">⚠</span><span>` +
      esc(t('mostlyOpenNote', mix.open, mix.total, latest,
             scopePrograms.map(p => p.values[latest]).filter(isPoints).length)) + `</span>`;
  }
  document.getElementById('s-hero').innerHTML =
    cells.map(c => `<div class="cell"${c.ti ? ` title="${esc(c.ti)}"` : ''}>` +
                   `<div class="v ${c.cls || ''}">${c.v}</div><div class="l">${c.l}</div></div>`).join('');
  renderChance(s, lensCat);
  document.getElementById('s-filter').placeholder = t('filterPh');
  document.getElementById('src-note').textContent = t('srcNote');
  renderChartCard();
  renderList();
  ['s-meta', 's-hero', 's-chance', 's-notes'].forEach(id =>
    bindTitleTips(document.getElementById(id)));
}

// The forecast block: with points set, how many of the school's programmes
// are within reach and on what basis; without, the mix-adjusted level and a
// pointer to the input. Follows the category lens the same way the hero does.
function renderChance(s, lensCat) {
  const box = document.getElementById('s-chance');
  const e = MODEL && MODEL.schools[`${s.fylke}|${s.name}`];
  if (!e || !e.programs) { box.hidden = true; return; }
  box.hidden = false;
  const adj = e.alpha === undefined ? ''
    : `<div class="adj tipped" title="${esc(t('adjTitle'))}">`
      + `${esc(t('adjLine', (e.alpha > 0 ? '+' : '') + fmt(e.alpha), fmt(e.alpha_se)))}</div>`;
  if (!chanceMode()) {
    box.className = 'chance prompt';
    box.innerHTML = `<div>${esc(t('chancePrompt'))}</div>${adj}`;
    return;
  }
  box.className = 'chance';
  const ch = schoolChance(s, lensCat || 'all', myPoints);
  if (!ch) { box.innerHTML = `<div>${esc(t('chanceNoneInScope'))}</div>${adj}`; return; }
  const head = ch.likely ? t('chanceHeadL', fmt(myPoints), ch.likely, ch.n)
             : ch.realistic ? t('chanceHeadR', fmt(myPoints), ch.realistic, ch.n)
             : t('chanceHeadU', fmt(myPoints), ch.n);
  const bar = ['likely', 'realistic', 'long']
    .map(b => `<span class="b-${b}" style="width:${100 * ch[b] / ch.n}%"></span>`).join('');
  const sf = Object.values((MODEL.meta || {}).sigma_forecast || {});
  const lo = sf.length ? Math.round(Math.min(...sf)) : 5, hi = sf.length ? Math.round(Math.max(...sf)) : 8;
  const cov = MODEL.meta && MODEL.meta.backtest_eval_years && MODEL.meta.backtest_eval_years.coverage80;
  // where the county publishes round 1: what the final round does, if measured
  let fin = '';
  const fb = finalRoundBridge(s);
  if (fb) {
    const scope = (lensCat ? s.programs.filter(p => p.category === lensCat) : s.programs);
    let L3 = 0, n3 = 0;
    for (const p of scope) {
      const pr = predFor(s, p);
      if (!pr) continue;
      n3++; if (bucketOf(chanceFinal(pr, myPoints, p.category, fb)) === 'likely') L3++;
    }
    fin = `<div>${esc(t('finalRoundNote', fb.to_round, L3, n3))}</div>`;
  } else if (s.round === '1') {
    fin = `<div>${esc(t('finalRoundUnknown'))}</div>`;
  }
  box.innerHTML = `<div class="h">${esc(head)}</div><div class="bar">${bar}</div>` +
    `<div>${esc(t('chanceCounts', ch.likely, ch.realistic, ch.long))}</div>` +
    `<div>${esc(t('chanceSub', ch.year, e.round, lo, hi))}` +
    (s.catchment ? ' ' + esc(t('chanceCatchment')) : '') +
    (cov != null ? ' ' + esc(t('chanceCal', Math.round(cov * 100))) : '') + `</div>` + fin + adj;
}

/* ================= chart (3 resolution levels) ================= */
function seriesFor(mode, cat, prog) {
  const progs = mode === 'prog' ? [prog]
    : mode === 'cat' ? shownPrograms(current).filter(p => p.category === cat)
    : shownPrograms(current);
  return progs.filter(p => Object.values(p.values).some(v => typeof v === 'number'));
}
function renderChartCard() {
  // tabs
  const tabs = document.querySelectorAll('#tabs button');
  tabs[0].textContent = t('tabAll'); tabs[1].textContent = t('tabCat'); tabs[2].textContent = t('tabProg');
  tabs.forEach(b => {
    b.classList.toggle('on', b.dataset.mode === chartMode());
    b.onclick = () => {
      if (b.dataset.mode === 'all') {
        chart.prog = null;
        setLens('all');
      } else if (b.dataset.mode === 'cat') {
        chart.prog = null;
        const present = [...new Set(current.programs.map(p => p.category))];
        setLens(mapCat !== 'all' && present.includes(mapCat) ? mapCat : present[0]);
      } else {
        const pool = current.programs.filter(p => mapCat === 'all' || p.category === mapCat);
        chart.prog = pool.find(p => numericLatest(p.values)) || pool[0] || null;
        renderChartCard(); renderList();
      }
    };
  });
  // category select inside chart
  const cs = document.getElementById('chart-cat');
  if (chartMode() === 'cat') {
    const present = [...new Set(current.programs.map(p => p.category))];
    if (!present.includes(mapCat)) present.push(mapCat);   // lens the school lacks
    cs.hidden = false;
    cs.innerHTML = present.map(c => `<option value="${c}">${CATS[c][lang]}</option>`).join('');
    cs.value = mapCat;
    cs.onchange = () => setLens(cs.value);
  } else cs.hidden = true;
  drawChart();
}

function drawChart() {
  // a chart must span the school's own years: Akershus and Trøndelag publish
  // one year, and nine mostly-empty columns read as a broken chart
  const own = [...new Set(shownPrograms(current).flatMap(p => Object.keys(p.values)))].sort();
  const allYears = DATA.years.map(String);
  const years = own.length > 1
    ? allYears.filter(y => y >= own[0] && y <= own[own.length - 1])
    : own;
  const W = 444, H = 190, ML = 30, MR = 12, MT = 16, MB = 22;
  const iw = W - ML - MR, ih = H - MT - MB;
  const series = seriesFor(chartMode(), mapCat, chart.prog);
  document.getElementById('chart-tip').style.display = 'none';  // stale on redraw
  const svgHost = document.getElementById('chart-svg');
  if (years.length < 2) {
    document.getElementById('chart-sub').textContent =
      t('oneYearOnly', years[0] || '');
    svgHost.innerHTML = '';
    return;
  }

  // the y-domain follows the data: a fixed 10-50 window flattened every school
  // whose thresholds run above 50 (Sauda ambulansefag sits at 51-54)
  const nums = series.flatMap(p => Object.values(p.values).filter(isPoints));
  let LO = 10, HI = 50;
  if (nums.length) {
    LO = Math.max(0, Math.floor((Math.min(...nums) - 3) / 5) * 5);
    HI = Math.ceil((Math.max(...nums) + 3) / 5) * 5;
    if (HI - LO < 20) { LO = Math.max(0, HI - 20); HI = LO + 20; }
  }
  const step = (HI - LO) > 45 ? 20 : 10;
  const ticks = [];
  for (let g = Math.ceil(LO / step) * step; g <= HI; g += step) ticks.push(g);
  const x = i => ML + i * iw / (years.length - 1);
  const y = v => MT + ih - (Math.min(Math.max(v, LO), HI) - LO) * ih / (HI - LO);
  const sub = document.getElementById('chart-sub');
  sub.textContent = chartMode() === 'prog'
    ? `${chart.prog ? progName(chart.prog) + ' · ' : ''}${t('chartSubProg')}`
    : chartMode() === 'cat' ? t('chartSubCat', series.length) : t('chartSubAll', series.length);
  if (chartMode() !== 'prog') {
    const cy = [...new Set(series.flatMap(p => Object.keys(p.values)))].sort().pop();
    const cm = openMix(chartMode() === 'cat'
      ? shownPrograms(current).filter(p => p.category === mapCat) : shownPrograms(current), cy);
    if (cm.mostly) sub.textContent += ` · ⚠ ${t('mostlyOpenShort')}`;
  }

  // The mean of the same cells the dot and the headline use, so the figure
  // above the chart sits exactly on this line's last point and the change is
  // its last step. 0,0 stays out: it is not a height on a points axis.
  const mid = {}, cnt = {};
  years.forEach(yr => {
    const vals = series.map(p => p.values[yr]).filter(isPoints);
    if (vals.length) { mid[yr] = meanOf(vals); cnt[yr] = vals.length; }
  });

  let svg = '';
  // grid + y labels
  for (const gy of ticks) {
    svg += `<line x1="${ML}" y1="${y(gy)}" x2="${W - MR}" y2="${y(gy)}" stroke="var(--line)" stroke-width="1"/>` +
           `<text x="${ML - 6}" y="${y(gy) + 3}" font-size="10.5" fill="var(--ink-3)" text-anchor="end">${gy}</text>`;
  }
  years.forEach((yr, i) => {
    svg += `<text x="${x(i)}" y="${H - 6}" font-size="10.5" fill="var(--ink-3)" text-anchor="middle">${yr.slice(2)}</text>`;
  });

  const lineOf = (p, stroke, width, op) => {
    let segs = [], run = [];
    years.forEach((yr, i) => {
      const v = p.values[yr];
      if (isPoints(v)) run.push(`${x(i)},${y(v)}`);
      else if (run.length) { segs.push(run); run = []; }
    });
    if (run.length) segs.push(run);
    return segs.filter(r => r.length > 1).map(r =>
      `<polyline points="${r.join(' ')}" fill="none" stroke="${stroke}" stroke-width="${width}" stroke-opacity="${op}" stroke-linejoin="round" stroke-linecap="round"/>`).join('');
  };

  if (chart.prog) {
    const p = chart.prog;
    svg += lineOf(p, 'var(--accent)', 2.5, 1);
    years.forEach((yr, i) => {
      const v = p.values[yr];
      if (isPoints(v))
        svg += `<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="var(--accent)" stroke="var(--surface-solid)" stroke-width="1.5"/>`;
      else if (v === 'open' || v === 0)   // neither is a height on this axis
        svg += `<circle cx="${x(i)}" cy="${y(LO)}" r="4" fill="var(--surface-solid)" stroke="var(--ink-3)" stroke-width="1.6"/>`;
    });
    const l = numericLatest(p.values);
    if (l) svg += `<text x="${x(years.indexOf(l[0])) - 8}" y="${Math.max(y(l[1]) - 9, MT - 3)}" font-size="11" font-weight="700" fill="var(--ink)" text-anchor="middle">${fmt(l[1])}</text>`;
  } else {
    for (const p of series) svg += lineOf(p, 'var(--context)', 1.4, .55);
    svg += lineOf({ values: mid }, 'var(--accent)', 2.6, 1);
    years.forEach((yr, i) => {
      if (mid[yr] != null)
        svg += `<circle cx="${x(i)}" cy="${y(mid[yr])}" r="3.6" fill="var(--accent)" stroke="var(--surface-solid)" stroke-width="1.4"/>`;
    });
  }
  svg += `<line id="xh" x1="0" x2="0" y1="${MT}" y2="${MT + ih}" stroke="var(--ink-3)" stroke-width="1" stroke-dasharray="3 3" visibility="hidden"/>`;
  document.getElementById('chart-svg').innerHTML =
    `<svg id="the-chart" viewBox="0 0 ${W} ${H}" width="100%" style="display:block">${svg}</svg>`;

  // crosshair + tooltip
  const svgEl = document.getElementById('the-chart');
  const tip = document.getElementById('chart-tip');
  const xh = svgEl.querySelector('#xh');
  svgEl.addEventListener('mousemove', ev => {
    const r = svgEl.getBoundingClientRect();
    const sx = (ev.clientX - r.left) * W / r.width;
    let bi = 0, bd = 1e9;
    years.forEach((yr, i) => { const d = Math.abs(x(i) - sx); if (d < bd) { bd = d; bi = i; } });
    const yr = years[bi];
    xh.setAttribute('x1', x(bi)); xh.setAttribute('x2', x(bi)); xh.setAttribute('visibility', 'visible');
    let body;
    if (chart.prog) {
      const v = chart.prog.values[yr];
      body = v === undefined ? '–'
        : isPoints(v) ? `${fmt(v)} ${t('pts')}`
        : v === 0 ? t('noPoints')
        : v === 'open' ? t('allIn') : v === 'F' ? t('priority')
        : v === 'D' ? t('docAdm') : t('gone');
    } else {
      body = mid[yr] != null ? `${t('midLabel')} ${fmt(mid[yr])} · ${cnt[yr]} ${t('series')}` : '–';
    }
    tip.innerHTML = `<span class="y">${yr}</span> <span class="r">${body}</span>`;
    tip.style.display = 'block';
    const wrap = document.getElementById('chart-wrap').getBoundingClientRect();
    let px = ev.clientX - wrap.left + 14;
    if (px > wrap.width - 130) px = ev.clientX - wrap.left - 130;
    tip.style.left = px + 'px';
    tip.style.top = (ev.clientY - wrap.top - 34) + 'px';
  });
  svgEl.addEventListener('mouseleave', () => { tip.style.display = 'none'; xh.setAttribute('visibility', 'hidden'); });
}

/* ================= program list ================= */
function renderList() {
  const q = (document.getElementById('s-filter').value || '').toLowerCase();
  // One scope for the whole app: the utdanningsprogram lens. Selecting a
  // programme-area row narrows the chart but never the list or the map.
  const scope = mapCat !== 'all' ? mapCat : null;
  const base = shownPrograms(current);
  const inScope = base.filter(p => !scope || p.category === scope);
  const matches = p => p.program.toLowerCase().includes(q)
                    || (p.program_en || '').toLowerCase().includes(q)
                    || (p.official || '').toLowerCase().includes(q);
  const { regular, orphans, prioNames } = partitionPrograms(
    // search both languages: an English reader types "health", a Norwegian
    // parent types "helse", and either should find the row
    inScope.filter(matches));
  const byCat = {};
  [...regular, ...orphans].forEach(p => (byCat[p.category] = byCat[p.category] || []).push(p));
  let html = '';
  if (scope) {
    const hidden = current.programs.length - inScope.length;
    html += `<div class="scope-chip"><span>${CATS[scope][lang]}</span>` +
            `<button onclick="clearScope()">${t('scopeAll')}${hidden ? ` (+${hidden})` : ''}</button></div>`;
  }
  const badged = new Set();  // badge only the first row per program name
  for (const c of Object.keys(CATS).filter(c => byCat[c])) {
    const list = byCat[c];
    list.sort((a, b) => (numericLatest(b.values)?.[1] ?? -1) - (numericLatest(a.values)?.[1] ?? -1));
    html += `<button class="cat-head" data-cat="${c}"><span>${CATS[c][lang]}</span><span class="cnt">${list.length}</span></button>`;
    for (const p of list) {
      // headline value: newest non-priority cell (F is a quota fact, not a value)
      let latestYear = null, lv;
      const ys = Object.keys(p.values).sort();
      for (let i = ys.length - 1; i >= 0; i--) {
        if (p.values[ys[i]] !== 'F') { latestYear = ys[i]; lv = p.values[ys[i]]; break; }
      }
      const orphan = latestYear === null;
      const hasF = ys.some(y => p.values[y] === 'F');
      const val = orphan ? `<span class="soft" title="${esc(t('fortrinnTitle'))}">${t('priority')} ⓘ</span>`
        : lv === 0 ? `<span class="soft" title="${esc(t('noPointsTitle'))}">${t('noPoints')} ⓘ</span>`
        : typeof lv === 'number' ? `${fmt(lv)}<small>${latestYear}</small>`
        : lv === 'open' ? `<span class="soft">${t('allIn')}</span>`
        : lv === 'D' ? `<span class="soft" title="${esc(t('docTitle'))}">${t('docAdm')}</span>`
        : `<span class="soft">${t('gone')}</span>`;
      const key = progId(p);
      let badge = '';
      if (!orphan && (prioNames.has(key) || hasF) && !badged.has(key)) {
        badged.add(key);
        badge = `<span class="fbadge" title="${esc(t('fortrinnTitle'))}">${t('prioBadge')}</span>`;
      }
      const sel = chart.prog === p ? ' sel' : '';
      let chip = '';
      if (chanceMode() && !orphan) {
        const pr = predFor(current, p);
        if (pr) {
          const ch = chanceOf(pr, myPoints);
          let tip = t('chTitle', pct(ch), pr.year, fmt(pr.m), fmt(pr.s), pct(pr.pi), pr.h);
          const fb = finalRoundBridge(current);
          if (fb) tip += ' ' + t('finalRoundChip', fb.to_round, pct(chanceFinal(pr, myPoints, p.category, fb)));
          chip = `<span class="ch b-${bucketOf(ch)}" data-tip="${esc(tip)}">${pct(ch)} %</span>`;
        }
      }
      const on = isChosen(current, p);
      const pick = orphan ? '' : `<span class="pick${on ? ' on' : ''}" role="button" tabindex="0" data-idx="${current.programs.indexOf(p)}"` +
        ` aria-pressed="${on}" aria-label="${esc(t(on ? 'pickRemove' : 'pickAdd'))}" title="${esc(t(on ? 'pickRemove' : 'pickAdd'))}">${on ? '✓' : '+'}</span>`;
      html += `<button class="prow${sel}${orphan ? ' muted' : ''}" data-cat="${c}" data-idx="${current.programs.indexOf(p)}">` +
              `<span class="nm"${p.official ? ` title="${esc(t('officialName', p.official))}"` : ''}>${esc(progName(p))}${badge}</span>${chip}<span class="lv">${esc(p.level)}</span><span class="val">${val}</span>${pick}</button>`;
    }
  }
  // the disclosure for history: how many rows the recency filter is hiding
  // from this view (same lens and search), or the way back once shown
  const hiddenMatch = showOld ? []
    : current.programs.filter(p => !base.includes(p) && (!scope || p.category === scope) && matches(p));
  const anyOld = current.programs.some(p => !isRecent(p, current.fylke));
  let oldBtn = '';
  if (hiddenMatch.length) oldBtn = `<button class="oldnote">${esc(t('oldHidden', hiddenMatch.length))}</button>`;
  else if (showOld && anyOld) oldBtn = `<button class="oldnote">${esc(t('oldShown'))}</button>`;
  const el = document.getElementById('s-list');
  // the scope chip alone is not content: an empty row set says "no matches"
  // whether or not a chip sits above it
  if (![...regular, ...orphans].length) html += `<div class="cat-head">${t('noMatch')}</div>`;
  el.innerHTML = html + oldBtn;
  el.querySelector('.oldnote')?.addEventListener('click', () => {
    showOld = !showOld;
    try { localStorage.setItem('pk-showold', showOld ? '1' : '0'); } catch (e) {}
    // the map tooltips count the same shown set, so the markers re-render too
    drawMarkers();
    renderSide();
  });
  el.querySelectorAll('.cat-head[data-cat]').forEach(b =>
    b.onclick = () => { chart.prog = null; setLens(b.dataset.cat); });
  el.querySelectorAll('.prow').forEach(b =>
    b.onclick = () => { chart.prog = current.programs[+b.dataset.idx]; renderChartCard(); renderList(); });
  // the pick toggle sits inside the row button: stop the row from selecting
  el.querySelectorAll('.pick').forEach(k => {
    const act = ev => { ev.preventDefault(); ev.stopPropagation(); toggleChoice(current, current.programs[+k.dataset.idx]); };
    k.onclick = act;
    k.onkeydown = ev => { if (ev.key === 'Enter' || ev.key === ' ') act(ev); };
  });
  bindTips(el);
}

/* ================= feedback =================
   The form asks only what the chosen kind of report actually needs: a school
   name is meaningless on a feature suggestion, and a photo link is meaningless
   on a wrong figure. Everything is posted to /api/feedback, which relays it to
   e-mail — the destination address is held server side so it never appears in
   this page. */
const FIELDS = {
  tall:     ['school', 'program', 'year'],
  bilde:    ['school', 'photo'],
  skole:    ['school', 'fylke'],
  funksjon: [],
  annet:    [],
};

function contactField(name) {
  const key = { school: 'contactSchool', program: 'contactProgram', year: 'contactYear',
                photo: 'contactPhoto', fylke: 'contactFylke' }[name];
  const open = document.getElementById('side').classList.contains('open');
  // Changing the kind of report rebuilds these fields, and both "wrong figure"
  // and "wrong photo" ask for a school: a hand-typed name used to be replaced
  // by the map's selection on the way past.
  const prev = document.getElementById(`c-${name}`);
  const value = prev ? prev.value
    : name === 'school' && open && current ? current.name
    : name === 'fylke' && mapFylke !== 'all' ? mapFylke : '';
  const type = name === 'photo' ? 'url' : name === 'year' ? 'number' : 'text';
  const extra = name === 'year'
    ? ` min="${DATA.years[0]}" max="${DATA.years[DATA.years.length - 1]}"` : '';
  return `<label for="c-${name}">${esc(t(key))}</label>
    <input id="c-${name}" data-f="${name}" type="${type}"${extra}
           autocomplete="off" value="${esc(value)}">`;
}

function renderContactFields() {
  const kind = document.getElementById('c-kind').value;
  document.getElementById('c-extra').innerHTML =
    FIELDS[kind].map(contactField).join('');
  const hint = t('contactHints')[kind];
  const el = document.getElementById('c-hint');
  el.textContent = hint || '';
  el.hidden = !hint;
}

// Both end states live here so that a language switch can redraw them. Going
// back to a blank form instead would replace a confirmation with an empty
// sheet, and the sender would reasonably conclude nothing had been sent.
function renderContactDone() {
  const body = document.getElementById('contact-body');
  body.innerHTML = body.dataset.done === 'handoff'
    ? `<div class="done">
         <svg viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2"
              stroke-linejoin="round" aria-hidden="true">
           <rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m3.6 6.4 8.4 6 8.4-6"/>
         </svg>
         <p class="big">${esc(t('contactHandoff'))}</p>
         <p>${esc(t('contactHandoffSub'))}</p>
         <a class="cta" href="${esc(body.dataset.mailto || '')}">${esc(t('contactOpenMail'))}</a>
       </div>`
    : `<div class="done">
         <svg viewBox="0 0 24 24" fill="none" stroke="var(--good)" stroke-width="2.4"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
           <path d="m4.5 12.5 5 5 10-11"/>
         </svg>
         <p class="big">${esc(t('contactSent'))}</p>
         <p>${esc(t('contactSentSub'))}</p>
         <button class="cta" onclick="closeContact()">${esc(t('close'))}</button>
       </div>`;
}

function renderContact() {
  document.getElementById('contact-h').textContent = t('contactTitle');
  document.getElementById('contact-x').setAttribute('aria-label', t('close'));
  const body = document.getElementById('contact-body');
  if (body.dataset.done) { renderContactDone(); return; }
  // ...and a switch mid-form should not empty the boxes either
  const keep = {};
  body.querySelectorAll('input, select, textarea').forEach(el => {
    if (el.id) keep[el.id] = el.value;
  });
  const kinds = t('contactKinds');
  body.innerHTML = `
    <p class="lede">${esc(t('contactLede'))}</p>
    <form id="c-form" novalidate>
      <label for="c-kind">${esc(t('contactKind'))}</label>
      <select id="c-kind">${Object.entries(kinds)
        .map(([k, v]) => `<option value="${k}">${esc(v)}</option>`).join('')}</select>

    </form>`;

async function sendContact(ev) {
  ev.preventDefault();
  const err = document.getElementById('c-err');
  const btn = document.getElementById('c-send');
  const msg = document.getElementById('c-msg');
  err.hidden = true;
  // three characters is what the relay accepts; anything shorter came back as a
  // bare "could not send", which reads like a fault in the site
  if (msg.value.trim().replace(/\s+/g, ' ').length < 3) {
    err.textContent = t('contactNeedMsg');
    err.hidden = false;
    msg.focus();
    return;
  }
  // "Hvilken skole?" is the one field with no "(valgfritt)", and a report about
  // a figure or a photo cannot be acted on without it
  const school = document.getElementById('c-school');
  if (school && !school.value.trim()) {
    err.textContent = t('contactNeedSchool');
    err.hidden = false;
    school.focus();
    return;
  }
  const mail = document.getElementById('c-email');
  if (mail.value.trim() && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail.value.trim())) {
    err.textContent = t('contactBadMail');
    err.hidden = false;
    mail.focus();
    return;
  }
  const payload = {
    type: document.getElementById('c-kind').value,
    message: msg.value,
    email: document.getElementById('c-email').value,
    website: document.getElementById('c-website').value,
    lang, page: location.pathname + location.search,
  };
  document.querySelectorAll('#c-extra input').forEach(i => { payload[i.dataset.f] = i.value; });
  btn.disabled = true;
  btn.textContent = t('contactSending');
  try {
    const r = await fetch('/api/feedback', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    if (!r.ok) throw new Error(String(r.status));
    const data = await r.json().catch(() => ({ ok: true }));
    // No provider key configured yet: the server hands back a prefilled
    // mailto: so the message the visitor wrote is not thrown away.
    const body = document.getElementById('contact-body');
    if (data.mailto) {
      location.href = data.mailto;
      body.dataset.done = 'handoff';
      body.dataset.mailto = data.mailto;
    } else {
      body.dataset.done = 'sent';
    }
    renderContactDone();
  } catch (e) {
    err.textContent = t('contactFail');
    err.hidden = false;
    btn.disabled = false;
    btn.textContent = t('contactSend');
  }
}

/* ================= tooltips =================
   "Vg1" is second nature inside the school system and opaque outside it, which
   covers most of the people this map is for. Hover explains it on a pointer;
   tap explains it on a touch screen without also selecting the programme row
   the chip sits inside. */
function showTip(el, html) {
  const tip = document.getElementById('tip');
  tip.hidden = false;
  tip.innerHTML = html;
  const r = el.getBoundingClientRect();
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = Math.max(8, Math.min(r.left + r.width / 2 - w / 2, innerWidth - w - 8));
  let y = r.top - h - 8;
  if (y < 8) y = r.bottom + 8;                 // flip below rather than clip
  tip.style.left = x + 'px';
  tip.style.top = y + 'px';
  tip.classList.add('on');
}

function hideTip() {
  const tip = document.getElementById('tip');
  tip.classList.remove('on');
  tip.hidden = true;
}

function bindTips(root) {
  const attach = (el, html) => {
    el.onmouseenter = () => showTip(el, html);
    el.onmouseleave = hideTip;
    el.addEventListener('touchstart', ev => {
      ev.preventDefault(); ev.stopPropagation();   // do not select the row
      showTip(el, html);
      clearTimeout(showTip.timer);
      showTip.timer = setTimeout(hideTip, 4500);
    }, { passive: false });
  };
  root.querySelectorAll('.ch[data-tip]').forEach(el => {
    el.setAttribute('aria-label', el.dataset.tip);
    attach(el, esc(el.dataset.tip));
  });
  bindTitleTips(root);
  root.querySelectorAll('.lv').forEach(el => {
    const key = el.textContent.trim();
    const entry = t('levels')[key];
    if (!entry) return;
    el.classList.add('tipped');
    el.setAttribute('aria-label', `${key}: ${entry[1]}`);
    const html = `<b>${esc(entry[0])}</b><br>${esc(entry[1])}`;
    el.onmouseenter = () => showTip(el, html);
    el.onmouseleave = hideTip;
    el.addEventListener('touchstart', ev => {
      ev.preventDefault(); ev.stopPropagation();   // do not select the row
      showTip(el, html);
      clearTimeout(showTip.timer);
      showTip.timer = setTimeout(hideTip, 4500);
    }, { passive: false });
  });
}

// A title attribute is invisible on a phone: no hover, no long-press, and a
// tap on an \u24d8 fell through to whatever sat underneath. Touch gets the
// same text in the app's own tooltip. Interactive elements are skipped — a
// tap on them must keep doing what it says, and their titles are redundant.
function bindTitleTips(root) {
  root.querySelectorAll('[title]').forEach(el => {
    if (el.closest('a, select, input, .pick, .who') || el.classList.contains('nm')) return;
    const txt = el.getAttribute('title');
    if (!txt) return;
    el.addEventListener('touchstart', ev => {
      ev.preventDefault(); ev.stopPropagation();
      showTip(el, esc(txt));
      clearTimeout(showTip.timer);
      showTip.timer = setTimeout(hideTip, 4500);
    }, { passive: false });
  });
}

/* ================= school search ================= */
// both sides of the match are folded, so "as" finds Ås and "sorumsand" Sørumsand
const foldName = s => s.toLowerCase()
  .replace(/æ/g, 'ae').replace(/ø/g, 'o').replace(/å/g, 'a').replace(/é/g, 'e')
  .replace(/[.,-]/g, ' ')
  .replace(/\s+/g, ' ').trim();
let searchIx = null;
function runSearch(q) {
  if (!DATA) return null;                      // a keystroke can beat the fetch
  if (!searchIx) searchIx = DATA.schools.map(s => ({ s, f: foldName(s.name) }));
  const f = foldName(q);
  if (!f) return null;
  // the exact tier exists because Norwegian collation puts Å after Z: without
  // it, typing "Ås" ranked Asker first and Enter opened the wrong school
  const score = e => e.f === f ? 0
    : e.f.startsWith(f) ? 1
    : e.f.split(' ').some(w => w.startsWith(f)) ? 2
    : e.f.includes(f) ? 3 : -1;
  return searchIx.map(e => [score(e), e.s]).filter(x => x[0] >= 0)
    .sort((a, b) => a[0] - b[0] || a[1].name.localeCompare(b[1].name, 'no'))
    .slice(0, 8).map(x => x[1]);
}

/* ================= geolocation ================= */
// the position is used for one map move and a marker; it never leaves the page
let locLayer = null, locBtnEl = null, locBusy = false;
function toast(msg) {
  const el = document.getElementById('toast');
  // reveal first: text set inside a hidden live region is not announced
  el.textContent = ''; el.hidden = false;
  setTimeout(() => { el.textContent = msg; }, 30);
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { el.hidden = true; }, 4000);
}
function addLocateControl() {
  if (!('geolocation' in navigator)) return;
  const C = L.Control.extend({
    onAdd() {
      const div = L.DomUtil.create('div', 'leaflet-bar');
      const b = L.DomUtil.create('button', 'locate', div);
      b.type = 'button';
      b.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"' +
        ' stroke-width="2" stroke-linecap="round" aria-hidden="true">' +
        '<circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/>' +
        '<path d="M12 1v3M12 20v3M1 12h3M20 12h3"/></svg>';
      locBtnEl = b;
      L.DomEvent.on(b, 'click', ev => { L.DomEvent.stop(ev); locate(); });
      return div;
    }
  });
  new C({ position: 'bottomright' }).addTo(map);
  updateLocateAria();
}
function updateLocateAria() {
  if (!locBtnEl) return;
  locBtnEl.title = t('locBtn');
  locBtnEl.setAttribute('aria-label', t('locBtn'));
  locBtnEl.setAttribute('aria-pressed', String(!!locLayer));
}
function locate() {
  if (locBusy) return;                  // one fix in flight at a time
  if (locLayer) {                       // second press clears the marker again
    map.removeLayer(locLayer); locLayer = null;
    locBtnEl.classList.remove('on');
    updateLocateAria();
    return;
  }
  locBusy = true;
  navigator.geolocation.getCurrentPosition(pos => {
    locBusy = false;
    const ll = [pos.coords.latitude, pos.coords.longitude];
    locLayer = L.layerGroup([
      L.circle(ll, { radius: pos.coords.accuracy || 0, color: cssVar('--accent'),
                     weight: 1, fillOpacity: .08 }),
      L.circleMarker(ll, { radius: 6, color: '#fff', weight: 2,
                           fillColor: cssVar('--accent'), fillOpacity: 1 })
    ]).addTo(map);
    locBtnEl.classList.add('on');
    updateLocateAria();
    const z = Math.max(map.getZoom(), 10);
    prefersStill() ? map.setView(ll, z) : map.flyTo(ll, z);
  }, err => {
    locBusy = false;
    toast(t(err && err.code === 1 ? 'locDenied' : 'locFail'));
  }, { timeout: 10000, maximumAge: 60000 });
}

/* ================= list view ================= */
let view = 'map';
let listSort = { key: 'value', dir: -1 };
let refitPending = false;      // a county switch made while the map was hidden
function setView(v) {
  if (v !== 'map' && v !== 'list') return;
  view = v;
  document.body.classList.toggle('view-list', v === 'list');
  document.getElementById('listview').hidden = v !== 'list';
  for (const [id, name] of [['view-map', 'map'], ['view-list', 'list']]) {
    const b = document.getElementById(id);
    b.classList.toggle('on', view === name);
    b.setAttribute('aria-pressed', String(view === name));
  }
  try { localStorage.setItem('pk-view', v); } catch (e) {}
  if (v === 'list') renderListView();
  else if (map) {
    map.invalidateSize();
    if (refitPending) {
      refitPending = false;
      const pts = visibleSchools().filter(s => s.lat).map(s => [s.lat, s.lon]);
      if (pts.length) map.fitBounds(L.latLngBounds(pts).pad(0.08), { ...framePad(), animate: false });
    }
  }
}
// the mean the map colours by, but for an arbitrary year — for the
// year-over-year column (same pool rules as schoolPressure: F/U out,
// literal zeros count as filled but stay out of the mean)
function meanForYear(s, cat, yr) {
  const scope = cat === 'all' ? s.programs : s.programs.filter(p => p.category === cat);
  const nums = scope.map(p => p.values[yr])
    .filter(v => v !== undefined && v !== 'F' && v !== 'U')
    .filter(isPoints);
  return nums.length ? meanOf(nums) : null;
}
function sortList(key) {
  listSort = listSort.key === key
    ? { key, dir: -listSort.dir }
    : { key, dir: key === 'name' || key === 'fylke' ? 1 : -1 };
  renderListView();
}
function renderListView() {
  const host = document.getElementById('listview');
  const chance = chanceMode();
  const allF = mapFylke === 'all';
  const rows = visibleSchools().map(s => {
    const pr = schoolPressure(s, mapCat);
    const v = pr.kind === 'points' ? pr.v : null;
    const prior = pr.kind === 'points' ? meanForYear(s, mapCat, String(+pr.year - 1)) : null;
    const sc = chance ? schoolChance(s, mapCat, myPoints) : null;
    return { s, pr, v, delta: v !== null && prior !== null ? v - prior : null,
             sc, best: sc ? sc.best : null };
  });
  const nil = x => x === null || x === undefined;
  rows.sort((a, b) => {
    const k = listSort.key;
    if (k === 'name') return a.s.name.localeCompare(b.s.name, 'no') * listSort.dir;
    if (k === 'fylke') return (a.s.fylke.localeCompare(b.s.fylke, 'no')
      || a.s.name.localeCompare(b.s.name, 'no')) * listSort.dir;
    const va = k === 'value' ? a.v : k === 'delta' ? a.delta : a.best;
    const vb = k === 'value' ? b.v : k === 'delta' ? b.delta : b.best;
    if (nil(va) && nil(vb)) return a.s.name.localeCompare(b.s.name, 'no');
    if (nil(va)) return 1;
    if (nil(vb)) return -1;
    return (va - vb) * listSort.dir || a.s.name.localeCompare(b.s.name, 'no');
  });
  const arrow = k => listSort.key === k ? (listSort.dir < 0 ? ' ↓' : ' ↑') : '';
  const ariaSort = k => listSort.key === k
    ? ` aria-sort="${listSort.dir < 0 ? 'descending' : 'ascending'}"` : '';
  const th = (k, label, num) =>
    `<th class="${num ? 'num ' : ''}${listSort.key === k ? 'on' : ''}"${ariaSort(k)} scope="col"` +
    ` onclick="sortList('${k}')">${esc(label)}${arrow(k)}</th>`;
  const catLabel = mapCat === 'all' ? t('listTitleAll')
    : (document.querySelector(`#map-cat option[value="${mapCat}"]`)?.textContent || mapCat);
  const fyLabel = allF ? (lang === 'no' ? 'hele landet' : 'all of Norway') : mapFylke;
  const chip = r => {
    if (r.pr.kind === 'open') return `<span class="chip open">${esc(t('listOpen'))}</span>`;
    if (r.v === null) return `<span class="none-v">${esc(t('listNoData'))}</span>`;
    const light = r.v < 34;                       // the two palest bands
    return `<span class="chip${light ? ' lo' : ''}" style="background:${colorFor(r.v)}"` +
      ` title="${r.pr.year}">${esc(fmt(r.v))}</span>`;
  };
  const deltaCell = r => r.delta === null ? `<span class="none-v">—</span>`
    : `<span class="${r.delta >= 0.05 ? 'up' : 'dn'}">${r.delta >= 0.05 ? '+' : ''}${esc(fmt(r.delta))}</span>`;
  const chanceCell = r => !r.sc ? `<span class="none-v">—</span>`
    : `<span class="k" style="background:${bucketColor(bucketOf(r.sc.best))}"></span>` +
      esc(t('listChanceCell', r.sc.likely, r.sc.n));
  host.innerHTML =
    `<div class="card"><div class="lhead">` +
    `<span class="t">${esc(catLabel)} · ${esc(fyLabel)}</span>` +
    `<span class="n">${esc(t('listCount', rows.length))}</span></div>` +
    `<table><thead><tr>` +
    th('name', t('listColSchool')) +
    (allF ? th('fylke', t('listColFylke')) : '') +
    th('value', t('listColVal'), true) +
    th('delta', t('listColDelta'), true) +
    (chance ? th('chance', t('listColChance', fmt(myPoints))) : '') +
    `</tr></thead><tbody>` +
    rows.map((r, i) =>
      `<tr tabindex="0" data-i="${i}" aria-label="${esc(t('listRowAria', r.s.name))}">` +
      `<td class="sc">${esc(r.s.name)}</td>` +
      (allF ? `<td class="fy">${esc(r.s.fylke)}</td>` : '') +
      `<td class="num">${chip(r)}</td>` +
      `<td class="num">${deltaCell(r)}</td>` +
      (chance ? `<td>${chanceCell(r)}</td>` : '') +
      `</tr>`).join('') +
    `</tbody></table>` +
    (allF ? `<div class="foot">${esc(t('listRounds'))}</div>` : '') +
    `</div>`;
  host.querySelectorAll('tbody tr').forEach(tr => {
    const open = () => openSide(rows[+tr.dataset.i].s);
    tr.onclick = open;
    tr.onkeydown = ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); open(); } };
  });
}

/* ================= grade calculator ================= */
// vitnemål subjects with a numeric grade at grunnskole level, official names;
// the two exam slots come on top of standpunkt, as on the vitnemål itself
const CALC_SUBJECTS = [
  'Norsk hovedmål', 'Norsk sidemål', 'Norsk muntlig', 'Engelsk skriftlig',
  'Engelsk muntlig', 'Matematikk', 'Naturfag', 'Samfunnsfag', 'KRLE',
  'Fremmedspråk / språklig fordypning', 'Kroppsøving', 'Kunst og håndverk',
  'Musikk', 'Mat og helse', 'Valgfag',
];
const CALC_EXAMS = ['Skriftlig eksamen', 'Muntlig eksamen'];
let calcGrades = {};
function loadCalc() {
  try {
    const g = JSON.parse(localStorage.getItem('pk-grades') || '{}');
    if (g && typeof g === 'object') {
      for (const [k, v] of Object.entries(g))
        if ([...CALC_SUBJECTS, ...CALC_EXAMS].includes(k) && [1,2,3,4,5,6].includes(v))
          calcGrades[k] = v;
    }
  } catch (e) {}
}
function saveCalc() {
  try {
    Object.keys(calcGrades).length
      ? localStorage.setItem('pk-grades', JSON.stringify(calcGrades))
      : localStorage.removeItem('pk-grades');
  } catch (e) {}
}
function calcMean() {
  const vs = Object.values(calcGrades);
  return vs.length ? vs.reduce((a, b) => a + b, 0) / vs.length : null;
}
function renderCalc() {
  document.getElementById('calc-h').textContent = t('calcTitle');
  document.getElementById('calc-x').setAttribute('aria-label', t('close'));
  const row = (f, exam) => {
    const cur = calcGrades[f];
    return `<div class="subj${exam ? ' exam' : ''}"><span class="n">${esc(f)}</span>` +
      `<span class="grades">` +
      [1,2,3,4,5,6].map(g =>
        `<button type="button" data-f="${esc(f)}" data-g="${g}" class="${cur === g ? 'on' : ''}"` +
        ` aria-pressed="${cur === g}" aria-label="${esc(t('calcGradeAria', g, f))}">${g}</button>`).join('') +
      `<button type="button" class="rm${cur ? '' : ' off'}" data-f="${esc(f)}" data-g=""` +
      ` aria-label="${esc(t('calcClearAria', f))}">✕</button>` +
      `</span></div>`;
  };
  const mean = calcMean();
  const fmtN = v => v.toFixed(2).replace('.', lang === 'no' ? ',' : '.');
  const fmtP = v => v.toFixed(1).replace('.', lang === 'no' ? ',' : '.');
  document.getElementById('calc-body').innerHTML =
    `<p class="lede">${esc(t('calcLede'))}</p>` +
    CALC_SUBJECTS.map(f => row(f, false)).join('') +
    CALC_EXAMS.map(f => row(f, true)).join('') +
    `<div class="sum">` +
    `<span><span class="v">${mean === null ? t('calcEmpty') : fmtN(mean)}</span> <span class="l">${esc(t('calcSnitt'))}</span></span>` +
    `<span><span class="v">${mean === null ? t('calcEmpty') : fmtP(mean * 10)}</span> <span class="l">${esc(t('calcPoeng'))}</span></span>` +
    `</div>` +
    `<button class="cta" id="calc-use" ${mean === null ? 'disabled' : ''}>${esc(t('calcUse'))}</button>` +
    ` <button class="cta ghost" id="calc-reset" ${Object.keys(calcGrades).length ? '' : 'hidden'}>${esc(t('calcReset'))}</button>` +
    `<p class="note">${esc(t('calcNote'))}</p>`;
  document.getElementById('calc-body').querySelectorAll('.grades button').forEach(b => {
    b.onclick = () => {
      const f = b.dataset.f, g = b.dataset.g;
      if (!g) delete calcGrades[f];
      else calcGrades[f] = +g;
      saveCalc(); renderCalc();
      // the rebuild removed the pressed button; focus its successor (or the
      // row's first grade, when the pressed one was the now-hidden ✕)
      document.querySelector(`#calc .grades button[data-f="${CSS.escape(f)}"][data-g="${g || '1'}"]`)?.focus();
    };
  });
  const use = document.getElementById('calc-use');
  if (use) use.onclick = () => {
    const m = calcMean();
    if (m === null) return;
    onPoints((m * 10).toFixed(1));       // renderPointsField reprints the field
    closeCalc();
  };
  const reset = document.getElementById('calc-reset');
  if (reset) reset.onclick = () => {
    calcGrades = {}; saveCalc(); renderCalc();
    document.querySelector('#calc .grades button')?.focus();
  };
}
function openCalc() {
  renderCalc();
  document.getElementById('calc').hidden = false;
  setModalTrap();
  openSheetHistory();
  setTimeout(() => document.querySelector('#calc .grades button')?.focus(), 40);
}
function closeCalc(fromHistory) {
  if (!fromHistory && (history.state || {}).pkSheet) { history.back(); return; }
  document.getElementById('calc').hidden = true;
  setModalTrap();
  document.getElementById('calc-open')?.focus();
}

/* ================= language ================= */
function setLang(l) {
  if (l !== 'no' && l !== 'en') return;   // the only two languages that exist
  lang = l;
  try { localStorage.setItem('pk-lang', l); } catch (e) {}
  document.documentElement.lang = l === 'no' ? 'no' : 'en';
  document.title = t('pageTitle');
  renderPanel(); renderLegend(); renderCatNote(); drawMarkers(); renderChoices();
  if (current) renderSide();
  if (!document.getElementById('intro').hidden) renderIntro();
  if (!document.getElementById('contact').hidden) renderContact();
  if (!document.getElementById('settings').hidden) renderSettings();
  if (!document.getElementById('calc').hidden) renderCalc();
}

/* ================= boot ================= */
function framePad() {
  // The panel and legend float over the map, so fit the country into what is
  // actually visible. Each pad is capped: on a phone held sideways the panel
  // is over half the width, and paying that in full squeezed Norway into the
  // right-hand third and dropped the zoom a whole step.
  const box = id => document.getElementById(id).getBoundingClientRect();
  const p = box('panel'), l = box('legend');
  const cap = (v, max) => Math.max(12, Math.min(Math.round(v), Math.round(max)));
  // On a short screen every pixel of height counts, and the legend sits
  // bottom-left while the country sits centre-right — let the map run under it
  // rather than shrink the whole of Norway to avoid a corner.
  const bottom = innerHeight <= 480 ? 12
    : cap(innerHeight - l.top + 12, innerHeight * 0.3);
  if (innerWidth <= 560) {
    return { paddingTopLeft: [12, cap(p.height + 22, innerHeight * 0.34)],
             paddingBottomRight: [12, bottom] };
  }
  return { paddingTopLeft: [cap(p.right + 12, innerWidth * 0.32), 12],
           paddingBottomRight: [12, bottom] };
}

// Without the dataset — or with one the map cannot be built from — every
// render is a no-op and the page settles into empty chrome over a grey
// rectangle with nothing to explain it. A build that shipped 195 schools and
// no coordinates did exactly that, in silence.
function bootFailed(subKey) {
  document.getElementById('app').innerHTML =
    `<div class="boot-fail"><p class="big">${esc(t('bootFail'))}</p>
     <p>${esc(t(subKey))}</p>
     <button class="cta" onclick="location.reload()">${esc(t('bootRetry'))}</button></div>`;
  document.getElementById('panel').hidden = true;
  document.getElementById('legend').hidden = true;
}

async function main() {
  loadPrefs();
  applyPrefs(false);
  loadCalc();
  try {
    const l = localStorage.getItem('pk-lang');
    if (l === 'no' || l === 'en') lang = l;   // anything else is not a language
  } catch (e) {}
  try { showOld = localStorage.getItem('pk-showold') === '1'; } catch (e) {}
  // setLang() does this on every switch, but a fresh load never called it, so a
  // reader who had chosen English got an English page inside a document still
  // declaring itself Norwegian — wrong to a screen reader and to a translator.
  document.documentElement.lang = lang === 'no' ? 'no' : 'en';
  document.title = t('pageTitle');
  // both requests leave together (and were already preloaded from <head>);
  // the forecast is optional: without it the points field stays hidden and
  // the app is exactly what it was
  const modelReq = fetch('data/model.json').catch(() => null);
  try {
    const r = await fetch('data/schools.json');
    if (!r.ok) throw new Error(String(r.status));
    DATA = await r.json();
    performance.mark('pk:data');
  } catch (e) {
    return bootFailed('bootFailSub');
  }
  try {
    const rm = await modelReq;
    if (rm && rm.ok) MODEL = await rm.json();
    performance.mark('pk:model');
  } catch (e) {}
  try {
    // through the same validator as the field: a stored 999 used to colour the
    // whole map on a score nobody can have
    const sp = parsePoints(localStorage.getItem('pk-points'));
    if (MODEL && sp.pts !== null) {
      myPoints = sp.pts;
      document.getElementById('my-points').value = String(sp.pts).replace('.', lang === 'no' ? ',' : '.');
    } else if (sp.pts === null) {
      try { localStorage.removeItem('pk-points'); } catch (e) {}
    }
  } catch (e) {}
  // Open on the whole dataset. This used to open on a hard-coded Rogaland view
  // and correct itself inside a requestAnimationFrame — but rAF does not fire
  // while the tab is not being painted, so a national map could sit there
  // showing one county. Fit first, synchronously, and treat the deferred pass
  // purely as a correction for a pane that was still laying out.
  const pts = DATA.schools.filter(s => s.lat).map(s => [s.lat, s.lon]);
  HOME = L.latLngBounds(pts).pad(0.06);
  map = L.map('map', { zoomControl: false, zoomSnap: 0.25 }).fitBounds(HOME, framePad());
  L.control.zoom({ position: 'bottomright' }).addTo(map);
  addLocateControl();
  map.on('zoomend moveend', () => labelMarkers());
  setTiles();
  let touched = false;
  ['mousedown', 'wheel', 'touchstart'].forEach(ev => map.getContainer()
    .addEventListener(ev, () => { touched = true; }, { once: true, passive: true }));
  setTimeout(() => {
    map.invalidateSize();
    if (!touched) map.fitBounds(HOME, { ...framePad(), animate: false });
  }, 150);
  // a page loaded in a background tab fits its bounds against a 0x0 container
  // and sticks at max zoom; the 150ms correction is lost if the tab is still
  // hidden then. Redo the fit the moment the tab is first shown.
  document.addEventListener('visibilitychange', function fixHiddenBoot() {
    if (document.hidden) return;
    document.removeEventListener('visibilitychange', fixHiddenBoot);
    map.invalidateSize();
    if (!touched) map.fitBounds(HOME, { ...framePad(), animate: false });
  });
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    if (PREFS.theme !== 'auto') return;    // a pinned theme does not follow the OS
    setTiles(); drawMarkers(); renderLegend(); renderCatNote(); renderPointsField();
    if (current) renderSide();
  });
  document.getElementById('side').setAttribute('inert', '');
  document.getElementById('s-filter').addEventListener('input', renderList);
  const ovq = document.getElementById('ov-q');
  ovq.addEventListener('input', () => {
    ovAct = -1; ovHits = runSearch(ovq.value) || []; renderOvList();
  });
  ovq.addEventListener('keydown', ev => {
    if (ev.key === 'ArrowDown') { ev.preventDefault(); ovAct = Math.min(ovAct + 1, ovHits.length - 1); renderOvList(); }
    else if (ev.key === 'ArrowUp') { ev.preventDefault(); ovAct = Math.max(ovAct - 1, -1); renderOvList(); }
    else if (ev.key === 'Enter') { ev.preventDefault(); pickOv(ovAct >= 0 ? ovAct : 0); }
  });
  document.addEventListener('keydown', ev => {
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || '');
    if (((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === 'k') || (ev.key === '/' && !typing)) {
      ev.preventDefault();
      if (!anySheetOpen()) openSearchOv();   // never stack two aria-modal sheets
    }
  });
  let reframe;
  addEventListener('resize', () => {
    clearTimeout(reframe);
    reframe = setTimeout(() => { map.invalidateSize(); liftMapControls(); }, 200);
  });
  document.addEventListener('touchstart', ev => {
    // a floating tooltip should not outlive the reader's attention
    if (!ev.target.closest('[title], .ch, .lv, #tip')) hideTip();
  }, { passive: true });
  addEventListener('popstate', () => {
    // a back-gesture closes what is actually on screen: an open sheet first —
    // and re-pushes the side panel's entry the pop just consumed, so the next
    // back still closes the panel instead of leaving the page
    const sideOpen = document.getElementById('side').classList.contains('open');
    if (anySheetOpen()) {
      // same priority order as the Escape handler, so the two agree
      if (!document.getElementById('contact').hidden) closeContact(true);
      else if (!document.getElementById('intro').hidden) closeIntro(true);
      else if (!document.getElementById('settings').hidden) closeSettings(true);
      else if (!document.getElementById('calc').hidden) closeCalc(true);
      else closeSearchOv(true);
      if (sideOpen && !(history.state || {}).pkSide) {
        try { history.pushState({ pkSide: 1 }, ''); } catch (e) {}
      }
      return;
    }
    if (sideOpen) { closeSide(true); return; }
    // forward-navigation onto a school entry reopens it, so the address bar
    // never claims a school that is not showing
    const fwd = (history.state || {}).pkSide && schoolFromUrl();
    if (fwd) openSide(fwd);
  });
  document.addEventListener('keydown', ev => {
    if (ev.key !== 'Escape') return;
    if (!document.getElementById('contact').hidden) { closeContact(); return; }
    if (!document.getElementById('intro').hidden) { closeIntro(); return; }
    if (!document.getElementById('settings').hidden) { closeSettings(); return; }
    if (!document.getElementById('calc').hidden) { closeCalc(); return; }
    if (!document.getElementById('searchov').hidden) { closeSearchOv(); return; }
    if (document.getElementById('side').classList.contains('open')) closeSide();
  });
  renderPanel(); renderLegend(); renderCatNote(); drawMarkers(); renderChoices();
  try { if (localStorage.getItem('pk-view') === 'list') setView('list'); } catch (e) {}
  const linked = schoolFromUrl();
  if (linked) {
    if (linked.lat) {
      touched = true;                  // the deferred HOME refit must not undo this
      map.setView([linked.lat, linked.lon], 11, { animate: false });
    }
    openSide(linked);
  }
  performance.mark('pk:boot-done');
  let seen = true;
  try { seen = !!localStorage.getItem(INTRO_SEEN); } catch (e) {}
  if (!seen) setTimeout(() => {
    // the visitor may already have opened the contact sheet or a school in
    // these 420ms; the tutorial must not land on top of it
    if (document.getElementById('contact').hidden &&
        !document.getElementById('side').classList.contains('open')) openIntro();
  }, 420);
}
const boot = () => main().catch(e => { console.error(e); bootFailed('bootFailApp'); });
if (document.readyState === 'loading') addEventListener('DOMContentLoaded', boot);
else boot();
</script>
