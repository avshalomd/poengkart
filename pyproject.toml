[project]
name = "poengkart-tools"
version = "0"
description = "The Poengkart data pipeline: county extractors, the forecast model, the dataset builds"
requires-python = ">=3.9"
dependencies = [
  "pdfplumber==0.11.8", "pypdf==6.16.1", "beautifulsoup4==4.15.0", "lxml==6.1.2",
  "openpyxl==3.1.5", "pillow==11.3.0", "numpy==2.0.2", "scipy==1.13.1",
]

[project.optional-dependencies]
test = ["pytest==8.3.5"]

[tool.pytest.ini_options]
testpaths = ["tools/tests"]
