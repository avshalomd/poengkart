# The live source watch: poengkart.no's figures follow the counties within hours.
#
# Every hour from early morning to evening it asks tools/live/schedule.py which
# sources are due (hourly on weekdays in each county's publishing season, daily
# out of it, the sentinel weekly) and runs their scrapers (tools/live/run.py).
# vilbli.no, where Rogaland, Innlandet and Trøndelag publish, refuses GitHub's
# runners (an AWS WAF CAPTCHA), so those three run in a Claude cloud routine
# (routines/live-vilbli.md) that pushes what it finds to a live/cloud-* branch;
# a push there starts this workflow at the processing step.
#
# A document whose content is already in sources/ changes nothing. A new one is
# captured byte for byte under sources/<county>/ with its provenance, on a branch
# live/<time>; the whole pipeline (tools/refresh.py) and every test suite run on
# it, and a pull request says what it changes on the site. tools/live/policy.py
# decides whether it merges and deploys on its own (a new year or a small
# correction does; a lost cell, a large rewrite, a failed gate or a moved report
# number waits for a person).
#
# A scraper that fails, or a capture the pipeline cannot read, gets a GitHub
# issue labelled `heal`, which starts the self-heal routine
# (routines/live-heal.md); the issue closes itself on the next good run. What
# each URL served last, and any page a scraper had to find again, is kept in
# tools/live/state.json on main.
#
# Needs, set by the owner (never in the repo):
#   vars     LIVE_ENABLED=true     the hourly schedule (a manual run works regardless)
#            LIVE_AUTOMERGE=true   let tools/live/policy.py merge; otherwise every update waits
#            VERCEL_ORG_ID, VERCEL_PROJECT_ID
#   secrets  VERCEL_TOKEN          deploy after a merge (without it a merge waits for a deploy)
#            R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY   mirror captures to R2
#   repo     Actions may create pull requests (set 28 Sept 2026)
name: live

on:
  schedule:
    # :23 past every hour 04–19 UTC: 06–21 in Oslo in summer, 05–20 in winter
    - cron: "23 4-19 * * *"
  push:
    branches: ["live/cloud-*"]
  workflow_dispatch:
    inputs:
      only:
        description: "Source ids, space-separated (empty: whatever is due now)"
        required: false
        default: ""
      all:
        description: "Run every source this runner can reach"
        type: boolean
        default: false
      at:
        description: "Pick the due sources as if it were this Oslo time (ISO, e.g. 2026-12-02T14:23)"
        required: false
        default: ""

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: live
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: "1"
  GH_TOKEN: ${{ github.token }}

jobs:
  live:
    if: vars.LIVE_ENABLED == 'true' || github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - run: pip install -q -r tools/requirements.txt

      - name: Git identity
        run: |
          git config user.name "poengkart-live[bot]"
          git config user.email "poengkart-live[bot]@users.noreply.github.com"

      - name: Which sources are due
        id: due
        if: github.event_name != 'push'
        env:
          ONLY: ${{ inputs.only }}
          ALL: ${{ inputs.all }}
          AT: ${{ inputs.at }}
        run: |
          if [ "$ALL" = "true" ]; then sources=$(python3 tools/live/schedule.py ids | tr '\n' ' ')
          elif [ -n "$ONLY" ]; then sources="$ONLY"
          else sources=$(python3 tools/live/schedule.py due ${AT:+--at "$AT"} | tr '\n' ' ')
          fi
          echo "sources=$sources" >> "$GITHUB_OUTPUT"
          echo "due: ${sources:-nothing}"

      - name: Watch
        id: watch
        if: github.event_name != 'push' && steps.due.outputs.sources != ''
        env:
          SOURCES: ${{ steps.due.outputs.sources }}
        run: |
          set +e
          # (unquoted on purpose: one argument per source id; run.py rejects an unknown one)
          python3 tools/live/run.py --only $SOURCES --json "$RUNNER_TEMP/live.json"
          echo "rc=$?" >> "$GITHUB_OUTPUT"

      - name: The cloud relay's report
        id: relay
        if: github.event_name == 'push'
        run: |
          # the routine commits its report beside the captures; it never reaches main.
          # A push without one (the routine's session opening its working branch) is
          # not a hand-over: nothing to do.
          if [ ! -f .live-report.json ]; then
            echo "no .live-report.json on $GITHUB_REF_NAME: not a hand-over"
            echo "has=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "has=1" >> "$GITHUB_OUTPUT"
          mv .live-report.json "$RUNNER_TEMP/live.json"
          python3 -c "import json,sys; r=json.load(open(sys.argv[1])); print('rc=%d' % any(s['status'] in ('FAILED','CHECK-FAIL') for s in r['sources'].values()))" "$RUNNER_TEMP/live.json" >> "$GITHUB_OUTPUT"

      - name: Summary and issues
        id: report
        if: steps.watch.outcome == 'success' || steps.relay.outputs.has == '1'
        env:
          RC: ${{ steps.watch.outputs.rc }}${{ steps.relay.outputs.rc }}
        run: |
          { echo "## Live sources ($GITHUB_EVENT_NAME)"; echo; python3 tools/live/issues.py "$RUNNER_TEMP/live.json" --summary; } >> "$GITHUB_STEP_SUMMARY"
          python3 tools/live/issues.py "$RUNNER_TEMP/live.json"
          n=$(python3 -c "import json,sys; print(len(json.load(open(sys.argv[1]))['captured']))" "$RUNNER_TEMP/live.json")
          echo "captured=$n" >> "$GITHUB_OUTPUT"
          echo "rc=$RC" >> "$GITHUB_OUTPUT"

      - name: Remember what the counties serve (and any healed page)
        if: steps.report.outputs.captured == '0'
        run: |
          state=tools/live/state.json
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            # the relay's state, merged onto main's: its sources are the cloud ones
            cp "$state" "$RUNNER_TEMP/state.json"
            git checkout -q -f origin/main
            python3 tools/live/run.py --merge-state "$RUNNER_TEMP/state.json"
            git push -q origin --delete "$GITHUB_REF_NAME" || true
          fi
          if git diff --quiet -- "$state"; then exit 0; fi
          git add "$state"
          git commit -q -m "The live watch records what the counties serve now (tools/live/state.json)"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 10; done
          exit 1

      # ---- a capture: process it on a branch, gate it, open the pull request ----

      - name: Branch
        id: branch
        if: steps.report.outputs.captured != '0' && steps.report.outputs.captured != ''
        run: |
          b="live/$(date -u +%Y%m%d-%H%M)"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            # main may have moved since the relay cloned it (another capture merged):
            # process on today's main, with only the relay's captures and state
            relay=$(git rev-parse HEAD)
            git checkout -q -f -B "$b" origin/main
            new=$(python3 tools/live/run.py --adopt "$relay")
            git push -q origin --delete "$GITHUB_REF_NAME" || true
            if [ -z "$new" ]; then
              echo "main already holds the relay's captures; keeping its state only"
              git add tools/live/state.json
              git diff --cached --quiet || git commit -q -m "The live watch records what the counties serve now (tools/live/state.json)"
              for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 10; done
              exit 1
            fi
            echo "adopted: $new"
          else git switch -q -c "$b"; fi
          git show origin/main:web/public/data/schools.json > "$RUNNER_TEMP/schools.before.json"
          echo "name=$b" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.branch.outputs.name != ''
        with:
          node-version: 24
          cache: npm

      - name: npm ci
        if: steps.branch.outputs.name != ''
        run: npm ci

      - uses: actions/cache@v4
        if: steps.branch.outputs.name != ''
        with:
          path: tools/.cache
          key: tools-cache-${{ github.run_id }}
          restore-keys: tools-cache-

      - name: Seed the photo probe cache from the published photos
        if: steps.branch.outputs.name != ''
        # photos.py asks each host whether a display-sized photo exists; every URL
        # already published passed that test at the last build, and asking again
        # from a cold cache costs Wikimedia's rate limit about 20 s a photo
        run: |
          python3 - <<'EOF'
          import json, os
          p = 'tools/.cache/photo-probe.json'
          have = set(json.load(open(p))) if os.path.exists(p) else set()
          d = json.load(open(os.environ['RUNNER_TEMP'] + '/schools.before.json'))
          have |= {s['photo'] for s in d['schools'] if str(s.get('photo', '')).startswith('http')}
          os.makedirs('tools/.cache', exist_ok=True)
          json.dump(sorted(have), open(p, 'w'))
          print(len(have), 'photo URLs known')
          EOF

      - name: Pipeline (tools/refresh.py)
        id: pipeline
        if: steps.branch.outputs.name != ''
        continue-on-error: true
        timeout-minutes: 40
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python3 -u tools/refresh.py 2>&1 | tee "$RUNNER_TEMP/refresh.log"

      - name: Dataset tests (pytest)
        id: pytest
        if: steps.pipeline.outcome == 'success'
        continue-on-error: true
        run: python3 -m pytest -q 2>&1 | tee "$RUNNER_TEMP/pytest.log"

      - name: Web tests (typecheck, unit, build, browser)
        id: web
        if: steps.pipeline.outcome == 'success'
        continue-on-error: true
        run: |
          { npm run typecheck && npm run test && npm run build \
            && npx playwright install --with-deps chromium && CI=1 npm run e2e; } 2>&1 | tee "$RUNNER_TEMP/web.log"

      - name: Pull request
        id: pr
        if: steps.branch.outputs.name != ''
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          LIVE_AUTOMERGE: ${{ vars.LIVE_AUTOMERGE }}
          PIPELINE: ${{ steps.pipeline.outcome }}
          PYTEST: ${{ steps.pytest.outcome }}
          WEB: ${{ steps.web.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          T="$RUNNER_TEMP"
          python3 tools/live/diff.py "$T/schools.before.json" web/public/data/schools.json --json "$T/diff.json" > /dev/null
          {
            echo "- \`tools/refresh.py\` (build, geocode, model, report, test_parse, test_model, test_docs): **$PIPELINE**"
            echo "- \`pytest\`: **${PYTEST:-skipped}**"
            echo "- web (typecheck, unit, build, browser): **${WEB:-skipped}**"
            echo "- Run: $RUN_URL"
          } > "$T/gates.md"
          title=$(python3 tools/live/pr.py title "$T/live.json")
          git add -A
          git commit -q -m "$title" || true
          git diff --name-only origin/main...HEAD > "$T/files.txt"
          passed=""; [ "$PIPELINE" = success ] && [ "$PYTEST" = success ] && [ "$WEB" = success ] && passed="--gates-passed"
          set +e
          python3 tools/live/policy.py data "$T/diff.json" $passed --changed-files "$T/files.txt" > "$T/policy.txt"
          merge=$?
          set -e
          sed -i '1s/^/**Merges on its own:** /' "$T/policy.txt"
          python3 tools/live/pr.py body "$T/live.json" "$T/diff.json" "$T/gates.md" "$T/policy.txt" > "$T/body.md"
          git push -q -f -u origin "HEAD:$BRANCH"
          gh label create live --force --color 0e8a16 --description "The live source watch (tools/live)" > /dev/null
          url=$(gh pr create --base main --head "$BRANCH" --title "$title" --body-file "$T/body.md" --label live)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Pull request: $url" >> "$GITHUB_STEP_SUMMARY"
          if [ $merge -eq 0 ]; then
            if gh pr merge "$url" --squash --delete-branch; then
              echo "merged=true" >> "$GITHUB_OUTPUT"
            else
              # main changed generated files while the pipeline ran
              gh pr comment "$url" --body "Not merged: main moved while this ran and the generated files conflict. Close this and re-run the source (Actions → live → Run workflow, only: the source id), or rebase and re-run tools/refresh.py."
              echo "::warning::$url passed its gates but conflicts with main"
            fi
          elif grep -q "test_docs.py failed" "$T/refresh.log" 2>/dev/null; then
            # the data is fine; the refit moved a number the technical report quotes
            gh issue create --title "live: the report needs the new numbers ($BRANCH)" --body \
              "The capture in $url was processed, but the refit moved numbers that docs/technical-report.md quotes (test_docs.py; see $RUN_URL). Update the report on the branch, then merge."
          elif [ -z "$passed" ]; then
            {
              echo "The live watch captured a document, but the pipeline or a test suite failed on it."
              echo; echo "Pull request: $url"; echo "Run: $RUN_URL"; echo
              echo '```'; tail -c 3000 "$T/refresh.log" 2>/dev/null; tail -c 1500 "$T/pytest.log" 2>/dev/null; tail -c 1500 "$T/web.log" 2>/dev/null; echo '```'
              echo; echo "The capture stays on the branch; nothing reached poengkart.no. The self-heal routine (routines/live-heal.md) takes it from here."
            } > "$T/issue.md"
            gh label create heal --force --color d93f0b --description "A live scraper needs repair; starts the self-heal routine" > /dev/null
            gh issue create --title "live: processing $BRANCH" --label heal --body-file "$T/issue.md"
          fi

      - name: Deploy
        if: steps.pr.outputs.merged == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          PR: ${{ steps.pr.outputs.url }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            msg="Merged to main, not deployed: the VERCEL_TOKEN secret is not set. Deploy by hand (vercel deploy --prod) or set it."
            echo "::warning::$msg"; echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            gh pr comment "$PR" --body "$msg" || true
            exit 0
          fi
          git fetch -q origin main && git checkout -q FETCH_HEAD
          npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN" | tee "$RUNNER_TEMP/deploy.log"
          sleep 20
          want=$(sha256sum web/public/data/schools.json | cut -d' ' -f1)
          got=$(curl -sfL "https://poengkart.no/data/schools.json?live=$GITHUB_RUN_ID" | sha256sum | cut -d' ' -f1)
          if [ "$want" = "$got" ]; then echo "poengkart.no serves the new schools.json" >> "$GITHUB_STEP_SUMMARY"
          else echo "::warning::poengkart.no does not serve the merged schools.json yet"; fi
          gh pr comment "$PR" --body "Deployed to https://poengkart.no ($(tail -1 "$RUNNER_TEMP/deploy.log"))."

      - name: Fail the run when a source failed
        if: steps.report.outputs.rc == '1'
        run: |
          echo "A source failed or failed its check; its issue is open (title «live: <source>»)."
          exit 1
